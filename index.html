    <div style="background:#f8f7f5;border-radius:8px;padding:14px 18px;margin-bottom:20px"><div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px">Paciente</div><div style="font-size:16px;font-weight:600;color:#2C3740">${pr.paciente||''}</div><div style="font-size:12px;color:#666;margin-top:2px">${pr.cedula||''}</div></div>
    <div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:600">Procedimientos</div>
    ${(pr.items||[]).map((item,i)=>`<div class="presup-item-row"><div style="font-size:11px;color:#999;min-width:20px">${i+1}.</div><div style="font-size:13px;color:#1a1a1a;flex:1">${item.desc||''}</div><div style="font-size:13px;font-weight:600;color:#2C3740;min-width:80px;text-align:right">${item.monto>0?fmtUSD(item.monto):'Consultar'}</div></div>`).join('')}
    <hr style="border:none;border-top:1px solid #ddd;margin:14px 0">
    ${esCir?`<div style="font-size:12px;color:#555;margin-bottom:8px">Abono (30%): <strong>${total>0?fmtUSD(Math.round(total*.3)):'-'}</strong> · Saldo (70%): <strong>${total>0?fmtUSD(Math.round(total*.7)):'-'}</strong></div>`:`<div style="display:flex;justify-content:flex-end;align-items:baseline;gap:8px"><span style="font-size:12px;color:#888">Total</span><span style="font-size:20px;font-weight:600;color:#2C3740;font-family:'Cormorant Garamond',serif">${total>0?fmtUSD(total):'Consultar'}</span></div>`}
    ${total>0?`<div style="background:${pagado>=total?'#eaf3de':'#faeeda'};border-radius:8px;padding:12px 16px;margin-top:14px;font-size:12px;color:#444"><strong>${pagado>=total?'✓ Saldado':`Pendiente por cobrar: ${fmtUSD(saldo)}`}</strong><br>Pagado hasta ahora: ${fmtUSD(pagado)} de ${fmtUSD(total)}</div>`:''}
    ${total>0&&pr.bcvRate?`<div style="font-size:10.5px;color:#999;margin-top:8px">Tasa BCV aplicada el día de la cotización: <strong>${pr.bcvRate} Bs/$</strong> · Equivalente: ${(total*pr.bcvRate).toLocaleString('es-VE',{maximumFractionDigits:2})} Bs</div>`:''}
    <div style="font-size:11px;color:#888;line-height:1.7;margin-top:16px;padding-top:14px;border-top:1px solid #eee">Precios en USD. Vigencia ${pr.vigencia||90} días. Vence: ${exp.toLocaleDateString('es-VE',{day:'2-digit',month:'long',year:'numeric',timeZone:'America/Caracas'})}.</div>
  </div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cerrar</button>${total>0&&pagado<total?`<button class="btn-outline" onclick="registrarPagoPresupuesto('${pr.id}')">💰 Registrar pago</button>`:''}<button class="btn btn-gold" onclick="window.print()">🖨 Imprimir</button></div>`);
}
function registrarPagoPresupuesto(id){
  const pr=STATE.presupuestos.find(x=>x.id===id);if(!pr)return;

}

function savePresupuesto(){

  <div class="form-row"><div class="form-group"><label class="form-label">Paciente</label>${buildPacienteSelect('f-cpat',patId)}</div><div class="form-group"><label class="form-label">Fecha (VET)</label><input class="form-input" type="date" id="f-cdate" value="${todayVET()}"></div></div>

  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveCita()">Confirmar</button></div>`);
}
function saveCita(force){
  const patId=$('f-cpat').value;const p=STATE.patients.find(x=>x.id===patId);if(!p){showToast('Selecciona un paciente de la lista');return;}
  const time=$('f-ctime').value,proc=$('f-cproc').value,fecha=$('f-cdate').value;
  const co=$('f-ccons');const consLabel=co.options[co.selectedIndex].text.split('·')[0].trim();
  if(!force){
    const conflicto=STATE.appointments.find(a=>a.fecha===fecha&&a.time===time&&a.consultorio===consLabel);
    if(conflicto){
      openModal(`<div class="modal-title">⚠️ Consultorio ocupado</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px"><strong style="color:var(--gold)">${consLabel}</strong> ya tiene a <strong>${conflicto.patient}</strong> agendado el <strong>${fmtDateVET(fecha)}</strong> a las <strong>${time}</strong>.<br><br>¿Quieres agendar a ${p.name} en el mismo horario de todas formas, o prefieres cambiar la hora o el consultorio?</div>
      <div class="modal-actions"><button class="btn-outline" onclick="openNewCita('${patId}')">Cambiar hora/consultorio</button><button class="btn btn-gold" onclick="saveCita(true)">Agendar de todas formas</button></div>`);
      return;
    }
  }
  STATE.appointments.push({id:'A'+Date.now(),fecha,time,patient:p.name,proc,doc:getMedicoLabel(),status:'pendiente',consultorio:consLabel,timezone:'VET'});
  STATE.appointments.sort((a,b)=>a.fecha===b.fecha?a.time.localeCompare(b.time):a.fecha.localeCompare(b.fecha));
  $('badge-agenda').textContent=STATE.appointments.length;
  closeModal();showToast(`Cita: ${p.name} · ${fecha} ${time} VET`);
  syncToSheet('Citas',STATE.appointments);
  if(STATE.view==='agenda')renderAgenda();else renderDashboard();
}

        <div style="display:flex;gap:16px;margin-bottom:8px"><span style="font-size:12px;color:var(--text2)">👥 ${tp} inscritos</span><span style="font-size:12px;color:var(--green)">✅ ${pg} pagados</span><span style="font-size:12px;color:var(--red)">⏳ ${tp-pg} pendientes</span></div>

// ── MARKETING ─────────────────────────────────────────────────────────────────
function getProximosCumpleanos(){
  const hoy=nowVET();const hoyMD=hoy.getMonth()*100+hoy.getDate();
  return STATE.patients.filter(p=>p.dob&&p.dob!=='—').map(p=>{
    const d=new Date(p.dob+'T12:00:00');const md=d.getMonth()*100+d.getDate();
    let diff=md-hoyMD;if(diff<0)diff+=1200; // aproximación simple para cruzar de diciembre a enero
    return{...p,diasCumple:diff};
  }).filter(p=>p.diasCumple<=7).sort((a,b)=>a.diasCumple-b.diasCumple);
}

// ── SEGUIMIENTO POST-TRATAMIENTO (detecta solo, según la última consulta de cada paciente) ──
function getSeguimientosPendientes(){
  const hoy=todayVET();
  const pendientes=[];
  STATE.patients.forEach(p=>{
    const hc=STATE.hcData[p.id];
    if(!hc||!hc.consultas||!hc.consultas.length)return;
    const ultima=hc.consultas[0];
    if(!ultima||!ultima.fecha)return;
    const dias=Math.round((new Date(hoy+'T12:00:00')-new Date(ultima.fecha+'T12:00:00'))/86400000);
    if(dias<2||dias>30)return;
    if(dias>=7&&!ultima.segRealizado7d)pendientes.push({patient:p,proc:ultima.proc,tipo:'7d',etiqueta:'Seguimiento 7 días',dias});
    else if(dias>=2&&!ultima.segRealizado48)pendientes.push({patient:p,proc:ultima.proc,tipo:'48h',etiqueta:'Seguimiento 48h',dias});
  });
  return pendientes.sort((a,b)=>a.dias-b.dias);
}
function marcarSeguimientoHecho(patientId,tipo){
  const hc=STATE.hcData[patientId];if(!hc||!hc.consultas||!hc.consultas.length)return;
  const ultima=hc.consultas[0];
  if(tipo==='48h')ultima.segRealizado48=true;else ultima.segRealizado7d=true;
  persistHCData();showToast('Seguimiento marcado como hecho');renderMarketing();
}

function getPacientesInactivos(){
  const hoy=todayVET();
  return STATE.patients.filter(p=>(p.etapa||'paciente')==='paciente'&&p.lastVisit&&p.lastVisit!=='—').map(p=>{
    const dias=Math.round((new Date(hoy+'T12:00:00')-new Date(p.lastVisit+'T12:00:00'))/86400000);
    return{...p,diasInactivo:dias};
  }).filter(p=>p.diasInactivo>=90).sort((a,b)=>b.diasInactivo-a.diasInactivo);
}

  const movs=STATE.movimientos;
  const ing=movs.filter(m=>m.tipo==='ingreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  const egr=movs.filter(m=>m.tipo==='egreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  $('content-area').innerHTML=`
  <div class="rep-tabs">
    ${['financiero','pacientes','agenda'].map(t=>`<button class="rep-tab${STATE.activeRepTab===t?' active':''}" onclick="switchRepTab('${t}')">${{financiero:'💰 Financiero',pacientes:'👥 Pacientes',agenda:'📅 Agenda'}[t]}</button>`).join('')}
  </div>
  <div id="rep-content">${buildRepTab(STATE.activeRepTab)}</div>`;
  setTimeout(()=>drawRepCharts(STATE.activeRepTab),120);
}
function switchRepTab(tab){
  STATE.activeRepTab=tab;Object.keys(chartsInstances).forEach(destroyChart);
  document.querySelectorAll('.rep-tab').forEach(b=>b.classList.toggle('active',b.textContent.includes(tab==='financiero'?'💰':tab==='pacientes'?'👥':'📅')));
  const el=$('rep-content');if(el)el.innerHTML=buildRepTab(tab);
  setTimeout(()=>drawRepCharts(tab),120);
}
function buildRepTab(tab){
  const movs=STATE.movimientos;
  const ing=movs.filter(m=>m.tipo==='ingreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  const egr=movs.filter(m=>m.tipo==='egreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  if(tab==='financiero')return`
    <div class="rep-kpi-grid">
      <div class="rep-kpi"><div class="rep-kpi-label">Ingresos USD</div><div class="rep-kpi-value">${fmtUSD(ing)}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Egresos USD</div><div class="rep-kpi-value">${fmtUSD(egr)}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Balance</div><div class="rep-kpi-value">${fmtUSD(ing-egr)}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Movimientos</div><div class="rep-kpi-value">${movs.length}</div></div>
    </div>
    <div class="rep-grid">
      <div class="chart-card"><div class="chart-title">Ingresos vs Egresos</div><div class="chart-subtitle">USD acumulado</div><div class="chart-wrap"><canvas id="chart-ing-egr"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">Por método de pago</div><div class="chart-subtitle">Distribución</div><div class="chart-wrap"><canvas id="chart-metodos"></canvas></div></div>
    </div>`;
  if(tab==='pacientes')return`
    <div class="rep-kpi-grid">
      <div class="rep-kpi"><div class="rep-kpi-label">Total</div><div class="rep-kpi-value">${STATE.patients.length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">VIP</div><div class="rep-kpi-value">${STATE.patients.filter(p=>(p.tags||[]).includes('VIP')).length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Nuevos</div><div class="rep-kpi-value">${STATE.patients.filter(p=>(p.tags||[]).some(t=>t==='Nueva'||t==='Nuevo')).length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Cirugía</div><div class="rep-kpi-value">${STATE.patients.filter(p=>(p.tags||[]).includes('Cirugía')).length}</div></div>
    </div>
    <div class="card"><div class="card-title">Por procedimientos</div>${STATE.patients.sort((a,b)=>(b.procedures||0)-(a.procedures||0)).map((p,i)=>`<div class="rank-item"><div class="rank-num">#${i+1}</div><div style="font-size:12px;color:var(--text);flex:1">${p.name}</div><div class="rank-bar-wrap"><div class="rank-bar" style="width:${STATE.patients[0]?.procedures>0?Math.round((p.procedures||0)/STATE.patients[0].procedures*100):0}%"></div></div><div style="font-size:12px;font-weight:600;color:var(--text2)">${p.procedures||0}</div></div>`).join('')||'<div style="color:var(--text3);font-size:13px">Sin datos</div>'}</div>`;
  if(tab==='agenda')return`
    <div class="rep-kpi-grid">
      <div class="rep-kpi"><div class="rep-kpi-label">Total citas</div><div class="rep-kpi-value">${STATE.appointments.length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Confirmadas</div><div class="rep-kpi-value">${STATE.appointments.filter(a=>a.status==='confirmado').length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Pendientes</div><div class="rep-kpi-value">${STATE.appointments.filter(a=>a.status==='pendiente').length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Completadas</div><div class="rep-kpi-value">${STATE.appointments.filter(a=>a.status==='completado').length}</div></div>
    </div>
    <div class="card"><div class="card-title">Todas las citas</div>${STATE.appointments.map(a=>`<div class="rank-item"><div style="font-size:11px;color:var(--gold);min-width:80px">${a.fecha}</div><div style="font-size:11px;color:var(--text3);min-width:50px">${a.time} VET</div><div style="font-size:12px;color:var(--text);flex:1">${a.patient}</div><span class="status-badge ${statusMap[a.status].cls}">${statusMap[a.status].label}</span></div>`).join('')||'<div style="color:var(--text3);font-size:13px;padding:16px 0">Sin citas.</div>'}</div>`;
  return'';
}
function drawRepCharts(tab){
  const cd={color:'#a0b0bc',grid:'rgba(176,184,193,0.08)',gold:'#C9A452',green:'#1D9E75',blue:'#378ADD',red:'#E24B4A'};
  const movs=STATE.movimientos;
  if(tab==='financiero'){
    const ing=movs.filter(m=>m.tipo==='ingreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
    const egr=movs.filter(m=>m.tipo==='egreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
    const c1=$('chart-ing-egr');if(c1){chartsInstances['c1']=new Chart(c1,{type:'bar',data:{labels:['Ingresos','Egresos','Balance'],datasets:[{data:[ing,egr,ing-egr],backgroundColor:['rgba(29,158,117,0.6)','rgba(226,75,74,0.5)','rgba(201,164,82,0.6)'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:cd.color},grid:{color:cd.grid}},y:{ticks:{color:cd.color,callback:v=>'$'+v},grid:{color:cd.grid}}}}});}
    const byM={};movs.filter(m=>m.tipo==='ingreso').forEach(m=>{byM[m.metodo||'']=(byM[m.metodo||'']||0)+Number(m.monto);});
    const c2=$('chart-metodos');if(c2&&Object.keys(byM).length){chartsInstances['c2']=new Chart(c2,{type:'doughnut',data:{labels:Object.keys(byM),datasets:[{data:Object.values(byM),backgroundColor:[cd.gold,'rgba(201,164,82,0.6)',cd.blue,cd.green,'#7F77DD'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'right',labels:{color:cd.color,font:{size:11},boxWidth:12}}}}});}
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function updateClock(){
  const n=nowVET();
  $('fecha-hoy').textContent=n.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+' · '+n.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})+' VET';
}
updateClock();
setInterval(updateClock,60000);
loadAllData();
</script>
</body>
</html>
