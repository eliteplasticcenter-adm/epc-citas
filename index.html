function formEstado(f){return FORM_ESTADOS[f.estado]?f.estado:((f.fechaFin||f.fecha||'')<todayVET()?'realizada':'convocatoria');}
function formReserva(f){return f.reserva!==undefined&&f.reserva!==''&&f.reserva!==null?Number(f.reserva)||0:Math.round((Number(f.precio)||0)*0.3*100)/100;}
function parPrecio(f,p){return p.monto!==undefined&&p.monto!==''&&p.monto!==null?Number(p.monto)||0:Number(f.precio)||0;}
function parPagado(f,p){
  const movs=STATE.movimientos.filter(m=>m.tipo==='ingreso'&&m.formacionId===f.id&&m.participanteId===p.id);
  if(movs.length)return movs.reduce((s,m)=>s+montoEnUSD(m),0);
  return p.pagado?parPrecio(f,p):0; // registros antiguos marcados como pagados sin movimiento de caja
}
function parEstado(f,p){
  const pag=parPagado(f,p),precio=parPrecio(f,p),res=Math.min(formReserva(f),precio);
  if(precio>0&&pag>=precio-0.01)return['pagado','Pagado','badge-green'];
  if(pag>0&&pag>=res-0.01)return['reservado','Plaza reservada','badge-blue'];
  if(pag>0)return['parcial','Reserva incompleta','badge-gold'];
  if(precio<=0)return['pagado','Sin costo','badge-gray'];
  return['interesado','Sin reserva','badge-gray'];
}
function formAlumnos(f){return Array.isArray(f.participantes)?f.participantes:[];}
function formConPlaza(f){return formAlumnos(f).filter(p=>['pagado','reservado'].includes(parEstado(f,p)[0]));}
function formRecaudado(f){return formAlumnos(f).reduce((s,p)=>s+parPagado(f,p),0);}
function formPorCobrar(f){return formConPlaza(f).reduce((s,p)=>s+Math.max(0,parPrecio(f,p)-parPagado(f,p)),0);}
function formHorario(f){return f.horaIni&&f.horaFin?`${f.horaIni} a ${f.horaFin}`:'todo el día';}
function formFechas(f){return f.fecha?(fmtDateVET(f.fecha)+(f.fechaFin&&f.fechaFin!==f.fecha?' al '+fmtDateVET(f.fechaFin):'')):'Sin fecha';}

// Bloqueo en la agenda
function formacionesDelDia(fecha){return(STATE.formaciones||[]).filter(x=>x.fecha&&x.bloquea!==false&&x.estado!=='cancelada'&&fecha>=x.fecha&&fecha<=(x.fechaFin||x.fecha));}
function formacionEnSlot(fecha,time){
  const m=minutos(time);
  return formacionesDelDia(fecha).find(x=>(!x.horaIni||!x.horaFin)?true:(m>=minutos(x.horaIni)&&m<minutos(x.horaFin)))||null;
}
function bannerFormacion(f){
  return`<div class="form-banner" onclick="abrirFormacion('${jsq(f.id)}')"><div style="flex:1;min-width:0"><div style="font-weight:600">Formación: ${esc(f.nombre||'')}</div><div style="font-size:12px;opacity:.85;margin-top:2px">Agenda bloqueada ${formHorario(f)} · ${formConPlaza(f).length} alumno(s) con plaza${f.lugar?' · '+esc(f.lugar):''}</div></div><span style="font-size:12px;font-weight:600">Abrir</span></div>`;
}

function abrirFormacion(id){STATE.formActiva=id;try{closeModal();}catch(e){}showView('formaciones');}
function cerrarFormacion(){STATE.formActiva=null;renderFormaciones();}
function guardarFormaciones(){syncToSheet('Formaciones',STATE.formaciones);if(STATE.view==='formaciones')renderFormaciones();}

function renderFormaciones(){
  const act=STATE.formActiva?STATE.formaciones.find(f=>f.id===STATE.formActiva):null;
  if(act){renderFormacion(act);return;}
  STATE.formActiva=null;
  const fs=(STATE.formaciones||[]).slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
  const hoy=todayVET();
  const proximas=fs.filter(f=>(f.fechaFin||f.fecha||'')>=hoy&&formEstado(f)!=='cancelada').reverse();
  const pasadas=fs.filter(f=>!proximas.includes(f));
  const tarjeta=f=>{const e=formEstado(f);const con=formConPlaza(f).length,tot=formAlumnos(f).length;const cupos=Number(f.cupos)||0;
    return`<div class="presup-card" onclick="abrirFormacion('${jsq(f.id)}')"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--text)">${esc(f.nombre||'')}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${formFechas(f)} · ${formHorario(f)}${f.lugar?' · '+esc(f.lugar):''}</div><div style="font-size:11.5px;color:var(--text3);margin-top:4px">${con} con plaza${cupos?' de '+cupos+' cupos':''}${tot-con>0?' · '+(tot-con)+' sin reserva':''}</div>${cupos?`<div class="proc-bar-wrap" style="height:5px;margin-top:6px;max-width:220px"><div class="proc-bar" style="width:${Math.min(100,Math.round(con*100/cupos))}%;background:var(--ink)"></div></div>`:''}</div><div style="text-align:right"><span class="status-badge ${FORM_ESTADOS[e][1]}">${FORM_ESTADOS[e][0]}</span><div style="font-size:13px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums">${fmtMonto(Math.round(formRecaudado(f)))}</div><div style="font-size:11px;color:var(--text3)">recaudado</div></div></div>`;};
  $('content-area').innerHTML=`
  <div class="section-header"><div class="section-title">Formaciones (${fs.length})</div></div>
  ${fs.length?`
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="kpi-card"><div class="kpi-label">Próxima formación</div><div class="kpi-value" style="font-size:20px">${proximas.length?fmtDateVET(proximas[0].fecha):'—'}</div><div class="kpi-sub">${proximas.length?esc(proximas[0].nombre||''):'Ninguna convocada'}</div></div>
    <div class="kpi-card"><div class="kpi-label">Alumnos con plaza</div><div class="kpi-value">${proximas.reduce((s,f)=>s+formConPlaza(f).length,0)}</div><div class="kpi-sub">En formaciones próximas</div></div>
    <div class="kpi-card"><div class="kpi-label">Por cobrar a alumnos</div><div class="kpi-value" style="${proximas.reduce((s,f)=>s+formPorCobrar(f),0)>0?'color:var(--gold)':''}">${fmtMonto(Math.round(proximas.reduce((s,f)=>s+formPorCobrar(f),0)))}</div><div class="kpi-sub">Saldo de plazas reservadas</div></div>
  </div>
  ${proximas.length?`<div style="font-size:13px;font-weight:600;color:var(--text2);margin:0 0 8px 2px">Próximas</div><div class="presup-list" style="margin-bottom:18px">${proximas.map(tarjeta).join('')}</div>`:''}
  ${pasadas.length?`<div style="font-size:13px;font-weight:600;color:var(--text2);margin:0 0 8px 2px">Anteriores</div><div class="presup-list">${pasadas.map(tarjeta).join('')}</div>`:''}
  `:`<div class="card" style="text-align:center;padding:40px;color:var(--text2);line-height:1.6">Aquí se llevan las formaciones para médicos: convocatoria, alumnos, reservas y cobros.<br>La formación bloquea su horario en la agenda de la clínica.<br><button class="btn btn-gold" style="margin-top:14px" onclick="openNuevaFormacion()">Crear la primera convocatoria</button></div>`}`;
}

  <div class="form-group" style="margin-top:8px"><label class="form-label">Descripción</label><textarea class="form-input" id="ff-desc" rows="2" placeholder="Contenido, nivel, docente">${v('desc')}</textarea></div>

function guardarFormacion(id){
  const nombre=$('ff-nombre').value.trim();if(!nombre){showToast('El nombre es obligatorio');return;}
  const fecha=$('ff-fecha').value;if(!fecha){showToast('Indica la fecha');return;}
  let fin=$('ff-fin').value;if(fin&&fin<fecha)fin='';
  const ini=$('ff-ini').value,finh=$('ff-finh').value;
  if(ini&&finh&&minutos(finh)<=minutos(ini)){showToast('La hora de fin debe ser posterior a la de inicio');return;}
  const precio=parseFloat($('ff-precio').value)||0;const rv=$('ff-reserva').value;
  const datos={nombre,fecha,fechaFin:fin,horaIni:ini,horaFin:finh,precio,reserva:rv===''?Math.round(precio*30)/100:Math.min(precio,parseFloat(rv)||0),cupos:parseInt($('ff-cupos').value)||0,modalidad:$('ff-modalidad').value,lugar:$('ff-lugar').value.trim(),desc:$('ff-desc').value.trim(),bloquea:$('ff-bloquea').checked};
  let f=id?STATE.formaciones.find(x=>x.id===id):null;
  if(f)Object.assign(f,datos);
  else{f=Object.assign({id:'F'+Date.now(),estado:'convocatoria',participantes:[],creadaEl:new Date().toISOString()},datos);STATE.formaciones.unshift(f);}
  closeModal();
  const choque=datos.bloquea?STATE.appointments.filter(a=>!['cancelado','no_asistio'].includes(a.status)&&formacionEnSlot(a.fecha,a.time)&&formacionEnSlot(a.fecha,a.time).id===f.id).length:0;
  showToast(choque?`Formación guardada · ojo: hay ${choque} cita(s) en ese horario`:(id?'Formación guardada':'Convocatoria creada'));
  STATE.formActiva=f.id;syncToSheet('Formaciones',STATE.formaciones);
  if(STATE.view==='formaciones')renderFormaciones();else showView('formaciones');
}
function setEstadoFormacion(id,estado){
  const f=STATE.formaciones.find(x=>x.id===id);if(!f||!FORM_ESTADOS[estado])return;
  f.estado=estado;f[estado+'El']=new Date().toISOString();showToast('Formación: '+FORM_ESTADOS[estado][0]);guardarFormaciones();
}

function renderFormacion(f){
  const id=jsq(f.id);const e=formEstado(f);const al=formAlumnos(f);const con=formConPlaza(f);const cupos=Number(f.cupos)||0;
  const rec=formRecaudado(f),pc=formPorCobrar(f);const res=formReserva(f);

  const lleno=cupos>0&&con.length>=cupos;

  <div style="margin-bottom:12px"><button class="btn-outline btn-sm" onclick="cerrarFormacion()">‹ Todas las formaciones</button></div>
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div><div style="font-size:20px;font-weight:650;letter-spacing:-.015em">${esc(f.nombre||'')}</div><div style="font-size:13px;color:var(--text2);margin-top:3px">${formFechas(f)} · ${formHorario(f)}${f.lugar?' · '+esc(f.lugar):''}</div><div style="font-size:12px;color:var(--text3);margin-top:3px">${fmtMonto(f.precio)} por alumno · reserva de plaza ${fmtMonto(res)}${f.bloquea!==false?' · bloquea la agenda':''}</div></div>
      <span class="status-badge ${FORM_ESTADOS[e][1]}">${FORM_ESTADOS[e][0]}</span>
    </div>
    ${f.desc?`<div style="font-size:12.5px;color:var(--text2);margin-top:10px">${esc(f.desc)}</div>`:''}
    ${citas.length?`<div class="aviso aviso-ambar">Hay ${citas.length} cita(s) de pacientes dentro del horario bloqueado: ${esc(citas.slice(0,4).map(a=>a.time+' '+a.patient).join(', '))}. Conviene reprogramarlas.</div>`:''}
    <div class="cita-acc">
      ${e==='convocatoria'?`<button class="btn btn-gold" onclick="openAlumno('${id}')"${lleno?' disabled style="opacity:.5"':''}>${lleno?'Cupos completos':'Inscribir alumno'}</button>`:''}
      <button class="btn-outline" onclick="openNuevaFormacion('${id}')">Editar</button>
      <button class="btn-outline" onclick="STATE.agendaDia='${esc(f.fecha||todayVET())}';STATE.agendaVista='dia';showView('agenda')">Ver en la agenda</button>
    </div>
    <details class="mas-op" style="margin-top:12px"><summary>Más opciones</summary><div class="cita-acc">
      ${e==='convocatoria'?`<button class="icon-btn btn-sm" onclick="setEstadoFormacion('${id}','cerrada')">Cerrar inscripción</button>`:''}
      ${e==='cerrada'?`<button class="icon-btn btn-sm" onclick="setEstadoFormacion('${id}','convocatoria')">Reabrir inscripción</button>`:''}
      ${e!=='realizada'&&e!=='cancelada'?`<button class="icon-btn btn-sm" onclick="setEstadoFormacion('${id}','realizada')">Marcar como realizada</button><button class="icon-btn btn-sm" onclick="setEstadoFormacion('${id}','cancelada')">Cancelar formación</button>`:`<button class="icon-btn btn-sm" onclick="setEstadoFormacion('${id}','convocatoria')">Reabrir</button>`}
      <button class="icon-btn btn-sm" style="color:var(--text3)" onclick="STATE.formActiva=null;eliminarFormacion('${id}')">Archivar</button>
    </div></details>
  </div>
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="kpi-card"><div class="kpi-label">Plazas confirmadas</div><div class="kpi-value">${con.length}${cupos?` <span style="font-size:14px;color:var(--text3);font-weight:500">de ${cupos}</span>`:''}</div><div class="kpi-sub">${al.length-con.length} inscrito(s) sin reserva</div></div>
    <div class="kpi-card"><div class="kpi-label">Recaudado</div><div class="kpi-value" style="color:var(--green)">${fmtMonto(Math.round(rec))}</div><div class="kpi-sub">Cobrado en caja</div></div>
    <div class="kpi-card"><div class="kpi-label">Por cobrar</div><div class="kpi-value" style="${pc>0?'color:var(--gold)':''}">${fmtMonto(Math.round(pc))}</div><div class="kpi-sub">Saldo de plazas reservadas</div></div>
  </div>
  <div class="card"><div class="card-title">Alumnos (${al.length})</div>
    ${al.length?al.map(p=>{const es=parEstado(f,p),pg=parPagado(f,p),pr=parPrecio(f,p),sal=Math.max(0,pr-pg);const pid=jsq(p.id);const falta=Math.max(0,Math.min(res,pr)-pg);

      ${e==='realizada'?`<label class="chk-fila" style="border:none;padding:0;flex:none"><input type="checkbox" ${p.asistio?'checked':''} onchange="marcarAsistencia('${id}','${pid}')"><span style="font-size:12px">Asistió</span></label>`:''}
      <span class="status-badge ${es[2]}">${es[1]}</span>
      ${sal>0?`<button class="btn ${falta>0?'btn-gold':''} ${falta>0?'':'btn-outline'} btn-sm" onclick="cobrarAlumno('${id}','${pid}')">${falta>0?'Cobrar reserva':'Cobrar saldo'}</button>`:''}</div>`;}).join(''):'<div style="color:var(--text3);font-size:13px;padding:8px 0">Aún no hay alumnos inscritos. La plaza queda confirmada cuando se cobra la reserva.</div>'}

}
function openAlumno(formId,parId){
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;
  const p=parId?formAlumnos(f).find(x=>x.id===parId):null;const v=k=>esc(p&&p[k]!==undefined&&p[k]!==null?p[k]:'');
  openModal(`<div class="modal-title">${p?'Datos del alumno':'Inscribir alumno'}</div>
  <div style="font-size:12.5px;color:var(--text2);margin:-8px 0 14px">${esc(f.nombre||'')} · ${formFechas(f)}</div>
  <div class="form-group"><label class="form-label">Nombre y apellido *</label><input class="form-input" id="fpar-nombre" value="${v('nombre')}" placeholder="Dr. o Dra."></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Teléfono *</label><input class="form-input" id="fpar-ws" type="tel" inputmode="tel" value="${v('whatsapp')}" placeholder="+58 412 000 0000"></div><div class="form-group"><label class="form-label">Correo *</label><input class="form-input" id="fpar-email" type="email" inputmode="email" value="${v('email')}"></div></div>
  <details class="mas-op"${p?' open':''}><summary>Más datos (opcional)</summary>
    <div class="form-row" style="margin-top:12px"><div class="form-group"><label class="form-label">Especialidad</label><input class="form-input" id="fpar-esp" value="${v('especialidad')}"></div><div class="form-group"><label class="form-label">País o ciudad</label><input class="form-input" id="fpar-pais" value="${v('pais')}"></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">N.º de colegio médico</label><input class="form-input" id="fpar-col" value="${v('colegio')}"></div><div class="form-group"><label class="form-label">Precio para este alumno ($)</label><input class="form-input" id="fpar-monto" type="number" min="0" step="0.01" value="${p?parPrecio(f,p):(Number(f.precio)||0)}"></div></div>
  </details>
  <div class="modal-actions" style="flex-wrap:wrap">${p?`<button class="btn-outline" onclick="eliminarParticipante('${jsq(formId)}','${jsq(p.id)}')">Dar de baja</button>`:''}<button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="guardarParticipante('${jsq(formId)}','${p?jsq(p.id):''}')">${p?'Guardar':'Inscribir y cobrar reserva'}</button></div>`);
}
function openAgregarParticipante(formId){openAlumno(formId);}
function guardarParticipante(formId,parId){
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;
  const nombre=$('fpar-nombre').value.replace(/\s+/g,' ').trim(),tel=$('fpar-ws').value.trim(),mail=$('fpar-email').value.trim();
  if(nombre.split(' ').filter(Boolean).length<2){showToast('Escribe nombre y apellido');return;}
  if(tel.replace(/\D/g,'').length<7){showToast('Falta un teléfono de contacto válido');return;}
  if(!emailValido(mail)){showToast('Falta un correo válido');return;}
  const datos={nombre,whatsapp:tel,email:mail,especialidad:$('fpar-esp').value.trim(),pais:$('fpar-pais').value.trim(),colegio:$('fpar-col').value.trim(),monto:parseFloat($('fpar-monto').value)||0};
  if(!Array.isArray(f.participantes))f.participantes=[];
  let p=parId?f.participantes.find(x=>x.id===parId):null;
  if(!p&&f.participantes.some(x=>normName(x.nombre)===normName(nombre))){showToast('Ese alumno ya está inscrito en esta formación');return;}
  const nuevo=!p;
  if(p)Object.assign(p,datos);else{p=Object.assign({id:'PAR'+Date.now(),pagado:false,fechaInscripcion:todayVET()},datos);f.participantes.push(p);}
  closeModal();showToast(nuevo?`${nombre} inscrito`:'Datos guardados');
  syncToSheet('Formaciones',STATE.formaciones);if(STATE.view==='formaciones')renderFormaciones();
  if(nuevo&&parPrecio(f,p)>0)cobrarAlumno(formId,p.id);
}
function cobrarAlumno(formId,parId){
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;const p=formAlumnos(f).find(x=>x.id===parId);if(!p)return;
  const pg=parPagado(f,p),pr=parPrecio(f,p),res=Math.min(formReserva(f),pr);
  const esReserva=pg<res-0.01;const monto=esReserva?res-pg:Math.max(0,pr-pg);
  openNewMovimiento({tipo:'ingreso',desc:`${esReserva?'Reserva de plaza':'Saldo de formación'} · ${f.nombre} — ${p.nombre}`,formacionId:formId,participanteId:parId,nombreContraparte:p.nombre,monto:monto>0?monto.toFixed(2):''});
}
function marcarAsistencia(formId,parId){
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;const p=formAlumnos(f).find(x=>x.id===parId);if(!p)return;
  p.asistio=!p.asistio;guardarFormaciones();
}
function eliminarParticipante(formId,parId){
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;
  const par=formAlumnos(f).find(x=>x.id===parId);
  if(par&&parPagado(f,par)>0){showToast('Tiene pagos registrados: no se puede dar de baja sin gestionar la devolución');return;}
  if(par){if(!Array.isArray(f.participantesArchivados))f.participantesArchivados=[];f.participantesArchivados.push({...par,archivadoEl:new Date().toISOString()});}
  f.participantes=formAlumnos(f).filter(x=>x.id!==parId);
  closeModal();showToast('Alumno dado de baja (queda archivado)');guardarFormaciones();
}


// ═══════════════════════════════════════════════════════════════════════════
// v10 · CATÁLOGO DE SERVICIOS EDITABLE
//  Se pueden añadir servicios y categorías nuevas, cambiar precios y retirar del
//  catálogo los que ya no se ofrecen (se pueden volver a activar). Las citas,
//  consultas y presupuestos ya guardados conservan el nombre del servicio.
// ═══════════════════════════════════════════════════════════════════════════
const SERVICIOS_BASE=JSON.parse(JSON.stringify(SERVICIOS));
function reconstruirServicios(){
  const ocultos=new Set((STATE.serviciosOcultos||[]).map(normName));
  Object.keys(SERVICIOS).forEach(k=>delete SERVICIOS[k]);
  Object.entries(SERVICIOS_BASE).forEach(([cat,items])=>{SERVICIOS[cat]=items.filter(s=>!ocultos.has(normName(s.n))).map(s=>({n:s.n,p:s.p}));});
  (STATE.serviciosExtra||[]).forEach(s=>{
    if(!s||!s.n||ocultos.has(normName(s.n)))return;
    const cat=s.cat||'Otros servicios';if(!SERVICIOS[cat])SERVICIOS[cat]=[];
    if(!Object.values(SERVICIOS).some(l=>l.some(x=>normName(x.n)===normName(s.n))))SERVICIOS[cat].push({n:s.n,p:Number(s.p)||0,extra:true});
  });
  aplicarPreciosGuardados();
  if(!SERVICIOS[STATE.activeTratCat])STATE.activeTratCat=Object.keys(SERVICIOS)[0];
}
function guardarServicios(){syncToSheet('Config',[{id:'servicios',lista:STATE.serviciosExtra||[],ocultos:STATE.serviciosOcultos||[]}],{partial:true});}
function servicioExisteEnCatalogo(nombre){
  const k=normName(nombre);
  return Object.values(SERVICIOS_BASE).some(l=>l.some(x=>normName(x.n)===k))||(STATE.serviciosExtra||[]).some(x=>normName(x.n)===k);
}
function openNuevoServicio(){
  const cats=Object.keys(SERVICIOS);
  openModal(`<div class="modal-title">Nuevo servicio</div>
  <div class="form-group"><label class="form-label">Nombre del servicio *</label><input class="form-input" id="sv-nombre" placeholder="Ej. Láser CO2 fraccionado"></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Categoría</label><select class="form-input" id="sv-cat" onchange="document.getElementById('sv-catn-box').style.display=this.value==='__nueva'?'block':'none'">${cats.map(c=>`<option${c===STATE.activeTratCat?' selected':''}>${esc(c)}</option>`).join('')}<option value="__nueva">Nueva categoría…</option></select></div><div class="form-group"><label class="form-label">Precio ($)</label><input class="form-input" id="sv-precio" type="number" min="0" step="1" placeholder="0 = a consultar"></div></div>
  <div class="form-group" id="sv-catn-box" style="display:none"><label class="form-label">Nombre de la categoría nueva</label><input class="form-input" id="sv-catn" placeholder="Ej. Aparatología"></div>
  <div style="font-size:12px;color:var(--text3);margin-bottom:6px">Quedará disponible en la agenda, las consultas, los presupuestos, los bonos y los insumos por servicio.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="guardarNuevoServicio()">Añadir al catálogo</button></div>`);
}
function guardarNuevoServicio(){
  const n=$('sv-nombre').value.replace(/\s+/g,' ').trim();if(n.length<3){showToast('Escribe el nombre del servicio');return;}
  let cat=$('sv-cat').value;if(cat==='__nueva'){cat=$('sv-catn').value.replace(/\s+/g,' ').trim();if(!cat){showToast('Escribe el nombre de la categoría');return;}}
  const p=Math.max(0,parseFloat($('sv-precio').value)||0);
  if(servicioExisteEnCatalogo(n)){
    if((STATE.serviciosOcultos||[]).some(x=>normName(x)===normName(n))){showToast('Ese servicio ya existía y estaba retirado: actívalo abajo, en "Servicios retirados"');}
    else showToast('Ya hay un servicio con ese nombre');
    return;
  }
  STATE.serviciosExtra=(STATE.serviciosExtra||[]).concat([{cat,n,p,creadoEl:new Date().toISOString()}]);
  guardarServicios();reconstruirServicios();STATE.activeTratCat=cat;
  closeModal();showToast('Servicio añadido al catálogo');if(STATE.view==='tratamientos')renderTratamientos();
}
function retirarServicio(nombre){
  if((STATE.serviciosOcultos||[]).some(x=>normName(x)===normName(nombre)))return;
  STATE.serviciosOcultos=(STATE.serviciosOcultos||[]).concat([nombre]);
  guardarServicios();reconstruirServicios();showToast('Servicio retirado del catálogo (se puede volver a activar)');
  if(STATE.view==='tratamientos')renderTratamientos();
}
function activarServicio(nombre){
  STATE.serviciosOcultos=(STATE.serviciosOcultos||[]).filter(x=>normName(x)!==normName(nombre));
  guardarServicios();reconstruirServicios();showToast('Servicio activado de nuevo');
  if(STATE.view==='tratamientos')renderTratamientos();
}
function renderTratamientos(){
  const cats=Object.keys(SERVICIOS);if(!SERVICIOS[STATE.activeTratCat])STATE.activeTratCat=cats[0];
  const total=cats.reduce((s,c)=>s+SERVICIOS[c].length,0);const oc=STATE.serviciosOcultos||[];
  $('content-area').innerHTML=`
  <div class="section-header"><div class="section-title">Catálogo de servicios (${total})</div><input class="search-input" style="width:220px;margin-bottom:0" placeholder="Buscar servicio…" oninput="filterTratamientos(this.value)"></div>
  <div class="filtros">${cats.map(c=>`<button class="periodo-btn${c===STATE.activeTratCat?' active':''}" onclick="STATE.activeTratCat='${jsq(c)}';renderTratamientos()">${esc(c)} (${SERVICIOS[c].length})</button>`).join('')}</div>
  <div class="trat-list" id="trat-list-container">${buildTratList(STATE.activeTratCat,SERVICIOS[STATE.activeTratCat]||[])}</div>
  ${oc.length?`<details class="mas-op" style="margin-top:14px"><summary>Servicios retirados (${oc.length})</summary>${oc.map(n=>`<div class="agenda-item"><div style="flex:1;color:var(--text3)">${esc(n)}</div><button class="btn-outline btn-sm" onclick="activarServicio('${jsq(n)}')">Volver a activar</button></div>`).join('')}</details>`:''}`;
}
function selectTratCat(cat){STATE.activeTratCat=cat;renderTratamientos();}
function buildTratList(cat,items){
  const sc=cat.replace(/\W/g,'');
  return`<div class="trat-list-header"><div style="font-size:13px;font-weight:600;color:var(--text)">${esc(cat)} (${items.length})</div><span style="font-size:11.5px;color:var(--text3)">Toca el precio para cambiarlo</span></div>
  ${items.length?items.map((s,i)=>`<div class="trat-row"><div class="trat-name">${esc(s.n)}${s.extra?' <span class="status-badge badge-blue" style="font-weight:500">Añadido</span>':''}</div><div class="trat-price" id="price-display-${sc}-${i}" onclick="editPrice('${jsq(cat)}',${i})">${fmtUSD(s.p)}</div><button class="icon-btn btn-sm" onclick="retirarServicio('${jsq(s.n)}')">Retirar</button></div>`).join(''):'<div style="padding:18px;color:var(--text3);font-size:13px">Sin servicios en esta categoría.</div>'}`;
}
// Edición de precio: guarda con Intro o ✓ y cancela con Esc o ✕ (antes, al pulsar ✕ se guardaba igualmente).
function editPrice(cat,idx){
  const sc=cat.replace(/\W/g,'');const item=(SERVICIOS[cat]||[])[idx];const el=$(`price-display-${sc}-${idx}`);if(!el||!item||$(`pinp-${sc}-${idx}`))return;
  el.onclick=null;
  el.innerHTML=`<div style="display:flex;align-items:center;gap:5px" onclick="event.stopPropagation()"><span style="color:var(--text3);font-size:12px">$</span><input class="form-input" id="pinp-${sc}-${idx}" type="number" min="0" step="1" value="${Number(item.p)||0}" style="width:86px;padding:5px 8px" onkeydown="if(event.key==='Enter'){event.preventDefault();savePrice('${jsq(cat)}',${idx});}if(event.key==='Escape')cancelPrice('${jsq(cat)}',${idx})"><button class="icon-btn btn-sm" style="padding:3px 8px" aria-label="Guardar precio" onclick="savePrice('${jsq(cat)}',${idx})">✓</button><button class="icon-btn btn-sm" style="padding:3px 8px" aria-label="Cancelar" onclick="cancelPrice('${jsq(cat)}',${idx})">✕</button></div>`;
  setTimeout(()=>{const i=$(`pinp-${sc}-${idx}`);if(i){i.focus();i.select();}},40);
}
function savePrice(cat,idx){
  const sc=cat.replace(/\W/g,'');const inp=$(`pinp-${sc}-${idx}`);const item=(SERVICIOS[cat]||[])[idx];if(!inp||!item)return;
  const val=Math.max(0,parseFloat(inp.value)||0);
  item.p=val;STATE.precios=Object.assign({},STATE.precios||{},{[item.n]:val});
  syncToSheet('Config',[{id:'precios',map:STATE.precios}],{partial:true});
  showToast(`Precio de ${item.n}: ${fmtUSD(val)}`);
  if(STATE.view==='tratamientos')renderTratamientos();
}
function cancelPrice(cat,idx){if(STATE.view==='tratamientos')renderTratamientos();}

updateClock();
setInterval(updateClock,60000);
loadAllData();
</script>
