<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPC — Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCfxR_QeyJuFQD2EJlZOdcTu4idQeFmtCM",
  authDomain: "epc-clinic.firebaseapp.com",
  projectId: "epc-clinic",
  storageBucket: "epc-clinic.firebasestorage.app",
  messagingSenderId: "503441399542",
  appId: "1:503441399542:web:60fd39c9d3b6c8524716d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
window.fsLoad = async function(col){
  try{ const s=await db.collection(col).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){ return []; }
};
window.fsSave = async function(col,arr){
  try{
    const b=db.batch();
    arr.forEach(item=>{ if(item.id) b.set(db.collection(col).doc(String(item.id)),item); });
    await b.commit(); return true;
  }catch(e){ return false; }
};
window.firebaseReady=true;
window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#D4AD68;--gold2:#8E7038;--gold3:#E6C68A;--goldline:rgba(212,173,104,.4);
  --bg:#12161B;--bg2:rgba(255,247,232,0.045);--bg3:rgba(255,247,232,0.05);--bg4:rgba(255,247,232,0.09);
  --navy:#2C3740;
  --text:#F1ECE0;--text2:#ADB4B8;--text3:#767E82;
  --border:rgba(255,255,255,0.09);--border2:rgba(212,173,104,0.35);
  --green:#5FA085;--blue:#6B93B8;--red:#C17268;--purple:#8D84BF;
  --radius:10px;--radius2:16px;--radius3:22px;
  --blur:20px;
  --shadow-card:0 8px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);
  --shadow-glass:0 16px 48px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09);
}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse 900px 600px at 8% -5%, rgba(212,173,104,.16), transparent 60%),
  radial-gradient(ellipse 800px 700px at 100% 15%, rgba(107,147,184,.13), transparent 60%),
  radial-gradient(ellipse 700px 600px at 20% 100%, rgba(141,132,191,.11), transparent 60%),
  radial-gradient(ellipse 900px 500px at 90% 95%, rgba(95,160,133,.09), transparent 60%),
  var(--bg)}
*:focus-visible{outline:1.5px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(166,175,184,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(201,164,82,.35)}

/* ── SIDEBAR ─────────────────────────────────────────────────────────────── */
#sidebar{width:232px;min-width:232px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;box-shadow:1px 0 0 rgba(255,255,255,.04)}
.logo-area{padding:26px 22px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.logo-mark{width:38px;height:38px;border:1px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.5px;flex-shrink:0}
.logo-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text);letter-spacing:.4px;line-height:1.1}
.logo-sub{font-size:9.5px;color:var(--text3);letter-spacing:1.8px;text-transform:uppercase;margin-top:3px}
nav{padding:18px 0;flex:1;overflow-y:auto}
.nav-section{padding:16px 22px 6px;font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.nav-section:first-child{padding-top:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 22px;cursor:pointer;border-left:2px solid transparent;transition:background .15s,color .15s,border-color .15s;font-size:13px;color:var(--text2)}
.nav-item:hover{background:rgba(201,164,82,0.06);color:var(--text)}
.nav-item.active{background:rgba(212,173,104,0.1);border-left-color:var(--gold);color:var(--gold3);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.nav-icon{font-size:14px;width:16px;text-align:center;opacity:.9}
.nav-badge{margin-left:auto;background:transparent;border:1px solid var(--border2);color:var(--gold);font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px}
.sidebar-footer{padding:16px 22px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:6px;background:var(--bg4);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gold);flex-shrink:0;font-family:'Cormorant Garamond',serif}
.user-name{font-size:12px;font-weight:500;color:var(--text)}
.user-role{font-size:10px;color:var(--text3);margin-top:1px}

/* ── MAIN / TOPBAR ───────────────────────────────────────────────────────── */
#main{margin-left:232px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(18,22,27,.55);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.page-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--text);letter-spacing:.2px}
.topbar-right{display:flex;align-items:center;gap:14px}
.btn{padding:9px 20px;border-radius:var(--radius);font-size:12px;font-weight:500;font-family:'Montserrat',sans-serif;cursor:pointer;border:none;transition:background .15s,color .15s,border-color .15s;letter-spacing:.2px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#171008;box-shadow:0 4px 14px rgba(212,173,104,.25),inset 0 1px 0 rgba(255,255,255,.3)}.btn-gold:hover{background:linear-gradient(135deg,var(--gold3),var(--gold))}
.btn-outline{background:rgba(255,247,232,.03);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--text2);border:1px solid var(--border);font-family:'Montserrat',sans-serif;cursor:pointer;font-size:12px;font-weight:500;padding:9px 20px;border-radius:var(--radius);transition:border-color .15s,color .15s,background .15s}.btn-outline:hover{background:rgba(255,247,232,.07)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:6px 13px;font-size:11px}
.content{padding:26px 32px 40px;flex:1;max-width:1440px}

/* ── CARDS ────────────────────────────────────────────────────────────────── */
.card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:22px;box-shadow:var(--shadow-card);transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.card-title{font-size:12.5px;font-weight:500;color:var(--text2);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px}

/* ── KPI STRIP (momento de firma: una franja continua, no 4 cajas sueltas) ── */
.kpi-grid{display:flex;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow-card)}
.kpi-card{transition:background .2s}
.kpi-card:hover{background:rgba(255,247,232,0.06)}
.kpi-card{flex:1;padding:20px 24px;position:relative;border-left:1px solid var(--border)}
.kpi-card:first-child{border-left:none}
.kpi-card::after{content:none}
.kpi-label{font-size:10.5px;color:var(--text3);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-size:28px;font-weight:600;font-family:'Cormorant Garamond',serif;color:var(--text);margin-bottom:3px;line-height:1}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
.dashboard-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}

/* ── AGENDA / LISTAS ──────────────────────────────────────────────────────── */
.agenda-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.agenda-item:last-child{border-bottom:none}
.agenda-time{font-size:12px;font-weight:600;color:var(--gold);min-width:46px;font-variant-numeric:tabular-nums}
.agenda-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}.dot-gold{background:var(--gold)}.dot-gray{background:var(--text3)}.dot-blue{background:var(--blue)}
.agenda-name{font-size:13px;font-weight:500;color:var(--text)}
.agenda-proc{font-size:11px;color:var(--text3);margin-top:1px}
.status-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;letter-spacing:.2px}
.badge-green{background:rgba(63,143,115,.15);color:var(--green)}.badge-gold{background:rgba(201,164,82,.15);color:var(--gold)}
.badge-gray{background:rgba(105,115,125,.18);color:var(--text2)}.badge-blue{background:rgba(90,141,191,.15);color:var(--blue)}.badge-red{background:rgba(194,89,85,.15);color:var(--red)}
.proc-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.proc-item:last-child{border-bottom:none}
.proc-bar-wrap{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.proc-bar{height:100%;background:var(--gold);border-radius:2px}

/* ── BUSQUEDA / TABLA PACIENTES ──────────────────────────────────────────── */
.search-bar{display:flex;gap:10px;margin-bottom:20px}
.search-input{flex:1;padding:11px 16px;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:'Montserrat',sans-serif;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--gold)}.search-input::placeholder{color:var(--text3)}
.patients-table{width:100%;border-collapse:collapse}
.patients-table th{font-size:10.5px;color:var(--text3);letter-spacing:1.6px;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);font-weight:500}
.patients-table td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px}
.patients-table tr:hover td{background:rgba(201,164,82,.035)}
.patient-avatar{width:34px;height:34px;border-radius:7px;background:var(--bg4);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gold);flex-shrink:0;font-family:'Cormorant Garamond',serif}
.patient-name-cell{display:flex;align-items:center;gap:11px}
.tag{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:500}
.tag-vip{background:rgba(201,164,82,.2);color:var(--gold)}.tag-new{background:rgba(63,143,115,.15);color:var(--green)}.tag-surg{background:rgba(90,141,191,.15);color:var(--blue)}.tag-rec{background:rgba(166,175,184,.15);color:var(--text2)}

/* ── AGENDA / CALENDARIO ──────────────────────────────────────────────────── */
.agenda-controls{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.date-display{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--text);min-width:200px;text-align:center}
.doc-chip{padding:6px 15px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:background .15s,color .15s,border-color .15s;font-family:'Montserrat',sans-serif}
.doc-chip.active{background:var(--gold);color:#101820;border-color:var(--gold);font-weight:500}
.calendar-grid{display:grid;grid-template-columns:56px repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden}
.cal-header{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:11px 8px;text-align:center;font-size:10.5px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.cal-header.today{color:var(--gold)}
.cal-time{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:6px 8px;font-size:10.5px;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}
.cal-time-half{color:transparent;border-top:1px dashed var(--border)}
.cal-cell{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));min-height:34px;padding:3px}
.cal-cell-half{border-top:1px dashed var(--border)}
.cal-cell.today-col{background:rgba(201,164,82,.035)}
.cal-event{background:rgba(201,164,82,.14);border-left:2px solid var(--gold);border-radius:4px;padding:5px 7px;margin-bottom:2px;cursor:pointer;transition:background .15s}
.cal-event:hover{background:rgba(201,164,82,.26)}
.cal-event.green{background:rgba(63,143,115,.14);border-left-color:var(--green)}
.cal-event-name{font-size:10px;font-weight:600;color:var(--text)}
.cal-event-proc{font-size:10px;color:var(--text3)}

/* ── MODALES / FORMULARIOS ───────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(6,10,15,.78);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.modal{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius3);width:680px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:30px;box-shadow:var(--shadow-glass)}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;color:var(--gold);margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-label{font-size:10.5px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;font-weight:500}
.form-input{padding:10px 14px;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:'Montserrat',sans-serif;outline:none;width:100%;transition:border-color .15s}
.form-input:focus{border-color:var(--gold)}.form-input::placeholder{color:var(--text3)}
select.form-input option{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
textarea.form-input{resize:vertical;min-height:80px;line-height:1.55}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:7px 13px;cursor:pointer;color:var(--text2);font-size:12px;transition:border-color .15s,color .15s;font-family:'Montserrat',sans-serif}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--text)}
.toast{position:fixed;bottom:26px;right:26px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius);padding:14px 20px;font-size:13px;color:var(--text);z-index:500;display:flex;align-items:center;gap:10px;transform:translateY(100px);opacity:0;transition:transform .3s,opacity .3s;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.show{transform:translateY(0);opacity:1}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.hidden{display:none!important}
.tab-bar{display:flex;gap:2px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-radius:var(--radius);padding:4px;margin-bottom:20px}
.tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:6px;transition:background .15s,color .15s}
.tab.active{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--gold);border:1px solid var(--border2)}

/* ── HISTORIA CLÍNICA ─────────────────────────────────────────────────────── */
.hc-grid{display:grid;grid-template-columns:270px 1fr;gap:16px}
.hc-patient-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:8px}
.hc-patient-card:hover,.hc-patient-card.active{border-color:var(--gold);background:rgba(201,164,82,.055)}
.hc-panel{display:flex;flex-direction:column;gap:14px}
.hc-section{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.hc-section-title{font-size:10.5px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.hc-field{display:flex;gap:8px;margin-bottom:10px}
.hc-field-label{font-size:11px;color:var(--text3);min-width:120px;padding-top:2px}
.hc-field-value{font-size:13px;color:var(--text);flex:1}
.consulta-card{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:10px}
.consulta-date{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px}
.consulta-proc{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.consulta-note{font-size:12px;color:var(--text2);line-height:1.6}
.consulta-prods{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prod-chip{padding:3px 10px;background:rgba(201,164,82,.1);border:1px solid var(--border2);border-radius:20px;font-size:10px;color:var(--gold)}
.consent-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.consent-item:last-child{border-bottom:none}
.consent-check{width:20px;height:20px;border-radius:5px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.consent-check.done{background:rgba(63,143,115,.15);border-color:var(--green);color:var(--green)}

/* ── TRATAMIENTOS ─────────────────────────────────────────────────────────── */
.trat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.trat-cat-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:15px;cursor:pointer;transition:border-color .15s,background .15s;text-align:center}
.trat-cat-card:hover,.trat-cat-card.active{border-color:var(--gold);background:rgba(201,164,82,.055)}
.trat-list{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden}
.trat-list-header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.trat-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);transition:background .15s}
.trat-row:last-child{border-bottom:none}.trat-row:hover{background:rgba(201,164,82,.03)}
.trat-name{font-size:13px;color:var(--text);flex:1}
.trat-price{font-size:13px;font-weight:500;color:var(--gold);min-width:90px;text-align:right;cursor:pointer;text-decoration:underline dotted}

/* ── CAJA ─────────────────────────────────────────────────────────────────── */
.movimiento-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.movimiento-row:last-child{border-bottom:none}.movimiento-row:hover{background:rgba(201,164,82,.03)}
.mov-tipo{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mov-ingreso{background:var(--green)}.mov-egreso{background:var(--red)}
.mov-monto-pos{font-weight:600;color:var(--green);min-width:85px;text-align:right;font-variant-numeric:tabular-nums}
.mov-monto-neg{font-weight:600;color:var(--red);min-width:85px;text-align:right;font-variant-numeric:tabular-nums}
.balance-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:none;padding-top:13px}
.balance-label{font-size:12px;color:var(--text3)}
.periodo-btn{padding:6px 13px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;font-family:'Montserrat',sans-serif;transition:background .15s,color .15s,border-color .15s}
.periodo-btn.active{background:var(--gold);color:#101820;border-color:var(--gold);font-weight:500}

/* ── PRESUPUESTOS ─────────────────────────────────────────────────────────── */
.presup-list{display:flex;flex-direction:column;gap:10px}
.presup-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:17px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s}
.presup-card:hover{border-color:var(--gold)}
.presup-preview{background:#FBF9F4;color:#22282E;border-radius:var(--radius2);padding:38px;max-width:560px;margin:0 auto;font-family:'Montserrat',sans-serif}
.presup-preview-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;padding-bottom:18px;border-bottom:2px solid #2C3740}
.presup-clinic-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#2C3740}
.presup-item-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid #eee}
.presup-item-row:last-child{border-bottom:none}

/* ── REPORTES ─────────────────────────────────────────────────────────────── */
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.rep-kpi-grid{display:flex;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);margin-bottom:20px;overflow:hidden}
.rep-kpi{flex:1;padding:18px 20px;border-left:1px solid var(--border)}
.rep-kpi:first-child{border-left:none}
.rep-kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px}
.rep-kpi-value{font-size:25px;font-weight:600;font-family:'Cormorant Garamond',serif;color:var(--gold)}
.rep-kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.chart-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:22px}
.chart-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px}
.chart-subtitle{font-size:11px;color:var(--text3);margin-bottom:18px}
.chart-wrap{position:relative;height:220px}
.rep-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.rep-tab{padding:7px 17px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:background .15s,color .15s,border-color .15s;font-family:'Montserrat',sans-serif}
.rep-tab.active{background:var(--gold);color:#101820;border-color:var(--gold);font-weight:500}
.rank-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rank-item:last-child{border-bottom:none}
.rank-num{font-size:12px;font-weight:600;color:var(--gold);min-width:22px;font-family:'Cormorant Garamond',serif}
.rank-bar-wrap{width:80px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0}
.rank-bar{height:100%;background:var(--gold);border-radius:2px}
.tz-badge{background:rgba(201,164,82,.1);border:1px solid var(--border2);border-radius:20px;padding:4px 11px;font-size:10px;color:var(--gold);font-weight:600;letter-spacing:.8px}

/* ── MARKETING ────────────────────────────────────────────────────────────── */
.mkt-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:17px;cursor:pointer;transition:border-color .15s;margin-bottom:10px;display:flex;align-items:center;gap:13px}
.mkt-card:hover{border-color:var(--gold)}
.mkt-icon{width:40px;height:40px;border-radius:9px;background:rgba(201,164,82,.1);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* ── RESPONSIVE ───────────────────────────────────────────────────────────── */
@media(max-width:1080px){
  .dashboard-grid{grid-template-columns:1fr}
  .trat-grid{grid-template-columns:repeat(2,1fr)}
  .hc-grid{grid-template-columns:1fr}
  .rep-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  body{flex-direction:column}
  #sidebar{position:relative;width:100%;min-width:0;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  nav{display:flex;overflow-x:auto;padding:8px 10px;gap:2px}
  .nav-section{display:none}
  .nav-item{flex-shrink:0;border-left:none;border-bottom:2px solid transparent;padding:8px 12px;white-space:nowrap}
  .nav-item.active{border-left:none;border-bottom-color:var(--gold)}
  .sidebar-footer{display:none}
  #main{margin-left:0}
  .kpi-grid{flex-wrap:wrap}
  .kpi-card{flex:1 1 50%;border-left:1px solid var(--border)}
  .content{padding:18px 16px 32px}
  .topbar{padding:14px 18px;flex-wrap:wrap;gap:10px}
  .form-row{grid-template-columns:1fr}
  .dashboard-grid,.trat-grid,.hc-grid,.rep-grid{grid-template-columns:1fr}
}

/* ── HERO: PRÓXIMA CITA (dashboard) ──────────────────────────────────────── */
.hero-next{background:linear-gradient(135deg,rgba(44,55,64,.65) 0%,rgba(56,67,77,.55) 100%);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid rgba(255,255,255,.1);border-radius:var(--radius3);padding:26px 30px;margin-bottom:22px;color:#F7F4EC;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow-glass)}
.hero-eyebrow{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold3);margin-bottom:8px;opacity:.9}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;line-height:1.15}
.hero-meta{font-size:12.5px;color:#C9D1D8;margin-top:5px}
.hero-countdown{margin-left:auto;text-align:right;flex-shrink:0}
.hero-countdown-num{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--gold3);line-height:1}
.hero-countdown-label{font-size:10.5px;color:#C9D1D8;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.hero-actions{display:flex;gap:8px;flex-shrink:0}
.hero-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#F7F4EC;padding:8px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;font-family:'Montserrat',sans-serif;transition:background .15s}
.hero-btn:hover{background:rgba(255,255,255,.2)}
.hero-empty{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius3);padding:22px 28px;margin-bottom:22px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-card)}
.hero-empty-icon{font-size:26px}
.hero-empty-text{font-size:13px;color:var(--text2)}

/* ── BÚSQUEDA GLOBAL (topbar) ────────────────────────────────────────────── */
.global-search{position:relative;width:230px}
.global-search input{width:100%;padding:8px 14px 8px 32px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:20px;font-size:12.5px;font-family:'Montserrat',sans-serif;color:var(--text);outline:none;transition:border-color .15s,width .15s}
.global-search input:focus{border-color:var(--gold);width:280px}
.global-search input::placeholder{color:var(--text3)}
.global-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text3);pointer-events:none}
.global-search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 12px 28px rgba(44,55,64,.16);overflow:hidden;z-index:300;max-height:280px;overflow-y:auto}
.gsr-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}
.gsr-item:last-child{border-bottom:none}
.gsr-item:hover{background:rgba(201,164,82,.06)}
.gsr-empty{padding:16px;text-align:center;font-size:12px;color:var(--text3)}

/* ── POPOVER DE CITA (agenda) ────────────────────────────────────────────── */
.event-popover{position:fixed;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius2);box-shadow:0 16px 36px rgba(44,55,64,.2);padding:14px;z-index:400;width:220px}
.event-popover-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.event-popover-proc{font-size:11.5px;color:var(--text3);margin-bottom:12px}
.event-popover-actions{display:flex;flex-direction:column;gap:4px}
.event-popover-actions button{display:flex;align-items:center;gap:8px;background:transparent;border:none;text-align:left;padding:7px 8px;border-radius:6px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Montserrat',sans-serif;transition:background .12s,color .12s}
.event-popover-actions button:hover{background:rgba(201,164,82,.08);color:var(--gold2)}
.event-popover-actions button.danger:hover{background:rgba(177,78,72,.08);color:var(--red)}

/* ── ALERTA DE ALERGIAS (Historia Clínica) ───────────────────────────────── */
.alert-banner{display:flex;align-items:center;gap:10px;background:rgba(193,114,104,.14);border:1px solid rgba(193,114,104,.4);border-radius:var(--radius);padding:11px 16px;margin-bottom:14px;font-size:12.5px;color:#E8B3AC}
.alert-banner strong{color:#F0958A}
.alert-banner-icon{font-size:15px;flex-shrink:0}

/* ── LÍNEA DE TIEMPO UNIFICADA (Historia Clínica) ────────────────────────── */
.tl-wrap{padding-left:4px}
.tl-item{position:relative;padding:0 0 22px 24px;border-left:1.5px solid var(--border);margin-left:4px}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0}
.tl-dot{position:absolute;left:-6.5px;top:2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg3)}
.tl-dot.cita{background:var(--blue)}
.tl-dot.consulta{background:var(--gold)}
.tl-dot.consentimiento{background:var(--green)}
.tl-dot.pago{background:var(--purple)}
.tl-date{font-size:10.5px;color:var(--gold);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px}
.tl-title{font-size:13.5px;font-weight:500;color:var(--text)}
.tl-sub{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.5}

/* ── PIPELINE DE PACIENTES (Lead → Prospecto → Paciente) ─────────────────── */
.pipeline-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pipeline-col{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:14px;min-height:120px}
.pipeline-col-header{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--text);margin-bottom:2px}
.pipeline-col-count{background:var(--bg4);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--gold);font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:20px}
.pipeline-col-hint{font-size:10.5px;color:var(--text3);margin-bottom:12px}
.pipeline-col-body{display:flex;flex-direction:column;gap:8px}
.pipeline-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);padding:11px}
.pipeline-empty{text-align:center;font-size:11.5px;color:var(--text3);padding:18px 0;border:1px dashed var(--border);border-radius:var(--radius)}
.etapa-badge{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:500}
.etapa-lead{background:rgba(163,171,175,.18);color:var(--text2)}
.etapa-paciente{background:rgba(198,160,90,.18);color:var(--gold)}
@media(max-width:1080px){.pipeline-board{grid-template-columns:1fr}}

/* ── BUSCADOR DE PACIENTE (reemplaza el desplegable en formularios) ─────── */
.patsearch-wrap{position:relative}
.patsearch-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 12px 28px rgba(0,0,0,.3);overflow:hidden;z-index:250;max-height:240px;overflow-y:auto}
.patsearch-item{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}
.patsearch-item:last-child{border-bottom:none}
.patsearch-item:hover{background:rgba(198,160,90,.08)}
.patsearch-empty{padding:14px;text-align:center;font-size:12px;color:var(--text3)}
</style>


</head>
<body>
<aside id="sidebar">
  <div class="logo-area">
    <div class="logo-mark">EPC</div>
    <div>
      <div class="logo-title">Elite Plastic</div>
      <div class="logo-sub">Center · Caracas</div>
    </div>
  </div>
  <nav>
    <div class="nav-section">Principal</div>
    <div class="nav-item" onclick="showView('dashboard')"><span class="nav-icon">⬛</span> Dashboard</div>
    <div class="nav-item" onclick="showView('agenda')"><span class="nav-icon">📅</span> Agenda <span class="nav-badge" id="badge-agenda">0</span></div>
    <div class="nav-item" onclick="showView('pacientes')"><span class="nav-icon">👤</span> Pacientes</div>
    <div class="nav-item" onclick="showView('marketing')"><span class="nav-icon">📣</span> Marketing</div>
    <div class="nav-section" style="margin-top:8px">Clínica</div>
    <div class="nav-item" onclick="showView('hc')"><span class="nav-icon">📋</span> Historia Clínica</div>
    <div class="nav-item" onclick="showView('productos')"><span class="nav-icon">🏷️</span> Productos y lotes</div>
    <div class="nav-item" onclick="showView('tratamientos')"><span class="nav-icon">💉</span> Tratamientos</div>
    <div class="nav-section" style="margin-top:8px">Finanzas</div>
    <div class="nav-item" onclick="showView('caja')"><span class="nav-icon">💰</span> Caja</div>
    <div class="nav-item" onclick="showView('presupuestos')"><span class="nav-icon">📄</span> Presupuestos</div>
    <div class="nav-section" style="margin-top:8px">Análisis</div>
    <div class="nav-item" onclick="showView('reportes')"><span class="nav-icon">📊</span> Reportes</div>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar">EPC</div>
      <div><div class="user-name">Elite Plastic Center</div><div class="user-role">Caracas, Venezuela 🇻🇪</div></div>
    </div>
  </div>
</aside>

<main id="main">
  <div class="topbar">
    <div class="page-title" id="page-title">Dashboard</div>
    <div class="topbar-right">
      <div class="global-search">
        <span class="global-search-icon">🔍</span>
        <input type="text" id="global-search-input" placeholder="Buscar paciente…" autocomplete="off" oninput="globalSearch(this.value)" onfocus="globalSearch(this.value)">
        <div class="global-search-results hidden" id="global-search-results"></div>
      </div>
      <span id="sync-badge" style="font-size:11px;color:var(--green);font-weight:500">● En línea</span>
      <span class="tz-badge">🕐 VET (UTC-4)</span>
      <div style="font-size:12px;color:var(--text3)" id="fecha-hoy"></div>
      <button class="btn btn-gold" id="btn-top" onclick="openNewModal()">+ Nuevo</button>
    </div>
  </div>
  <div class="content" id="content-area"></div>
</main>

<div class="modal-overlay hidden" id="modal-overlay" onclick="if(event.target.id==='modal-overlay')closeModal()">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"><div class="toast-dot"></div><span id="toast-msg"></span></div>

<script>
// ── FIREBASE SYNC ─────────────────────────────────────────────────────────────
function saveLocal(k,d){try{localStorage.setItem('epc_'+k,JSON.stringify(d));}catch(e){}}
function loadLocal(k){try{const d=localStorage.getItem('epc_'+k);return d?JSON.parse(d):null;}catch(e){return null;}}

async function syncToSheet(col,arr){
  saveLocal(col,arr);
  showSyncBadge('↻ Guardando…');
  if(window.firebaseReady){
    const ok=await window.fsSave(col,arr);
    showSyncBadge(ok?'✓ Sincronizado':'⚠ Solo local');
  } else {
    showSyncBadge('● Local');
  }
}

async function loadFromSheet(col){
  if(window.firebaseReady){
    try{
      const data=await window.fsLoad(col);
      if(data&&data.length>0){saveLocal(col,data);return data;}
    }catch(e){}
  }
  return loadLocal(col)||[];
}

function showSyncBadge(msg){
  const el=$('sync-badge');if(!el)return;
  el.textContent=msg;
  el.style.color=msg.includes('✓')?'var(--green)':msg.includes('↻')?'var(--gold)':'var(--red)';
  if(msg.includes('✓'))setTimeout(()=>{el.textContent='● En línea';el.style.color='var(--green)';},2500);
}

async function loadAllData(){
  showSyncBadge('↻ Cargando…');
  const lp=loadLocal('Pacientes');if(lp&&lp.length)STATE.patients=lp;
  const lc=loadLocal('Citas');if(lc&&lc.length)STATE.appointments=lc;
  const lm=loadLocal('Movimientos');if(lm&&lm.length)STATE.movimientos=lm;
  const lpr=loadLocal('Presupuestos');if(lpr&&lpr.length)STATE.presupuestos=lpr;
  const lf=loadLocal('Formaciones');if(lf&&lf.length)STATE.formaciones=lf;
  const lhc=loadLocal('HistoriaClinica');if(lhc&&lhc.length)STATE.hcData=hcArrayToMap(lhc);
  const lcfg=loadLocal('Config');if(lcfg&&lcfg.length){const c=lcfg.find(x=>x.id==='main');if(c)STATE.bcvRate=Number(c.bcvRate)||0;}
  const linv=loadLocal('Inventario');if(linv&&linv.length)STATE.inventario=linv;
  $('badge-agenda').textContent=STATE.appointments.length;
  renderDashboard();
  const doLoad=async()=>{
    try{
      const[p,c,m,pr,f,hc,cfg,inv]=await Promise.all([
        loadFromSheet('Pacientes'),loadFromSheet('Citas'),loadFromSheet('Movimientos'),
        loadFromSheet('Presupuestos'),loadFromSheet('Formaciones'),loadFromSheet('HistoriaClinica'),loadFromSheet('Config'),loadFromSheet('Inventario')
      ]);
      let u=false;
      if(p.length){STATE.patients=p;u=true;}
      if(c.length){STATE.appointments=c;u=true;}
      if(m.length){STATE.movimientos=m;u=true;}
      if(pr.length){STATE.presupuestos=pr;u=true;}
      if(f.length){STATE.formaciones=f;u=true;}
      if(hc.length){STATE.hcData=hcArrayToMap(hc);u=true;}
      if(cfg.length){const c2=cfg.find(x=>x.id==='main');if(c2){STATE.bcvRate=Number(c2.bcvRate)||0;u=true;}}
      if(inv.length){STATE.inventario=inv;u=true;}
      if(u){$('badge-agenda').textContent=STATE.appointments.length;if(STATE.view==='dashboard')renderDashboard();showSyncBadge('✓ Sincronizado');checkAutoBackup();}
      else showSyncBadge('● En línea');
    }catch(e){showSyncBadge('● Local');}
  };
  if(window.firebaseReady)doLoad();
  else window.addEventListener('firebase-ready',doLoad,{once:true});
}

// ── PERSISTENCIA DE HISTORIA CLÍNICA (antes NUNCA se guardaba — solo vivía en memoria) ──
function hcArrayToMap(arr){
  const map={};
  arr.forEach(item=>{
    const{id,...rest}=item;
    map[id]={antecedentes:rest.antecedentes||{},consultas:rest.consultas||[],consentimientos:rest.consentimientos||[]};
  });
  return map;
}
function hcDataToArray(){
  return Object.keys(STATE.hcData).map(pid=>({id:pid,...STATE.hcData[pid]}));
}
function verFotoGrande(url){
  openModal(`<div class="modal-title">Foto</div><img src="${url}" style="width:100%;border-radius:var(--radius2)"><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cerrar</button></div>`);
}
function persistHCData(){
  syncToSheet('HistoriaClinica',hcDataToArray());
}

// ── TASA BCV (conversión USD↔Bs real, en vez de dos cajas que nunca se tocan) ──
function montoEnUSD(m){
  if(m.moneda==='BS')return STATE.bcvRate>0?Number(m.monto)/STATE.bcvRate:0;
  return Number(m.monto);
}
function guardarTasaBCV(){
  const v=parseFloat($('bcv-input')?.value);

}

// ── RESPALDO AUTOMÁTICO (evita depender solo de "confiar" en que Firebase no falle) ──
function exportarRespaldo(silent){
  const data={
    exportadoEl:new Date().toISOString(),
    Pacientes:STATE.patients,Citas:STATE.appointments,Movimientos:STATE.movimientos,
    Presupuestos:STATE.presupuestos,Formaciones:STATE.formaciones,HistoriaClinica:hcDataToArray(),
    Config:{bcvRate:STATE.bcvRate},
  };
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`EPC-respaldo-${todayVET()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    saveLocal('lastBackup',{fecha:todayVET()});
    if(!silent)showToast('📦 Respaldo descargado');
  }catch(e){if(!silent)showToast('No se pudo generar el respaldo');}
}
function checkAutoBackup(){
  try{
    const lb=loadLocal('lastBackup');
    if(!lb||!lb.fecha){exportarRespaldo(true);showToast('📦 Respaldo automático descargado (primera vez)');return;}
    const hoy=todayVET();
    const dias=Math.round((new Date(hoy+'T12:00:00')-new Date(lb.fecha+'T12:00:00'))/86400000);
    if(dias>=7){exportarRespaldo(true);showToast('📦 Respaldo automático descargado (han pasado '+dias+' días)');}
  }catch(e){}
}

  if(!q){box.classList.add('hidden');box.innerHTML='';return;}
  const matches=STATE.patients.filter(p=>(p.name||'').toLowerCase().includes(q)).slice(0,6);
  box.innerHTML=matches.length?matches.map(p=>`
    <div class="gsr-item" onclick="goToPatientHC('${p.id}')">

// ── AGENDA ────────────────────────────────────────────────────────────────────
function renderAgenda(){
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const todayVet=nowVET();
  const weekStart=new Date(todayVet);
  weekStart.setDate(todayVet.getDate()-todayVet.getDay()+(agendaWeekOffset*7));
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
  const times=['07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];
  const hoy=todayVET();
  const evMap={};
  STATE.appointments.forEach(a=>{
    const dt=new Date(a.fecha+'T12:00:00');
    const diff=Math.round((dt-weekStart)/86400000);
    if(diff<0||diff>6)return;
    let ti=times.indexOf(a.time);
    if(ti<0){
      // Cita a una hora fuera de la grilla estándar: la ubicamos en el slot más cercano para que NUNCA desaparezca.
      const[ah,am]=(a.time||'00:00').split(':').map(Number);
      const targetMin=ah*60+(am||0);
      let best=0,bestDiff=Infinity;
      times.forEach((t,i)=>{const[th,tm]=t.split(':').map(Number);const d=Math.abs(th*60+tm-targetMin);if(d<bestDiff){bestDiff=d;best=i;}});
      ti=best;
    }
    if(!evMap[diff])evMap[diff]={};
    if(!evMap[diff][ti])evMap[diff][ti]=[];
    evMap[diff][ti].push(a);
  });
  const ws=weekStart.toISOString().split('T')[0];
  const we=weekEnd.toISOString().split('T')[0];
  const citasSemana=STATE.appointments.filter(a=>a.fecha>=ws&&a.fecha<=we);
  const label=weekStart.toLocaleDateString('es-VE',{day:'2-digit',month:'short',timeZone:'America/Caracas'})+' – '+weekEnd.toLocaleDateString('es-VE',{day:'2-digit',month:'short',year:'numeric',timeZone:'America/Caracas'});
  $('content-area').innerHTML=`
  <div class="agenda-controls">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="icon-btn" onclick="agendaWeekOffset--;renderAgenda()">‹ Anterior</button>
      <div class="date-display">${label}</div>
      <button class="icon-btn" onclick="agendaWeekOffset++;renderAgenda()">Siguiente ›</button>
      ${agendaWeekOffset!==0?`<button class="icon-btn btn-sm" onclick="agendaWeekOffset=0;renderAgenda()">Hoy</button>`:''}
    </div>
    <span class="tz-badge">🕐 VET</span>
    <div style="display:flex;gap:8px;margin-left:auto;align-items:center">
      <span style="font-size:11px;color:var(--text3)">Dr. Higuerey</span>
      <button class="btn btn-gold btn-sm" onclick="openNewCita()">+ Nueva cita</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">
    <div class="calendar-grid">
      <div class="cal-header" style="background:var(--bg2)"></div>
      ${days.map((d,i)=>{const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+i);const isT=dt.toISOString().split('T')[0]===hoy;return`<div class="cal-header${isT?' today':''}">${d}<br><span style="font-size:14px;font-weight:600">${dt.getDate()}</span></div>`;}).join('')}
      ${times.map((t,ti)=>{const isHalf=t.endsWith(':30');return`<div class="cal-time${isHalf?' cal-time-half':''}">${isHalf?'':t}</div>${days.map((d,di)=>{
        const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+di);
        const isT=dt.toISOString().split('T')[0]===hoy;
        const evs=(evMap[di]||{})[ti]||[];
        return`<div class="cal-cell${isT?' today-col':''}${isHalf?' cal-cell-half':''}">${evs.map(ev=>`<div class="cal-event" onclick="showEventPopover(event,'${ev.id}')"><div class="cal-event-name">${ev.time} ${ev.patient.split(' ')[0]}</div><div class="cal-event-proc">${ev.proc.split('—')[0].trim().slice(0,16)}</div></div>`).join('')}</div>`;
      }).join('')}`;}).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Detalle y acciones — ${citasSemana.length} citas esta semana</div>
    ${citasSemana.length?citasSemana.sort((a,b)=>a.fecha===b.fecha?a.time.localeCompare(b.time):a.fecha.localeCompare(b.fecha)).map(a=>`
    <div class="agenda-item">
      <div style="min-width:80px"><div class="agenda-time">${a.time} <span style="font-size:9px;color:var(--text3)">VET</span></div><div style="font-size:10px;color:var(--text3)">${fmtDateVET(a.fecha)}</div></div>
      <span class="agenda-dot dot-${a.status==='en_consulta'?'gold':a.status==='confirmado'?'green':a.status==='completado'?'blue':'gray'}"></span>
      <div style="flex:1"><div class="agenda-name">${a.patient}</div><div class="agenda-proc">${a.proc} · ${a.consultorio} · ${a.doc}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="status-badge ${statusMap[a.status].cls}">${statusMap[a.status].label}</span>
        <button class="icon-btn btn-sm" onclick="cycleStatus('${a.id}')">↺</button>
        <button class="icon-btn btn-sm" onclick="abrirHCDesdeCita('${a.id}')">📋 HC</button>
        <button class="icon-btn btn-sm" onclick="enviarRecordatorioWA('${a.id}')">📲</button>
        <button class="icon-btn btn-sm" onclick="openRegistrarCobro('${a.patient}','${a.proc}')">💰</button>
        <button class="icon-btn btn-sm" style="color:var(--red)" onclick="eliminarCita('${a.id}')">✕</button>
      </div>
    </div>`).join(''):`<div style="color:var(--text3);text-align:center;padding:20px;font-size:13px">Sin citas esta semana.</div>`}
  </div>`;
}

function closeEventPopover(){const p=$('event-popover');if(p)p.remove();}
function showEventPopover(evt,citaId){
  evt.stopPropagation();closeEventPopover();
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const rect=evt.target.closest('.cal-event').getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='event-popover';pop.id='event-popover';
  pop.style.top=Math.min(rect.bottom+6,window.innerHeight-220)+'px';
  pop.style.left=Math.min(rect.left,window.innerWidth-236)+'px';
  pop.innerHTML=`
    <div class="event-popover-name">${a.patient}</div>
    <div class="event-popover-proc">${a.proc} · ${a.time} VET</div>
    <div class="event-popover-actions">
      <button onclick="abrirHCDesdeCita('${a.id}');closeEventPopover()">📋 Ver historia clínica</button>
      <button onclick="enviarRecordatorioWA('${a.id}');closeEventPopover()">📲 Enviar recordatorio</button>
      <button onclick="cycleStatus('${a.id}');closeEventPopover()">↺ Cambiar estado</button>
      <button onclick="openRegistrarCobro('${a.patient}','${a.proc}');closeEventPopover()">💰 Registrar cobro</button>
      <button class="danger" onclick="eliminarCita('${a.id}');closeEventPopover()">✕ Eliminar cita</button>
    </div>`;
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',closeEventPopover,{once:true}),0);
}

function enviarRecordatorioWA(citaId){
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const p=STATE.patients.find(x=>x.name===a.patient);
  const tel=(p?.phone||'').replace(/\D/g,'');
  const msg=`Hola ${a.patient} 👋\n\nLe recordamos su cita en *Elite Plastic Center*:\n\n📅 *Fecha:* ${fmtDateVET(a.fecha)}\n🕐 *Hora:* ${a.time} VET\n💉 *Procedimiento:* ${a.proc}\n👨‍⚕️ *Médico:* ${a.doc}\n📍 C.C. Trinidad Tepuy, Consultorio 1-13, Baruta, Caracas\n\n¡Nos vemos pronto! ✨`;
  window.open(tel?`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  showToast('Abriendo WhatsApp…');
}

function cycleStatus(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const c=['pendiente','confirmado','en_consulta','completado','cancelado'];
  a.status=c[(c.indexOf(a.status)+1)%c.length];
  syncToSheet('Citas',STATE.appointments);
  showToast('Estado: '+statusMap[a.status].label);renderAgenda();
}

function abrirHCDesdeCita(citaId){
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const p=STATE.patients.find(x=>x.name===a.patient);
  if(p){STATE.activeHCPatient=p.id;STATE.activeHCTab='consultas';showView('hc');setTimeout(()=>openNewConsulta(p.id),300);}
  else showToast('Paciente no encontrado');
}

function eliminarCita(id){
  openModal(`<div class="modal-title" style="color:var(--red)">Eliminar cita</div>
  <div style="background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.25);border-radius:var(--radius);padding:14px;margin-bottom:18px;font-size:13px;color:var(--text2)">¿Eliminar esta cita? No se puede deshacer.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--red);color:#fff;font-family:Montserrat,sans-serif;font-size:12px;padding:8px 18px;border-radius:var(--radius);cursor:pointer;border:none" onclick="confirmarEliminarCita('${id}')">Eliminar</button></div>`);
}
function confirmarEliminarCita(id){
  STATE.appointments=STATE.appointments.filter(a=>a.id!==id);
  $('badge-agenda').textContent=STATE.appointments.length;
  syncToSheet('Citas',STATE.appointments);
  closeModal();showToast('Cita eliminada');renderAgenda();
}

    <div class="section-title">Pacientes (${STATE.patients.length})</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="tab-bar" style="margin-bottom:0;width:auto">
        <div class="tab${view==='pipeline'?' active':''}" style="padding:8px 16px" onclick="setPacientesView('pipeline')">Pipeline</div>

          <button class="icon-btn btn-sm" onclick="openEditarPaciente('${p.id}')">✏</button>

function setPacientesView(v){STATE.activePacientesView=v;renderPacientes();}
function etapaLabel(e){return{lead:'Lead',paciente:'Paciente'}[e]||'Paciente';}

// ── PIPELINE (Lead → Paciente) ──────────────────────────────────────────────
function buildPipelineBoard(pts,filter){
  const cols=[
    {key:'lead',label:'Lead',hint:'Contacto o cita agendada, sin consulta todavía'},
    {key:'paciente',label:'Paciente',hint:'Ya tuvo su primera consulta'},
  ];
  return`${filter?`<div class="search-bar"><input class="search-input" placeholder="Buscar por nombre o cédula…" value="${filter}" oninput="renderPacientes(this.value)"></div>`:''}
  <div class="pipeline-board">
    ${cols.map(col=>{
      const items=pts.filter(p=>col.key==='paciente'?(p.etapa||'paciente')==='paciente':(p.etapa||'paciente')!=='paciente');
      return`<div class="pipeline-col">
        <div class="pipeline-col-header"><span>${col.label}</span><span class="pipeline-col-count">${items.length}</span></div>
        <div class="pipeline-col-hint">${col.hint}</div>
        <div class="pipeline-col-body">
          ${items.length?items.map(p=>buildPipelineCard(p)).join(''):`<div class="pipeline-empty">Vacío</div>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function buildPipelineCard(p){
  const etapa=p.etapa||'paciente';
  const tel=(p.phone||'').replace(/\D/g,'');
  let accion='';
  if(etapa!=='paciente')accion=`<button class="btn btn-gold btn-sm" style="width:100%;margin-top:8px" onclick="showView('hc');setTimeout(()=>openNewConsulta('${p.id}'),100)">+ Primera consulta</button><div style="display:flex;gap:10px;justify-content:center;margin-top:5px"><span style="font-size:10.5px;color:var(--text3);cursor:pointer;text-decoration:underline" onclick="showView('agenda');setTimeout(()=>openNewCita('${p.id}'),100)">Agendar cita</span><span style="font-size:10.5px;color:var(--text3);cursor:pointer;text-decoration:underline" onclick="cambiarEtapa('${p.id}','paciente')">Marcar como Paciente</span></div>`;
  else accion=`<button class="btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="showView('hc');setTimeout(()=>openHCPatient('${p.id}'),50)">Ver historia clínica</button>`;
  return`<div class="pipeline-card">
    <div style="display:flex;align-items:center;gap:9px">
      <div class="patient-avatar">${initials(p.name)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div style="font-size:11px;color:var(--text3)">${p.phone||'Sin teléfono'}</div></div>
    </div>
    ${accion}
    <div style="display:flex;gap:5px;margin-top:6px">
      ${tel?`<button class="icon-btn btn-sm" style="flex:1" onclick="window.open('https://wa.me/${tel}','_blank')">📲</button>`:''}
      <button class="icon-btn btn-sm" style="flex:1" onclick="openEditarPaciente('${p.id}')">✏</button>
      <button class="icon-btn btn-sm" style="color:var(--red)" onclick="confirmarEliminarPaciente('${p.id}','${p.name}')">✕</button>
    </div>
  </div>`;
}
function cambiarEtapa(id,nueva){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return;
  p.etapa=nueva;syncToSheet('Pacientes',STATE.patients);
  showToast(`${p.name} → ${etapaLabel(nueva)}`);
  if(STATE.view==='pacientes')renderPacientes();
}

function openNewPatient(etapaInicial='paciente'){
  const esLead=etapaInicial==='lead';
  openModal(`<div class="modal-title">${esLead?'Nuevo lead':'Nuevo paciente'}</div>
  <input type="hidden" id="f-etapa" value="${etapaInicial}">
  ${esLead?`<div style="background:rgba(198,160,90,.08);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;font-size:12px;color:var(--text2)">💡 Para un lead solo necesitas nombre y teléfono. Completa el resto cuando avance a Paciente.</div>`:''}
  <div class="form-row"><div class="form-group"><label class="form-label">Nombre completo</label><input class="form-input" id="f-nombre" placeholder="Nombre completo"></div><div class="form-group"><label class="form-label">Cédula${esLead?' (opcional)':''}</label><input class="form-input" id="f-cedula" placeholder="V-00.000.000"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="f-phone" placeholder="+58 412 000 0000"></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" placeholder="correo@email.com"></div></div>
  ${esLead?'':`<div class="form-row"><div class="form-group"><label class="form-label">Fecha de nacimiento</label><input class="form-input" type="date" id="f-dob"></div><div class="form-group"><label class="form-label">Etiqueta</label><select class="form-input" id="f-tag"><option>Nueva</option><option>Recurrente</option><option>VIP</option><option>Cirugía</option></select></div></div>`}
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveNewPatient()">Guardar</button></div>`);
}
function saveNewPatient(){
  const n=$('f-nombre').value.trim(),c=$('f-cedula').value.trim();
  const etapa=$('f-etapa')?.value||'paciente';
  if(!n||(etapa!=='lead'&&!c)){showToast(etapa==='lead'?'Nombre obligatorio':'Nombre y cédula obligatorios');return;}
  STATE.patients.unshift({id:'P'+Date.now(),name:n,cedula:c||'—',phone:$('f-phone').value||'—',email:$('f-email')?.value||'—',dob:$('f-dob')?.value||'—',tags:[$('f-tag')?.value||'Nueva'],lastVisit:'',procedures:0,etapa});
  closeModal();showToast(etapa==='lead'?'Lead registrado':'Paciente registrado');
  syncToSheet('Pacientes',STATE.patients);
  if(STATE.view==='pacientes')renderPacientes();else renderDashboard();
}

function openEditarPaciente(id){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return;
  openModal(`<div class="modal-title">Editar paciente</div>
  <div class="form-row"><div class="form-group"><label class="form-label">Nombre</label><input class="form-input" id="ep-nombre" value="${p.name||''}"></div><div class="form-group"><label class="form-label">Cédula</label><input class="form-input" id="ep-cedula" value="${p.cedula||''}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="ep-phone" value="${p.phone||''}"></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" id="ep-email" value="${p.email||''}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Fecha de nacimiento</label><input class="form-input" type="date" id="ep-dob" value="${p.dob||''}"></div><div class="form-group"><label class="form-label">Etiqueta</label><select class="form-input" id="ep-tag">${['Nueva','Recurrente','VIP','Cirugía'].map(t=>`<option${(p.tags||[]).includes(t)?' selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="guardarEdicionPaciente('${id}')">Guardar</button></div>`);
}
function guardarEdicionPaciente(id){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return;
  p.name=$('ep-nombre').value.trim();p.cedula=$('ep-cedula').value.trim();p.phone=$('ep-phone').value;p.email=$('ep-email').value;p.dob=$('ep-dob').value;p.tags=[$('ep-tag').value];
  closeModal();showToast('Paciente actualizado');
  syncToSheet('Pacientes',STATE.patients);renderPacientes();
}
function confirmarEliminarPaciente(id,nombre){
  openModal(`<div class="modal-title" style="color:var(--red)">Eliminar paciente</div>
  <div style="background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.25);border-radius:var(--radius);padding:14px;margin-bottom:18px;font-size:13px;color:var(--text2)">¿Eliminar a <strong>${nombre}</strong>? No se puede deshacer.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--red);color:#fff;font-family:Montserrat,sans-serif;font-size:12px;padding:8px 18px;border-radius:var(--radius);cursor:pointer;border:none" onclick="eliminarPaciente('${id}')">Eliminar</button></div>`);
}
function eliminarPaciente(id){
  STATE.patients=STATE.patients.filter(p=>p.id!==id);
  if(STATE.hcData[id]){
    delete STATE.hcData[id];
    persistHCData();
    try{db.collection('HistoriaClinica').doc(id).delete();}catch(e){}
  }
  closeModal();showToast('Paciente eliminado');
  syncToSheet('Pacientes',STATE.patients);renderPacientes();
}

// ── HISTORIA CLÍNICA ─────────────────────────────────────────────────────────
function renderHC(){
  if(!STATE.patients.length){$('content-area').innerHTML=`<div class="card" style="text-align:center;padding:48px;color:var(--text3)"><div style="font-size:40px;opacity:.3;margin-bottom:12px">📋</div><div style="margin-bottom:16px">No hay pacientes</div><button class="btn btn-gold" onclick="showView('pacientes')">Ir a Pacientes</button></div>`;return;}
  STATE.activeHCPatient=STATE.activeHCPatient||STATE.patients[0].id;
  $('content-area').innerHTML=`<div class="hc-grid">
    <div>
      <div class="search-bar" style="margin-bottom:10px"><input class="search-input" placeholder="Buscar paciente…" oninput="filterHCList(this.value)"></div>
      <div id="hc-list">${STATE.patients.map(p=>hcPatientCardHtml(p)).join('')}</div>
    </div>
    <div id="hc-panel">${buildHCPanel(STATE.activeHCPatient)}</div>
  </div>`;
}

function hcPatientCardHtml(p){
  const hc=STATE.hcData[p.id]||{};const alerg=(hc.antecedentes||{}).alergias;
  const tieneAlergias=alerg&&alerg.trim()&&alerg.trim()!=='—';
  return`<div class="hc-patient-card${p.id===STATE.activeHCPatient?' active':''}" onclick="openHCPatient('${p.id}')"><div style="display:flex;align-items:center;gap:10px"><div class="patient-avatar">${initials(p.name)}</div><div style="flex:1"><div style="font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:5px">${p.name}${tieneAlergias?'<span title="Tiene alergias registradas" style="color:var(--red)">⚠️</span>':''}</div><div style="font-size:11px;color:var(--text3)">${p.cedula||''} · ${p.procedures||0} procs.</div></div></div></div>`;
}
function filterHCList(q){
  const pts=q?STATE.patients.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())):STATE.patients;
  $('hc-list').innerHTML=pts.map(p=>hcPatientCardHtml(p)).join('');
}

function openHCPatient(id){
  STATE.activeHCPatient=id;
  const panel=$('hc-panel');if(panel)panel.innerHTML=buildHCPanel(id);
  filterHCList('');
}

function buildHCPanel(id){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return'';
  const hc=STATE.hcData[id]||{antecedentes:{},consultas:[],consentimientos:[]};
  const tab=STATE.activeHCTab;
  const alergias=(hc.antecedentes||{}).alergias;
  const tieneAlergias=alergias&&alergias.trim()&&alergias.trim()!=='—';
  return`<div class="hc-panel">
    ${tieneAlergias?`<div class="alert-banner"><span class="alert-banner-icon">⚠️</span><div><strong>Alergias:</strong> ${alergias}</div></div>`:''}
    <div class="hc-section" style="padding:14px 18px">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="patient-avatar" style="width:46px;height:46px;font-size:14px">${initials(p.name)}</div>
        <div style="flex:1"><div style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--gold)">${p.name}</div><div style="font-size:12px;color:var(--text3)">${p.cedula||''} · ${p.phone||''}</div></div>
        <div style="display:flex;gap:6px">${(p.tags||[]).map(t=>`<span class="tag tag-${tagCls(t)}">${t}</span>`).join('')}</div>

        <button class="btn btn-gold btn-sm" onclick="openNewConsulta('${id}')">+ Consulta</button>
      </div>
    </div>

      <div class="tab${tab==='timeline'?' active':''}" onclick="switchHCTab('timeline')">Línea de tiempo</div>

      <div class="tab${tab==='consultas'?' active':''}" onclick="switchHCTab('consultas')">Consultas (${(hc.consultas||[]).length})</div>

function switchHCTab(tab){STATE.activeHCTab=tab;const el=$('hc-tab-content');if(el)el.innerHTML=buildHCTab(STATE.activeHCPatient,tab);}

function buildHCTab(id,tab){
  const hc=STATE.hcData[id]||{antecedentes:{},consultas:[],consentimientos:[]};
  const ant=hc.antecedentes||{};
  if(tab==='timeline')return buildHCTimeline(id,hc);
  if(tab==='antecedentes')return`<div class="hc-section"><div class="hc-section-title">Antecedentes <button class="icon-btn btn-sm" onclick="openEditAntecedentes('${id}')">✏ Editar</button></div>${[['Alergias',ant.alergias||'—'],['Medicamentos',ant.medicamentos||'—'],['Antec. personales',ant.antPersonales||'—'],['Antec. familiares',ant.antFamiliares||'—'],['Cirugías previas',ant.cirugiasPrevias||'—']].map(([l,v])=>`<div class="hc-field"><span class="hc-field-label">${l}</span><span class="hc-field-value">${v}</span></div>`).join('')}</div>`;
  if(tab==='consultas'){const cs=hc.consultas||[];if(!cs.length)return`<div class="hc-section" style="text-align:center;padding:28px;color:var(--text3)">Sin consultas.<br><button class="btn btn-gold btn-sm" style="margin-top:10px" onclick="openNewConsulta('${id}')">+ Primera consulta</button></div>`;return cs.map(c=>`<div class="consulta-card"><div class="consulta-date">📅 ${c.fecha} · ${c.doc}</div><div class="consulta-proc">${c.proc}</div><div class="consulta-note">${c.nota}</div>${(c.productos||[]).length?`<div class="consulta-prods">${c.productos.map(pr=>`<span class="prod-chip">💉 ${pr.prod} ${pr.dosis} — ${pr.zona} (${pr.lote})</span>`).join('')}</div>`:''}${(c.fotos||[]).length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${c.fotos.map(f=>`<div style="position:relative;cursor:pointer" onclick="verFotoGrande('${f.url}')"><img src="${f.url}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border2)"><span style="position:absolute;bottom:1px;left:1px;background:rgba(0,0,0,.65);color:#fff;font-size:8px;padding:1px 4px;border-radius:3px">${f.tipo}</span></div>`).join('')}</div>`:''}</div>`).join('');}
  if(tab==='consentimientos'){const cs=hc.consentimientos||[];return`<div class="hc-section"><div class="hc-section-title">Consentimientos <button class="icon-btn btn-sm" onclick="openAddConsentimiento('${id}')">+ Agregar</button></div>${cs.length?cs.map(c=>`<div class="consent-item"><div class="consent-check${c.firmado?' done':''}">${c.firmado?'✓':''}</div><div style="flex:1;font-size:13px;color:var(--text)">${c.nombre}</div>${c.firma?`<img src="${c.firma}" style="height:26px;background:#fff;border-radius:4px;padding:2px" title="Firma del ${c.fecha}">`:''}<div style="font-size:11px;color:var(--text3)">${c.firmado?'Firmado '+c.fecha:'Pendiente'}</div>${!c.firmado?`<button class="icon-btn btn-sm" onclick="openFirmaModal('${id}','${(c.nombre||'').replace(/'/g,"\\'")}')">✍️ Firmar</button>`:''}</div>`).join(''):'<div style="color:var(--text3);font-size:13px">Sin consentimientos.</div>'}</div>`;}
  return'';
}

// ── LÍNEA DE TIEMPO UNIFICADA (agrega citas + consultas + consentimientos + pagos, sin duplicar datos) ──
function buildHCTimeline(id,hc){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return'';
  const eventos=[];
  STATE.appointments.filter(a=>a.patient===p.name).forEach(a=>{
    eventos.push({fecha:a.fecha,time:a.time||'00:00',tipo:'cita',icono:'📅',clase:'cita',
      titulo:a.proc,sub:`Cita · ${a.time} · ${statusMap[a.status]?statusMap[a.status].label:a.status}`});
  });
  (hc.consultas||[]).forEach(c=>{
    const prods=(c.productos||[]).filter(pr=>pr.prod).map(pr=>`${pr.prod} ${pr.dosis||''} (${pr.lote||'sin lote'})`).join(', ');
    eventos.push({fecha:c.fecha,time:'12:00',tipo:'consulta',icono:'📋',clase:'consulta',
      titulo:c.proc,sub:`Consulta con ${c.doc}${prods?' · '+prods:''}${(c.fotos||[]).length?` · 📷 ${c.fotos.length} foto${c.fotos.length>1?'s':''}`:''}${c.nota?' · "'+c.nota.slice(0,60)+(c.nota.length>60?'…':'')+'"':''}`});
  });
  (hc.consentimientos||[]).filter(c=>c.firmado&&c.fecha).forEach(c=>{
    eventos.push({fecha:c.fecha,time:'12:00',tipo:'consentimiento',icono:'✓',clase:'consentimiento',
      titulo:c.nombre,sub:'Consentimiento firmado'});
  });
  STATE.movimientos.filter(m=>m.tipo==='ingreso'&&m.desc&&m.desc.includes(p.name)).forEach(m=>{
    eventos.push({fecha:m.fecha,time:'12:00',tipo:'pago',icono:'💰',clase:'pago',
      titulo:m.moneda==='BS'?Number(m.monto).toFixed(2)+' Bs':fmtUSD(Number(m.monto)),sub:`Pago registrado · ${m.metodo||''}`});
  });
  eventos.sort((a,b)=>(b.fecha+b.time).localeCompare(a.fecha+a.time));
  const pendConsent=(hc.consentimientos||[]).filter(c=>!c.firmado).length;
  if(!eventos.length)return`<div class="hc-section" style="text-align:center;padding:28px;color:var(--text3)">Sin actividad registrada todavía.<br><button class="btn btn-gold btn-sm" style="margin-top:10px" onclick="openNewConsulta('${id}')">+ Primera consulta</button></div>`;
  return`<div class="hc-section">
    ${pendConsent?`<div class="alert-banner" style="background:rgba(198,160,90,.12);border-color:var(--border2);color:var(--gold3)"><span class="alert-banner-icon">📄</span><div>${pendConsent} consentimiento${pendConsent>1?'s':''} pendiente${pendConsent>1?'s':''} de firma — <span style="text-decoration:underline;cursor:pointer" onclick="switchHCTab('consentimientos')">ver</span></div></div>`:''}
    <div class="tl-wrap">
      ${eventos.map(e=>`<div class="tl-item">
        <div class="tl-dot ${e.clase}"></div>
        <div class="tl-date">${fmtDateVET(e.fecha)}</div>
        <div class="tl-title">${e.icono} ${e.titulo}</div>
        <div class="tl-sub">${e.sub}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

let consultaFotosTemp=[];
function comprimirImagen(file,maxWidth,calidad){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxWidth/img.width);
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',calidad));
      };
      img.onerror=()=>reject(new Error('No se pudo leer la imagen'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
async function agregarFotoConsulta(input,tipo){
  const file=input.files[0];if(!file)return;
  try{
    const dataUrl=await comprimirImagen(file,800,0.6);
    consultaFotosTemp.push({tipo,url:dataUrl});
    renderConsultaFotosPreview();
  }catch(e){showToast('No se pudo procesar la foto');}
  input.value='';
}
function quitarFotoConsulta(idx){consultaFotosTemp.splice(idx,1);renderConsultaFotosPreview();}
function renderConsultaFotosPreview(){
  const box=$('consulta-fotos-preview');if(!box)return;
  box.innerHTML=consultaFotosTemp.map((f,i)=>`<div style="position:relative"><img src="${f.url}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border2)"><span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;font-size:8px;padding:1px 4px;border-radius:3px">${f.tipo}</span><span style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="quitarFotoConsulta(${i})">✕</span></div>`).join('');
}
function saveConsulta(){
  const patId=$('fc-pat').value;const p=STATE.patients.find(x=>x.id===patId);if(!p)return;
  if(!STATE.hcData[patId])STATE.hcData[patId]={antecedentes:{},consultas:[],consentimientos:[]};
  const m=$('fp-marca').value,pr=$('fp-prod').value;
  const prods=(m||pr)?[{marca:m,prod:pr,dosis:$('fp-dosis').value,zona:$('fp-zona').value,lote:$('fp-lote').value}]:[];
  STATE.hcData[patId].consultas.unshift({fecha:$('fc-fecha').value,proc:$('fc-proc').value,doc:getMedicoLabel(),nota:$('fc-nota').value,productos:prods,fotos:consultaFotosTemp.slice()});
  if(m&&pr&&$('fp-lote').value)descontarInventario($('fp-prod').value,$('fp-lote').value);
  p.procedures=(p.procedures||0)+1;p.lastVisit=$('fc-fecha').value;
  let subioEtapa=false;
  if((p.etapa||'paciente')!=='paciente'){p.etapa='paciente';subioEtapa=true;}
  STATE.activeHCPatient=patId;STATE.activeHCTab='timeline';
  consultaFotosTemp=[];
  persistHCData();syncToSheet('Pacientes',STATE.patients);
  closeModal();showToast(subioEtapa?`Consulta registrada · ${p.name} ya es Paciente`:'Consulta registrada');renderHC();
}

  openModal(`<div class="modal-title">Agregar Consentimiento</div>
  <div class="form-group"><label class="form-label">Tipo</label><select class="form-input" id="fc-consent">${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>
  <div style="background:rgba(198,160,90,.08);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;font-size:12px;color:var(--text2)">💡 Se agrega como pendiente. Para que tenga validez, se firma con el dedo o el mouse desde la lista de consentimientos.</div>

// ── FIRMA REAL (canvas) — reemplaza el checkbox de "firmado" por una firma capturada de verdad ──
let firmaCtx=null,firmaDrawing=false;
function openFirmaModal(patientId,nombre){
  openModal(`<div class="modal-title">Firmar consentimiento</div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:14px">${nombre}</div>
  <div style="background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border2)">
    <canvas id="firma-canvas" width="600" height="180" style="width:100%;height:180px;display:block;touch-action:none;cursor:crosshair"></canvas>
  </div>
  <div style="font-size:11px;color:var(--text3);margin-top:8px">Firme dentro del recuadro con el mouse o el dedo.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="limpiarFirma()">Limpiar</button><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="guardarFirma('${patientId}','${nombre.replace(/'/g,"\\'")}')">Guardar firma</button></div>`);
  setTimeout(initFirmaCanvas,50);
}
function initFirmaCanvas(){
  const c=$('firma-canvas');if(!c)return;
  firmaCtx=c.getContext('2d');
  firmaCtx.lineWidth=2.2;firmaCtx.lineCap='round';firmaCtx.strokeStyle='#1a1a1a';
  const pos=(e)=>{const r=c.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:cx*(c.width/r.width),y:cy*(c.height/r.height)};};
  const start=(e)=>{firmaDrawing=true;const p=pos(e);firmaCtx.beginPath();firmaCtx.moveTo(p.x,p.y);e.preventDefault();};
  const move=(e)=>{if(!firmaDrawing)return;const p=pos(e);firmaCtx.lineTo(p.x,p.y);firmaCtx.stroke();e.preventDefault();};
  const end=()=>{firmaDrawing=false;};
  c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;
  c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
}
function limpiarFirma(){const c=$('firma-canvas');if(c&&firmaCtx)firmaCtx.clearRect(0,0,c.width,c.height);}
function guardarFirma(patientId,nombre){
  const c=$('firma-canvas');if(!c)return;
  const dataUrl=c.toDataURL('image/png');
  const hc=STATE.hcData[patientId];if(!hc)return;
  const con=(hc.consentimientos||[]).find(x=>x.nombre===nombre);if(!con)return;
  con.firmado=true;con.fecha=todayVET();con.firma=dataUrl;
  persistHCData();closeModal();showToast('Firma guardada');
  const el=$('hc-tab-content');if(el)el.innerHTML=buildHCTab(patientId,'consentimientos');
}

function getAllProductUsages(){
  const usages=[];
  STATE.patients.forEach(p=>{
    const hc=STATE.hcData[p.id];
    if(!hc||!hc.consultas)return;
    hc.consultas.forEach(c=>{
      (c.productos||[]).filter(pr=>pr.prod||pr.lote).forEach(pr=>{
        usages.push({paciente:p.name,pacienteId:p.id,fecha:c.fecha,marca:pr.marca||'',prod:pr.prod||'(sin nombre)',dosis:pr.dosis||'',zona:pr.zona||'',lote:(pr.lote||'').trim()||'Sin lote'});

}

function saveInventario(){

  if(!producto||!lote||isNaN(stock)){showToast('Producto, lote y stock son obligatorios');return;}
  STATE.inventario.unshift({id:'INV'+Date.now(),producto,marca:$('fi-marca').value,lote,stock,unidad:$('fi-unidad').value||'u.',minimo:parseFloat($('fi-minimo').value)||0});

function ajustarStock(id,delta){
  const item=STATE.inventario.find(i=>i.id===id);if(!item)return;

  syncToSheet('Inventario',STATE.inventario);renderInventario();
}
function eliminarInventario(id){STATE.inventario=STATE.inventario.filter(i=>i.id!==id);syncToSheet('Inventario',STATE.inventario);showToast('Eliminado');renderInventario();}
function descontarInventario(producto,lote){
  const item=STATE.inventario.find(i=>i.lote.toLowerCase()===lote.toLowerCase()&&i.producto.toLowerCase()===producto.toLowerCase());
  if(!item)return;
  item.stock=Math.max(0,Number(item.stock)-1);
  syncToSheet('Inventario',STATE.inventario);
}

// ── PRESUPUESTOS ──────────────────────────────────────────────────────────────
function getPresupuestoPagado(id){
  return STATE.movimientos.filter(m=>m.presupuestoId===id&&m.tipo==='ingreso').reduce((a,m)=>a+montoEnUSD(m),0);
}
function renderPresupuestos(){
  $('content-area').innerHTML=`

function eliminarPresupuesto(id){STATE.presupuestos=STATE.presupuestos.filter(p=>p.id!==id);syncToSheet('Presupuestos',STATE.presupuestos);showToast('Eliminado');renderPresupuestos();}
function verPresupuesto(id){

  const pagado=getPresupuestoPagado(id);const saldo=Math.max(0,total-pagado);

  openModal(`<div class="presup-preview">
