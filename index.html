// ── FIRMA REAL (canvas) — reemplaza el checkbox de "firmado" por una firma capturada de verdad ──
let firmaCtx=null,firmaDrawing=false;
function openFirmaModal(patientId,nombre,idx){
  openModal(`<div class="modal-title">Firmar consentimiento</div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:14px">${nombre}</div>
  <div style="background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border2)">
    <canvas id="firma-canvas" width="600" height="180" style="width:100%;height:180px;display:block;touch-action:none;cursor:crosshair"></canvas>
  </div>
  <div style="font-size:11px;color:var(--text3);margin-top:8px">Firme dentro del recuadro con el mouse o el dedo.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="limpiarFirma()">Limpiar</button><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="guardarFirma('${patientId}','${nombre.replace(/'/g,"\\'")}',${Number.isInteger(idx)?idx:-1})">Guardar firma</button></div>`);
  setTimeout(initFirmaCanvas,50);
}
function initFirmaCanvas(){
  const c=$('firma-canvas');if(!c)return;
  firmaCtx=c.getContext('2d');
  firmaCtx.lineWidth=2.2;firmaCtx.lineCap='round';firmaCtx.strokeStyle='#1a1a1a';
  const pos=(e)=>{const r=c.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:cx*(c.width/r.width),y:cy*(c.height/r.height)};};
  const start=(e)=>{firmaDrawing=true;const p=pos(e);firmaCtx.beginPath();firmaCtx.moveTo(p.x,p.y);e.preventDefault();};
  const move=(e)=>{if(!firmaDrawing)return;const p=pos(e);firmaCtx.lineTo(p.x,p.y);firmaCtx.stroke();e.preventDefault();};
  const end=()=>{firmaDrawing=false;};
  c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;
  c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
}
function limpiarFirma(){const c=$('firma-canvas');if(c&&firmaCtx)firmaCtx.clearRect(0,0,c.width,c.height);}
function guardarFirma(patientId,nombre,idx){
  const c=$('firma-canvas');if(!c)return;
  const dataUrl=c.toDataURL('image/png');
  const hc=STATE.hcData[patientId];if(!hc)return;
  const lista=hc.consentimientos||[];
  let con=(idx>=0&&lista[idx]&&lista[idx].nombre===nombre&&!lista[idx].firmado)?lista[idx]:null;
  if(!con)con=lista.find(x=>x.nombre===nombre&&!x.firmado);
  if(!con){showToast('Este consentimiento ya estaba firmado');closeModal();return;}
  con.firmado=true;con.fecha=todayVET();con.firma=dataUrl;
  persistHCData();closeModal();showToast('Firma guardada');
  const el=$('hc-tab-content');if(el)el.innerHTML=buildHCTab(patientId,'consentimientos');
}

function getCajaMovs(){
  const hoy=todayVET();
  if(STATE.activeCajaPeriodo==='hoy')return STATE.movimientos.filter(m=>m.fecha===hoy);
  if(STATE.activeCajaPeriodo==='semana'){const d=new Date(hoy);d.setDate(d.getDate()-7);return STATE.movimientos.filter(m=>m.fecha>=d.toISOString().split('T')[0]&&m.fecha<=hoy);}
  if(STATE.activeCajaPeriodo==='mes'){const d=new Date(hoy);d.setDate(d.getDate()-30);return STATE.movimientos.filter(m=>m.fecha>=d.toISOString().split('T')[0]&&m.fecha<=hoy);}
  return STATE.movimientos;
}
function renderCaja(){

function savePresupuesto(){
  const patId=$('fp-pat').value;const p=STATE.patients.find(x=>x.id===patId);if(!p)return;
  const tipo=$('fp-tipo').value;const vigencia=tipo==='quirurgico'?30:90;
  const items=[];
  document.querySelectorAll('.presup-item-entry').forEach(row=>{const d=row.querySelector('select');const m=row.querySelector('input[type="number"]');if(d&&m&&d.value)items.push({desc:d.value,monto:parseFloat(m.value)||0});});
  if(!items.length){showToast('Agrega al menos un procedimiento');return;}
  const usados=new Set(STATE.presupuestos.map(x=>String(x.id)));
  let n=STATE.presupuestos.reduce((mx,x)=>{const m=String(x.id).match(/^PRES-(\d+)/);return m?Math.max(mx,Number(m[1])):mx;},0)+1;
  const suf=()=>Math.random().toString(36).slice(2,5).toUpperCase();
  let id='PRES-'+String(n).padStart(3,'0')+'-'+suf();
  while(usados.has(id)){n++;id='PRES-'+String(n).padStart(3,'0')+'-'+suf();}
  STATE.presupuestos.unshift({id,fecha:todayVET(),paciente:p.name,pacienteId:p.id,cedula:p.cedula||'',tipo,items,vigencia,doc:getMedicoLabel(),notas:$('fp-notas').value,bcvRate:STATE.bcvRate||0});
  presupItemCount=1;closeModal();showToast(`Presupuesto ${id} generado`);
  syncToSheet('Presupuestos',STATE.presupuestos);renderPresupuestos();
}

function saveCita(force){
  const patId=$('f-cpat').value;const p=STATE.patients.find(x=>x.id===patId);if(!p){showToast('Selecciona un paciente de la lista');return;}
  const time=$('f-ctime').value,proc=$('f-cproc').value,fecha=$('f-cdate').value;
  const co=$('f-ccons');const consLabel=co.options[co.selectedIndex].text.split('·')[0].trim();
  if(!force){
    const conflicto=STATE.appointments.find(a=>a.fecha===fecha&&a.time===time&&a.consultorio===consLabel);
    if(conflicto){
      openModal(`<div class="modal-title">⚠Consultorio ocupado</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px"><strong style="color:var(--gold)">${consLabel}</strong> ya tiene a <strong>${conflicto.patient}</strong> agendado el <strong>${fmtDateVET(fecha)}</strong> a las <strong>${time}</strong>.<br><br>¿Quieres agendar a ${p.name} en el mismo horario de todas formas, o prefieres cambiar la hora o el consultorio?</div>
      <div class="modal-actions"><button class="btn-outline" onclick="openNewCita('${patId}')">Cambiar hora/consultorio</button><button class="btn btn-gold" onclick="saveCita(true)">Agendar de todas formas</button></div>`);
      return;
    }
  }
  STATE.appointments.push({id:'A'+Date.now(),fecha,time,patient:p.name,patientId:p.id,proc,doc:getMedicoLabel(),status:'pendiente',consultorio:consLabel,timezone:'VET'});
  STATE.appointments.sort((a,b)=>a.fecha===b.fecha?a.time.localeCompare(b.time):a.fecha.localeCompare(b.fecha));
  actualizarBadgeAgenda();
  closeModal();showToast(`Cita: ${p.name} · ${fecha} ${time} VET`);
  syncToSheet('Citas',STATE.appointments);
  if(STATE.view==='agenda')renderAgenda();else renderDashboard();
}

// ── MARKETING ─────────────────────────────────────────────────────────────────
function getProximosCumpleanos(){
  const hoy=nowVET();const hoyMD=hoy.getMonth()*100+hoy.getDate();
  return STATE.patients.filter(p=>p.dob&&p.dob!=='—').map(p=>{
    const d=new Date(p.dob+'T12:00:00');const md=d.getMonth()*100+d.getDate();
    let diff=md-hoyMD;if(diff<0)diff+=1200; // aproximación simple para cruzar de diciembre a enero
    return{...p,diasCumple:diff};
  }).filter(p=>p.diasCumple<=7).sort((a,b)=>a.diasCumple-b.diasCumple);
}

// ── SEGUIMIENTO POST-TRATAMIENTO (detecta solo, según la última consulta de cada paciente) ──
function getSeguimientosPendientes(){
  const hoy=todayVET();
  const pendientes=[];
  STATE.patients.forEach(p=>{
    const hc=STATE.hcData[p.id];
    if(!hc||!hc.consultas||!hc.consultas.length)return;
    const ultima=hc.consultas[0];
    if(!ultima||!ultima.fecha)return;
    const dias=Math.round((new Date(hoy+'T12:00:00')-new Date(ultima.fecha+'T12:00:00'))/86400000);
    if(dias<2||dias>30)return;
    if(dias>=7&&!ultima.segRealizado7d)pendientes.push({patient:p,proc:ultima.proc,tipo:'7d',etiqueta:'Seguimiento 7 días',dias});
    else if(dias>=2&&!ultima.segRealizado48)pendientes.push({patient:p,proc:ultima.proc,tipo:'48h',etiqueta:'Seguimiento 48h',dias});
  });
  return pendientes.sort((a,b)=>a.dias-b.dias);
}
function marcarSeguimientoHecho(patientId,tipo){
  const hc=STATE.hcData[patientId];if(!hc||!hc.consultas||!hc.consultas.length)return;
  const ultima=hc.consultas[0];
  if(tipo==='48h')ultima.segRealizado48=true;else ultima.segRealizado7d=true;
  persistHCData();showToast('Seguimiento marcado como hecho');renderMarketing();
}

function getPacientesInactivos(){
  const hoy=todayVET();
  return STATE.patients.filter(p=>(p.etapa||'paciente')==='paciente'&&p.lastVisit&&p.lastVisit!=='—').map(p=>{
    const dias=Math.round((new Date(hoy+'T12:00:00')-new Date(p.lastVisit+'T12:00:00'))/86400000);
    return{...p,diasInactivo:dias};
  }).filter(p=>p.diasInactivo>=90).sort((a,b)=>b.diasInactivo-a.diasInactivo);
}

  $('fecha-hoy').textContent=n.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+' · '+n.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})+' VET';

// ═══════════════════════════════════════════════════════════════════════════
// v3 · FLUJO CITA → CONSULTA → COBRO · PRESUPUESTOS CON ESTADOS · ARCHIVADO
//  • Nada se borra: "eliminar" archiva el registro y se puede restaurar.
//  • La cita avanza por pasos (Agendada → Confirmada → En consulta → Atendida → Cobrada).
//  • Cada cobro queda vinculado a su cita o presupuesto y a su paciente.
// ═══════════════════════════════════════════════════════════════════════════
const V3_INICIO='2026-11-14'; // las citas anteriores no se listan como "por cobrar"
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsq(s){return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}
function fmtMonto(n){return '$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});}
function minutos(t){const x=String(t||'0:0').split(':').map(Number);return(x[0]||0)*60+(x[1]||0);}
function existeServicio(proc){return Object.values(SERVICIOS).some(items=>items.some(x=>x.n===proc));}
function precioCatalogo(proc){for(const items of Object.values(SERVICIOS)){const s=items.find(x=>x.n===proc);if(s)return Number(s.p)||0;}return 0;}
function actualizarBadgeAgenda(){
  const bd=$('badge-agenda');if(!bd)return;const hoy=todayVET();
  bd.textContent=STATE.appointments.filter(a=>a.fecha===hoy&&a.status!=='cancelado'&&a.status!=='no_asistio').length;
  bd.title='Citas de hoy';
}

// ── COBRO DE CITAS ────────────────────────────────────────────────────────────
function pagosDeCita(id){return STATE.movimientos.filter(m=>m.citaId===id&&m.tipo==='ingreso');}
function cobradoCita(id){return pagosDeCita(id).reduce((a,m)=>a+montoEnUSD(m),0);}
function precioCita(a){return(a.precio!==undefined&&a.precio!==null&&a.precio!=='')?Number(a.precio)||0:precioCatalogo(a.proc);}
function estadoCobroCita(a){
  if(a.sinCargo)return'sin_cargo';
  if(a.bonoId)return'bono';
  if(a.presupuestoId&&STATE.presupuestos.some(p=>p.id===a.presupuestoId))return'presupuesto';
  const pag=cobradoCita(a.id),precio=precioCita(a);
  if(pag>0&&(precio<=0||pag>=precio-0.01))return'cobrada';
  if(pag>0)return'parcial';
  if(precio<=0)return'sin_cargo';
  return'pendiente';
}
function citasPorCobrar(){
  return STATE.appointments.filter(a=>a.status==='completado'&&(a.fecha||'')>=V3_INICIO&&['pendiente','parcial'].includes(estadoCobroCita(a)));
}
function chipCobro(a){
  if(a.status!=='completado')return'';
  const e=estadoCobroCita(a);
  if(e==='cobrada')return'<span class="status-badge badge-green">Cobrada</span>';
  if(e==='parcial')return`<span class="status-badge badge-gold">Parcial ${fmtMonto(cobradoCita(a.id))} / ${fmtMonto(precioCita(a))}</span>`;
  if(e==='presupuesto')return'<span class="status-badge badge-blue">Vía presupuesto</span>';
  if(e==='sin_cargo')return'<span class="status-badge badge-gray">Sin cargo</span>';
  if(e==='bono')return'<span class="status-badge badge-blue">Con bono</span>';
  if((a.fecha||'')<V3_INICIO)return'';
  return'<span class="status-badge badge-red">Por cobrar</span>';
}
function accionPrincipalCita(a){
  const id=jsq(a.id);
  if(a.status==='pendiente')return['Confirmar',`setEstadoCita('${id}','confirmado')`];
  if(a.status==='confirmado')return['Llegó · iniciar',`setEstadoCita('${id}','en_consulta')`];
  if(a.status==='en_consulta')return['Finalizar',`finalizarCita('${id}',true)`];
  if(a.status==='completado'){
    const e=estadoCobroCita(a);
    if(e==='pendiente'||e==='parcial')return['Cobrar',`openCobroCita('${id}')`];
  }
  return null;
}
function filaAccionesCita(a){
  const ap=accionPrincipalCita(a);const st=statusMap[a.status]||statusMap.pendiente;
  return`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <span class="status-badge ${st.cls}">${st.label}</span>${chipCobro(a)}
        ${ap?`<button class="btn btn-gold btn-sm" onclick="event.stopPropagation();${ap[1]}">${ap[0]}</button>`:''}
      </div>`;
}
function refrescarTrasCita(id,reabrir){
  if(STATE.view==='agenda')renderAgenda();else if(STATE.view==='dashboard')renderDashboard();
  actualizarBadgeAgenda();
  if(reabrir&&STATE._citaAbierta===id&&!$('modal-overlay').classList.contains('hidden'))abrirCita(id);
}
function setEstadoCita(id,st){
  const a=STATE.appointments.find(x=>x.id===id);if(!a||!statusMap[st])return;
  const ahora=new Date().toISOString();
  a.status=st;
  if(st==='confirmado')a.confirmadaEl=ahora;
  if(st==='en_consulta')a.llegadaEl=ahora;
  if(st==='completado')a.atendidaEl=ahora;
  if(st==='cancelado'||st==='no_asistio')a.cerradaEl=ahora;
  syncToSheet('Citas',STATE.appointments);
  showToast('Cita: '+statusMap[st].label);
  refrescarTrasCita(id,true);
}
function finalizarCita(id,conNota){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  a.status='completado';a.atendidaEl=new Date().toISOString();
  syncToSheet('Citas',STATE.appointments);
  STATE._citaAbierta=null;closeModal();
  const p=pacienteDeCita(a);
  if(!conNota||!p){
    showToast('Cita atendida');refrescarTrasCita(id,false);
    const e=estadoCobroCita(a);
    if(e==='pendiente'||e==='parcial')openCobroCita(id);
    return;
  }
  STATE._citaEnCurso=id;
  STATE.activeHCPatient=p.id;STATE.activeHCTab='consultas';
  showView('hc');
  setTimeout(()=>{
    openNewConsulta(p.id);
    const s=$('fc-proc');if(s&&existeServicio(a.proc)){s.value=a.proc;recetaBox();}
    const f=$('fc-fecha');if(f&&a.fecha&&a.fecha<=todayVET())f.value=a.fecha;
  },300);
}
// Se llama al guardar una consulta: si venía de una cita, se ofrece cobrarla en el mismo paso.
function despuesDeConsulta(patId){
  const id=STATE._citaEnCurso;if(!id)return;
  STATE._citaEnCurso=null;
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const p=pacienteDeCita(a);if(!p||p.id!==patId)return;
  const e=estadoCobroCita(a);
  if(e==='pendiente'||e==='parcial')setTimeout(()=>openCobroCita(id),350);
}
function openCobroCita(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  if(a.presupuestoId&&STATE.presupuestos.some(p=>p.id===a.presupuestoId)){registrarPagoPresupuesto(a.presupuestoId);return;}
  const saldo=Math.max(0,precioCita(a)-cobradoCita(id));
  const p=pacienteDeCita(a);
  STATE._citaAbierta=null;
  openNewMovimiento({tipo:'ingreso',desc:`${a.proc} — ${a.patient}`,citaId:id,patientId:p?p.id:(a.patientId||''),monto:saldo>0?saldo.toFixed(2):''});
}
function guardarPrecioCita(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const v=parseFloat($('ct-precio').value);
  if(isNaN(v)||v<0){showToast('Ingresa un precio válido');return;}
  a.precio=v;a.sinCargo=false;
  syncToSheet('Citas',STATE.appointments);showToast('Precio de la cita actualizado');refrescarTrasCita(id,true);
}
function marcarSinCargo(id,valor){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  a.sinCargo=!!valor;
  syncToSheet('Citas',STATE.appointments);showToast(valor?'Cita marcada sin cargo':'Cita vuelve a ser cobrable');refrescarTrasCita(id,true);
}
function verHCdeCita(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const p=pacienteDeCita(a);STATE._citaAbierta=null;closeModal();
  if(!p){abrirVincularCita(id);return;}
  STATE.activeHCPatient=p.id;STATE.activeHCTab='timeline';showView('hc');
}

// ── FICHA DE CITA (un solo lugar para todo lo que pasa con la cita) ────────────
function abrirCita(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  STATE._citaAbierta=id;
  const cid=jsq(id);
  const p=pacienteDeCita(a);
  const ec=estadoCobroCita(a),precio=precioCita(a),pag=cobradoCita(id),saldo=Math.max(0,precio-pag);
  const cerrada=a.status==='cancelado'||a.status==='no_asistio';
  let idx=['pendiente','confirmado','en_consulta','completado'].indexOf(a.status);
  if(a.status==='completado'&&ec!=='pendiente'&&ec!=='parcial')idx=4;
  const pasos=['Agendada','Confirmada','En consulta','Atendida',ec==='sin_cargo'?'Sin cargo':ec==='bono'?'Con bono':ec==='presupuesto'?'Vía presupuesto':'Cobrada'];
  let principal='';
  if(a.status==='pendiente')principal=`<button class="btn btn-gold" onclick="setEstadoCita('${cid}','confirmado')">✓ Confirmar cita</button>`;
  else if(a.status==='confirmado')principal=`<button class="btn btn-gold" onclick="setEstadoCita('${cid}','en_consulta')">Llegó · iniciar consulta</button>`;
  else if(a.status==='en_consulta')principal=`<button class="btn btn-gold" onclick="finalizarCita('${cid}',true)">Finalizar y registrar consulta</button><button class="btn-outline" onclick="finalizarCita('${cid}',false)">Finalizar sin nota clínica</button>`;
  else if(a.status==='completado'&&(ec==='pendiente'||ec==='parcial'))principal=(bonoParaCita(a)&&!pag?`<button class="btn btn-gold" onclick="usarBono('${cid}')">Usar sesión del bono (quedan ${bonoRestantes(bonoParaCita(a))})</button>`:'')+`<button class="${bonoParaCita(a)&&!pag?'btn-outline':'btn btn-gold'}" onclick="openCobroCita('${cid}')">Cobrar ${fmtMonto(saldo)}</button>`;
  else if(a.status==='completado'&&ec==='presupuesto')principal=`<button class="btn btn-gold" onclick="STATE._citaAbierta=null;verPresupuesto('${jsq(a.presupuestoId)}')">Ver presupuesto ${esc(a.presupuestoId)}</button>`;
  const pagos=pagosDeCita(id);
  openModal(`<div class="modal-title">${esc(a.patient||'(sin nombre)')}</div>
  <div style="font-size:13px;color:var(--text2);line-height:1.6">${esc(a.proc)}<br><span style="color:var(--text3)">${a.fecha?fmtDateVET(a.fecha):''} · ${esc(a.time)} VET${a.dur?` (${Number(a.dur)} min)`:''} · ${esc(a.consultorio)} · ${esc(a.doc)}</span></div>
  ${p?'':`<div style="font-size:11.5px;color:var(--red);margin-top:6px">⚠ No vinculada a un paciente registrado — <span style="text-decoration:underline;cursor:pointer" onclick="STATE._citaAbierta=null;abrirVincularCita('${cid}')">vincular</span></div>`}
  ${alertasPaciente(p)}
  ${cerrada?`<div class="alert-banner" style="margin-top:14px"><span class="alert-banner-icon">⚠</span><div><strong>${statusMap[a.status].label}</strong> — la cita no se atendió. Puedes reabrirla si fue un error.</div></div>`
  :`<div class="stepper">${pasos.map((s,i)=>`<div class="stp${i<=idx?' on':''}${i===idx?' cur':''}"><span>${i<idx||idx===4?'✓':i+1}</span>${s}</div>`).join('')}</div>`}
  ${principal?`<div class="cita-acc" style="margin-top:0;margin-bottom:16px">${principal}</div>`:''}
  ${cerrada||ec==='presupuesto'||ec==='bono'||(a.status!=='completado'&&!pagosDeCita(id).length)?'':`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px">
    <div style="font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:600">Cobro</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text2)">
      <span>Precio $</span><input class="form-input" id="ct-precio" type="number" min="0" step="0.01" style="width:100px;padding:6px 10px" value="${precio}">
      <button class="icon-btn btn-sm" onclick="guardarPrecioCita('${cid}')">Guardar precio</button>
      ${a.sinCargo?`<button class="icon-btn btn-sm" onclick="marcarSinCargo('${cid}',false)">Quitar "sin cargo"</button>`:`<button class="icon-btn btn-sm" onclick="marcarSinCargo('${cid}',true)">Sin cargo</button>`}
    </div>
    <div style="font-size:12.5px;color:var(--text2);margin-top:10px">Cobrado: <strong style="color:var(--green)">${fmtMonto(pag)}</strong>${a.sinCargo?' · <strong>Sin cargo</strong>':` · Saldo: <strong style="color:${saldo>0?'var(--gold)':'var(--green)'}">${fmtMonto(saldo)}</strong>`}</div>
    ${pagos.map(m=>`<div style="font-size:11.5px;color:var(--text3);margin-top:4px">• ${m.fecha?fmtDateVET(m.fecha):''} · ${esc(m.metodo||'')} · ${m.moneda==='BS'?Number(m.monto).toFixed(2)+' Bs':fmtMonto(m.monto)}</div>`).join('')}
    ${pag>0&&saldo>0?`<div style="margin-top:8px"><button class="icon-btn btn-sm" onclick="openCobroCita('${cid}')">+ Otro pago</button></div>`:''}
  </div>`}
  <details class="mas-op"><summary>Más opciones</summary><div class="cita-acc">
    <button class="icon-btn btn-sm" onclick="enviarRecordatorioWA('${cid}')">Recordatorio</button>
    <button class="icon-btn btn-sm" onclick="verHCdeCita('${cid}')">Historia clínica</button>
    <button class="icon-btn btn-sm" onclick="openEditarCita('${cid}')">Reprogramar</button>
    ${cerrada?`<button class="icon-btn btn-sm" onclick="setEstadoCita('${cid}','pendiente')">↺ Reabrir</button>`:a.status!=='completado'?`<button class="icon-btn btn-sm" onclick="setEstadoCita('${cid}','no_asistio')">No asistió</button><button class="icon-btn btn-sm" onclick="setEstadoCita('${cid}','cancelado')">Cancelar cita</button>`:''}
    ${a.status!=='completado'&&!cerrada?`<button class="icon-btn btn-sm" onclick="openCobroCita('${cid}')">Cobrar por adelantado</button>`:''}
    <button class="icon-btn btn-sm" style="color:var(--text3)" onclick="STATE._citaAbierta=null;eliminarCita('${cid}')">Archivar</button>
  </div></details>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cerrar</button></div>`);
}

// ── AGENDAR / REPROGRAMAR (con duración y solapamiento real) ──────────────────
function citaSolapa(fecha,time,dur,cons,exceptId){
  const ini=minutos(time),fin=ini+(Number(dur)||30);
  return STATE.appointments.find(a=>a.id!==exceptId&&a.fecha===fecha&&a.consultorio===cons&&a.status!=='cancelado'&&a.status!=='no_asistio'&&minutos(a.time)<fin&&minutos(a.time)+(Number(a.dur)||30)>ini);
}
function buildDuracionSelect(id,sel){
  return`<select class="form-input" id="${id}">${[15,30,45,60,90,120,180,240].map(d=>`<option value="${d}"${Number(sel||30)===d?' selected':''}>${d<60?d+' min':(d/60)+' h'}</option>`).join('')}</select>`;
}
function buildProcSelect(id,sel){
  let h=buildServiciosSelect(id,sel||'');
  if(sel&&!existeServicio(sel))h=h.replace('>',`><option value="${esc(sel)}" selected>${esc(sel)}</option>`);
  return h;
}
function consLabelDe(selId){const co=$(selId);return co.options[co.selectedIndex].text.split('·')[0].trim();}
function openNewCita(patId='',pre){
  pre=pre||{};
  if(typeof patId!=='string')patId='';
  if(!STATE.patients.length){showToast('Registra un paciente primero');return;}
  STATE._citaAbierta=null;
  openModal(`<div class="modal-title">Nueva cita <span class="tz-badge" style="font-size:10px">VET</span></div>
  <div style="background:rgba(201,164,82,.08);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">⚠La hora se guarda en <strong style="color:var(--gold)">hora Venezuela (VET)</strong> sin importar desde dónde se agende.${pre.presupuestoId?`<br>Vinculada al presupuesto <strong style="color:var(--gold)">${esc(pre.presupuestoId)}</strong>: el cobro se lleva en el presupuesto.`:''}</div>
  <input type="hidden" id="f-cpres" value="${esc(pre.presupuestoId||'')}">
  <div class="form-row"><div class="form-group"><label class="form-label">Paciente</label>${buildPacienteSelect('f-cpat',patId)}</div><div class="form-group"><label class="form-label">Fecha (VET)</label><input class="form-input" type="date" id="f-cdate" value="${pre.fecha||todayVET()}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Hora VET</label><input class="form-input" type="time" id="f-ctime" value="${pre.time||'09:00'}"></div><div class="form-group"><label class="form-label">Duración</label>${buildDuracionSelect('f-cdur',pre.dur)}</div></div>
  <div class="form-group"><label class="form-label">Consultorio</label>${buildConsultorioSelect('f-ccons')}</div>
  <div class="form-group"><label class="form-label">Procedimiento</label>${buildProcSelect('f-cproc',pre.proc)}</div>
  <div class="form-group"><label class="form-label">Médico</label>${buildMedicoField()}</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveCita()">Agendar</button></div>`);
}
function avisoSolape(c,d,volver,forzar){
  openModal(`<div class="modal-title">⚠Consultorio ocupado</div>
  <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px"><strong style="color:var(--gold)">${esc(d.cons)}</strong> ya tiene a <strong>${esc(c.patient)}</strong> el <strong>${fmtDateVET(d.fecha)}</strong> de ${esc(c.time)} a ${(()=>{const f=minutos(c.time)+(Number(c.dur)||30);return String(Math.floor(f/60)).padStart(2,'0')+':'+String(f%60).padStart(2,'0');})()}, y se cruza con el horario elegido (${esc(d.time)}, ${d.dur} min).<br><br>¿Agendar de todas formas o cambiar la hora o el consultorio?</div>
  <div class="modal-actions"><button class="btn-outline" onclick="${volver}">Cambiar hora/consultorio</button><button class="btn btn-gold" onclick="${forzar}">Agendar de todas formas</button></div>`);
}
function saveCita(force){
  let d;
  if(force===true&&STATE._citaPend)d=STATE._citaPend;
  else d={patId:$('f-cpat').value,time:$('f-ctime').value,proc:$('f-cproc').value,fecha:$('f-cdate').value,cons:consLabelDe('f-ccons'),dur:Number($('f-cdur')?.value)||30,doc:getMedicoLabel(),presupuestoId:$('f-cpres')?.value||''};
  const p=STATE.patients.find(x=>x.id===d.patId);
  if(!p){showToast('Selecciona un paciente de la lista');return;}
  if(!d.fecha||!d.time){showToast('Fecha y hora son obligatorias');return;}
  if(force!==true){
    const c=citaSolapa(d.fecha,d.time,d.dur,d.cons,null);
    if(c){STATE._citaPend=d;avisoSolape(c,d,`openNewCita('${jsq(d.patId)}',STATE._citaPend)`,'saveCita(true)');return;}
  }
  STATE._citaPend=null;
  const cita={id:'A'+Date.now(),fecha:d.fecha,time:d.time,dur:d.dur,patient:p.name,patientId:p.id,proc:d.proc,doc:d.doc,status:'pendiente',consultorio:d.cons,timezone:'VET',precio:precioCatalogo(d.proc),creadaEl:new Date().toISOString()};
  if(d.presupuestoId)cita.presupuestoId=d.presupuestoId;
  STATE.appointments.push(cita);
  STATE.appointments.sort((a,b)=>a.fecha===b.fecha?String(a.time).localeCompare(String(b.time)):String(a.fecha).localeCompare(String(b.fecha)));
  actualizarBadgeAgenda();
  closeModal();showToast(`Cita: ${p.name} · ${d.fecha} ${d.time} VET`);
  syncToSheet('Citas',STATE.appointments);
  if(STATE.view==='agenda')renderAgenda();else if(STATE.view==='dashboard')renderDashboard();else programarRefresco();
}
function openEditarCita(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  STATE._citaAbierta=null;
  const pre=STATE._citaPend&&STATE._citaPend.editId===id?STATE._citaPend:null;
  openModal(`<div class="modal-title">Reprogramar cita</div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:14px"><strong style="color:var(--gold)">${esc(a.patient)}</strong></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Fecha (VET)</label><input class="form-input" type="date" id="fe-date" value="${esc(pre?pre.fecha:a.fecha)}"></div><div class="form-group"><label class="form-label">Hora VET</label><input class="form-input" type="time" id="fe-time" value="${esc(pre?pre.time:a.time)}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Duración</label>${buildDuracionSelect('fe-dur',pre?pre.dur:a.dur)}</div><div class="form-group"><label class="form-label">Consultorio</label>${buildConsultorioSelect('fe-cons')}</div></div>
  <div class="form-group"><label class="form-label">Procedimiento</label>${buildProcSelect('fe-proc',pre?pre.proc:a.proc)}</div>
  <div class="modal-actions"><button class="btn-outline" onclick="abrirCita('${jsq(id)}')">Volver</button><button class="btn btn-gold" onclick="guardarEdicionCita('${jsq(id)}')">Guardar cambios</button></div>`);
  const actual=pre?pre.cons:a.consultorio;
  const c=CONSULTORIOS.find(x=>x.label.split('·')[0].trim()===actual);if(c)$('fe-cons').value=c.id;
}
function guardarEdicionCita(id,force){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  let d;
  if(force===true&&STATE._citaPend&&STATE._citaPend.editId===id)d=STATE._citaPend;
  else d={editId:id,fecha:$('fe-date').value,time:$('fe-time').value,dur:Number($('fe-dur').value)||30,cons:consLabelDe('fe-cons'),proc:$('fe-proc').value};
  if(!d.fecha||!d.time){showToast('Fecha y hora son obligatorias');return;}
  if(force!==true){
    const fb=formacionEnSlot(d.fecha,d.time);
    if(fb){showToast(`Ese horario está bloqueado por la formación "${fb.nombre}"`);return;}
    const c=citaSolapa(d.fecha,d.time,d.dur,d.cons,id);
    if(c){STATE._citaPend=d;avisoSolape(c,d,`openEditarCita('${jsq(id)}')`,`guardarEdicionCita('${jsq(id)}',true)`);return;}
  }
  STATE._citaPend=null;
  const cambioHorario=a.fecha!==d.fecha||a.time!==d.time;
  if(cambioHorario){a.reprogramadaDe=`${a.fecha} ${a.time}`;a.recordatorioEnviado=false;}
  if(a.proc!==d.proc&&(a.precio===undefined||Number(a.precio)===precioCatalogo(a.proc)))a.precio=precioCatalogo(d.proc);
  a.fecha=d.fecha;a.time=d.time;a.dur=d.dur;a.consultorio=d.cons;a.proc=d.proc;
  STATE.appointments.sort((x,y)=>x.fecha===y.fecha?String(x.time).localeCompare(String(y.time)):String(x.fecha).localeCompare(String(y.fecha)));
  syncToSheet('Citas',STATE.appointments);
  closeModal();showToast(cambioHorario?'Cita reprogramada':'Cita actualizada');
  refrescarTrasCita(id,false);
}

// ── PRESUPUESTOS CON ESTADOS (borrador → enviado → aceptado → cobrado) ────────
const PRES_ESTADOS={borrador:['Borrador','badge-gray'],enviado:['Enviado','badge-blue'],aceptado:['Aceptado','badge-gold'],parcial:['Cobro parcial','badge-gold'],cobrado:['Cobrado','badge-green'],rechazado:['Rechazado','badge-red'],vencido:['Vencido','badge-red']};
function totalPresupuesto(pr){return(pr.items||[]).reduce((a,i)=>a+(Number(i.monto)||0),0);}
function estadoPresupuesto(pr){
  const total=totalPresupuesto(pr),pag=getPresupuestoPagado(pr.id);
  if(total>0&&pag>=total-0.01)return'cobrado';
  if(pr.estado==='rechazado')return'rechazado';
  if(pag>0)return'parcial';
  if(pr.estado==='aceptado')return'aceptado';
  const exp=new Date((pr.fecha||todayVET())+'T12:00:00');exp.setDate(exp.getDate()+(Number(pr.vigencia)||90));
  if(exp.toISOString().slice(0,10)<todayVET())return'vencido';
  return pr.estado==='enviado'?'enviado':'borrador';
}
function presupuestosPorCobrar(){
  return STATE.presupuestos.filter(pr=>['aceptado','parcial'].includes(estadoPresupuesto(pr))&&totalPresupuesto(pr)>0);
}
function renderPresupuestos(){
  const f=STATE.presupFiltro||'todos';
  const todos=STATE.presupuestos.map(pr=>({pr,est:estadoPresupuesto(pr),total:totalPresupuesto(pr),pagado:getPresupuestoPagado(pr.id)}));
  const lista=f==='todos'?todos:todos.filter(x=>x.est===f||(f==='aceptado'&&x.est==='parcial'));
  const cuenta=e=>todos.filter(x=>x.est===e||(e==='aceptado'&&x.est==='parcial')).length;
  const porCobrar=todos.filter(x=>x.est==='aceptado'||x.est==='parcial').reduce((a,x)=>a+Math.max(0,x.total-x.pagado),0);
  const enEspera=todos.filter(x=>x.est==='borrador'||x.est==='enviado');
  $('content-area').innerHTML=`
  <div class="section-header"><div class="section-title">Presupuestos (${STATE.presupuestos.length})</div><button class="btn btn-gold" onclick="openNewPresupuesto()">+ Nuevo presupuesto</button></div>
  ${STATE.presupuestos.length?`
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="kpi-card"><div class="kpi-label">En espera de respuesta</div><div class="kpi-value">${enEspera.length}</div><div class="kpi-sub">${fmtMonto(enEspera.reduce((a,x)=>a+x.total,0))} cotizados</div></div>
    <div class="kpi-card"><div class="kpi-label">Aceptados por cobrar</div><div class="kpi-value" style="${porCobrar>0?'color:var(--gold)':''}">${fmtMonto(porCobrar)}</div><div class="kpi-sub">${cuenta('aceptado')} presupuesto(s)</div></div>
    <div class="kpi-card"><div class="kpi-label">Cobrados</div><div class="kpi-value">${cuenta('cobrado')}</div><div class="kpi-sub">${fmtMonto(todos.filter(x=>x.est==='cobrado').reduce((a,x)=>a+x.total,0))}</div></div>
  </div>
  <div class="filtros">${[['todos','Todos'],['borrador','Borrador'],['enviado','Enviado'],['aceptado','Aceptado'],['cobrado','Cobrado'],['rechazado','Rechazado'],['vencido','Vencido']].map(([k,l])=>`<button class="periodo-btn${f===k?' active':''}" onclick="STATE.presupFiltro='${k}';renderPresupuestos()">${l}${k==='todos'?'':' ('+cuenta(k)+')'}</button>`).join('')}</div>
  ${lista.length?`<div class="presup-list">${lista.map(({pr,est,total,pagado})=>`<div class="presup-card" onclick="verPresupuesto('${jsq(pr.id)}')"><div><div style="font-size:11px;color:var(--text3)">${esc(pr.id)}</div><span class="tag ${pr.tipo==='quirurgico'?'tag-surg':'tag-rec'}" style="margin-top:4px;display:inline-block">${pr.tipo==='quirurgico'?'Quirúrgico':'Estética'}</span></div><div style="flex:1"><div style="font-size:14px;font-weight:500;color:var(--text)">${esc(pr.paciente||'')}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${(pr.items||[]).map(i=>esc((i.desc||'').split('—')[0].trim())).join(' · ')}</div>${total>0&&pagado>0&&est!=='cobrado'?`<div style="font-size:10.5px;margin-top:4px;color:var(--gold)">Pagado ${fmtMonto(pagado)} de ${fmtMonto(total)}</div>`:''}</div><div style="text-align:right"><div style="font-size:15px;font-weight:600;color:var(--gold)">${total>0?fmtMonto(total):'Consultar'}</div><div style="font-size:11px;color:var(--text3);margin:2px 0 4px">${pr.fecha?fmtDateVET(pr.fecha):''}</div><span class="status-badge ${PRES_ESTADOS[est][1]}">${PRES_ESTADOS[est][0]}</span></div></div>`).join('')}</div>`:`<div class="card" style="text-align:center;padding:28px;color:var(--text3)">Ningún presupuesto en este estado.</div>`}
  `:`<div class="card" style="text-align:center;padding:36px;color:var(--text3)"><div style="font-size:34px;margin-bottom:8px"></div>Sin presupuestos<br><button class="btn btn-gold btn-sm" style="margin-top:12px" onclick="openNewPresupuesto()">+ Crear primero</button></div>`}`;
}
function setEstadoPresupuesto(id,estado){
  const pr=STATE.presupuestos.find(x=>x.id===id);if(!pr)return;
  pr.estado=estado;pr[estado+'El']=new Date().toISOString();
  syncToSheet('Presupuestos',STATE.presupuestos);
  showToast('Presupuesto: '+(PRES_ESTADOS[estado]?PRES_ESTADOS[estado][0]:estado));
  if(STATE.view==='presupuestos')renderPresupuestos();
  verPresupuesto(id);
}
function enviarPresupuestoWA(id){
  const pr=STATE.presupuestos.find(x=>x.id===id);if(!pr)return;
  const p=STATE.patients.find(x=>x.id===pr.pacienteId);
  const tel=((p&&p.phone)||'').replace(/\D/g,'');
  const total=totalPresupuesto(pr);

  window.open(tel?`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');

function registrarPagoPresupuesto(id){

function savePresupuesto(){
  const patId=$('fp-pat').value;const p=STATE.patients.find(x=>x.id===patId);if(!p){showToast('Selecciona un paciente de la lista');return;}
  const tipo=$('fp-tipo').value;const vigencia=tipo==='quirurgico'?30:90;
  const items=[];
  document.querySelectorAll('.presup-item-entry').forEach(row=>{const d=row.querySelector('select');const m=row.querySelector('input[type="number"]');if(d&&m&&d.value)items.push({desc:d.value,monto:parseFloat(m.value)||0});});
  if(!items.length){showToast('Agrega al menos un procedimiento');return;}
  const todosIds=STATE.presupuestos.concat(STATE.archivados.Presupuestos||[]);
  const usados=new Set(todosIds.map(x=>String(x.id)));
  let n=todosIds.reduce((mx,x)=>{const m=String(x.id).match(/^PRES-(\d+)/);return m?Math.max(mx,Number(m[1])):mx;},0)+1;
  const suf=()=>Math.random().toString(36).slice(2,5).toUpperCase();
  let id='PRES-'+String(n).padStart(3,'0')+'-'+suf();
  while(usados.has(id)){n++;id='PRES-'+String(n).padStart(3,'0')+'-'+suf();}
  STATE.presupuestos.unshift({id,fecha:todayVET(),paciente:p.name,pacienteId:p.id,cedula:p.cedula||'',tipo,items,vigencia,doc:getMedicoLabel(),notas:$('fp-notas').value,bcvRate:STATE.bcvRate||0,estado:'borrador'});
  presupItemCount=1;closeModal();showToast(`Presupuesto ${id} generado`);
  syncToSheet('Presupuestos',STATE.presupuestos);renderPresupuestos();
  verPresupuesto(id);
}

async function restaurarArchivado(col,id){
  const d=(STATE.archivados[col]||[]).find(x=>String(x.id)===String(id));if(!d)return;
  const jobs=[[col,d]];
  if(col==='Pacientes'){
    const hc=(STATE.archivados.HistoriaClinica||[]).find(x=>String(x.id)===String(id));
    if(hc)jobs.push(['HistoriaClinica',hc]);
    const t0=Date.parse(d.archivadoEl||'')||0;
    (STATE.archivados.Citas||[]).forEach(c=>{if(c.patientId===d.id&&Math.abs((Date.parse(c.archivadoEl||'')||0)-t0)<30000)jobs.push(['Citas',c]);});
  }
  SYNC.pending++;updateSyncBadge();
  try{
    const b=db.batch();const ahora=new Date().toISOString();
    jobs.forEach(([c,x])=>{const docId=(SYNC.docIds[c]||{})[String(x.id)]||String(x.id);b.set(db.collection(c).doc(docId),{archivado:false,restauradoEl:ahora},{merge:true});});
    await b.commit();
    SYNC.pending--;updateSyncBadge();
    showToast(jobs.length>1?`Restaurado (con ${jobs.length-1} registro(s) vinculados)`:'Restaurado');
  }catch(e){SYNC.pending--;reportarErrorDatos(col,e,true);}
}


// ═══════════════════════════════════════════════════════════════════════════
// v4 · AGENDA TÁCTIL Y MENOS BOTONES
//  • Se reserva tocando el hueco del calendario (vista Día o Semana).
//  • Para cerrar una cita solo se pide: nombre y apellido, teléfono y correo.
//  • Una acción principal por pantalla; lo demás va en "Más opciones".
// ═══════════════════════════════════════════════════════════════════════════
const AG_HORAS=(()=>{const t=[];for(let m=7*60;m<=18*60+30;m+=30)t.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));return t;})();
function fechaMas(f,n){const d=new Date(f+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function diaSemana(f){return new Date(f+'T12:00:00Z').getUTCDay();}
function fmtDiaLargo(f){return new Date(f+'T12:00:00Z').toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});}
function slotDe(time){
  const m=minutos(time);let best=0,bd=Infinity;
  AG_HORAS.forEach((t,i)=>{const d=m-minutos(t);if(d>=0&&d<bd){bd=d;best=i;}});
  if(m<minutos(AG_HORAS[0]))best=0;
  return best;
}
function agendaVista(){return STATE.agendaVista||(window.innerWidth<760?'dia':'semana');}
function setAgendaVista(v){STATE.agendaVista=v;renderAgenda();}
function agendaMover(n){
  if(agendaVista()==='dia')STATE.agendaDia=fechaMas(STATE.agendaDia||todayVET(),n);
  else STATE.agendaDia=fechaMas(STATE.agendaDia||todayVET(),7*n);
  renderAgenda();
}
function agendaHoy(){STATE.agendaDia=todayVET();renderAgenda();}
function agendaIrDia(f){STATE.agendaDia=f;STATE.agendaVista='dia';renderAgenda();}
function eventoHtml(a,compacto){
  const cls=a.status==='en_consulta'?' ev-gold':a.status==='confirmado'?' ev-green':a.status==='completado'?' ev-blue':'';
  const ap=compacto?null:accionPrincipalCita(a);
  return`<div class="cal-event ce-${a.status}${cls}${compacto?'':' ev-dia'}" onclick="event.stopPropagation();abrirCita('${jsq(a.id)}')">
    <div style="flex:1;min-width:0"><div class="cal-event-name">${esc(a.time)} ${esc(compacto?String(a.patient||'').split(' ')[0]:a.patient)}</div><div class="cal-event-proc">${esc(compacto?String(a.proc||'').split('—')[0].trim().slice(0,16):a.proc)}</div></div>
    ${compacto?'':`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span class="status-badge ${(statusMap[a.status]||statusMap.pendiente).cls}">${(statusMap[a.status]||statusMap.pendiente).label}</span>${chipCobro(a)}${ap?`<button class="btn btn-gold btn-sm" onclick="event.stopPropagation();${ap[1]}">${ap[0]}</button>`:''}</div>`}
  </div>`;
}
function renderAgenda(){
  const hoy=todayVET();const vista=agendaVista();
  const dia=STATE.agendaDia||hoy;
  let cuerpo,label;
  if(vista==='dia'){
    label=fmtDiaLargo(dia);
    const citas=STATE.appointments.filter(a=>a.fecha===dia);
    const nv=nowVET(),mAhora=nv.getHours()*60+nv.getMinutes();
    const iAhora=(dia===hoy&&mAhora>=7*60&&mAhora<19*60)?slotDe(String(nv.getHours()).padStart(2,'0')+':'+String(nv.getMinutes()).padStart(2,'0')):-1;
    const porSlot={};citas.forEach(a=>{const i=slotDe(a.time);(porSlot[i]=porSlot[i]||[]).push(a);});
    cuerpo=`${formacionesDelDia(dia).map(bannerFormacion).join('')}<div class="card dia-lista" style="padding:0;overflow:hidden">
      ${AG_HORAS.map((t,i)=>`<div class="dia-fila${t.endsWith(':30')?' media':''}${i===iAhora?' ahora':''}${formacionEnSlot(dia,t)?' bloq':''}" onclick="${formacionEnSlot(dia,t)?`abrirFormacion('${jsq(formacionEnSlot(dia,t).id)}')`:`reservaRapida('${dia}','${t}')`}">
        <div class="dia-hora">${t}</div>
        <div class="dia-celda">${(porSlot[i]||[]).sort((a,b)=>String(a.time).localeCompare(String(b.time))).map(a=>eventoHtml(a,false)).join('')||(formacionEnSlot(dia,t)?'<span class="dia-bloq">Formación · '+esc(formacionEnSlot(dia,t).nombre||'')+'</span>':'<span class="dia-libre">+ Reservar</span>')}</div>
      </div>`).join('')}
    </div>`;
  }else{
    const ini=fechaMas(dia,-diaSemana(dia));
    const dias=[0,1,2,3,4,5,6].map(i=>fechaMas(ini,i));
    const nombres=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const f=x=>new Date(x+'T12:00:00Z').toLocaleDateString('es-VE',{day:'numeric',month:'short',timeZone:'UTC'});
    label=f(dias[0])+' – '+f(dias[6]);
    const mapa={};
    STATE.appointments.forEach(a=>{const di=dias.indexOf(a.fecha);if(di<0)return;const k=di+'_'+slotDe(a.time);(mapa[k]=mapa[k]||[]).push(a);});
    cuerpo=`<div class="card" style="padding:0;overflow:hidden">
      <div class="calendar-grid">
        <div class="cal-header" style="background:var(--bg2)"></div>
        ${dias.map((d,i)=>`<div class="cal-header${d===hoy?' today':''}" style="cursor:pointer" onclick="agendaIrDia('${d}')">${nombres[i]}<br><span style="font-size:14px;font-weight:600">${Number(d.slice(8))}</span></div>`).join('')}

function emailValido(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim());}
function limpio(v){v=String(v==null?'':v).trim();return v==='—'?'':v;}
function rrSugerir(){
  const q=normName($('rr-nombre').value);const box=$('rr-sug');
  $('rr-pat').value='';
  if(q.length<2){box.innerHTML='';box.classList.add('hidden');return;}
  const m=STATE.patients.filter(p=>normName(p.name).includes(q)).slice(0,5);

  box.innerHTML=m.map(p=>`<div class="rr-op" onclick="rrElegir('${jsq(p.id)}')"><strong>${esc(p.name)}</strong><span>${esc(limpio(p.phone)||'sin teléfono')}</span></div>`).join('')+`<div class="rr-op rr-nuevo" onclick="document.getElementById('rr-sug').classList.add('hidden')">Es una persona nueva</div>`;

function rrElegir(id){

function guardarReserva(force){
  let d;
  if(force===true&&STATE._citaPend&&STATE._citaPend.rr)d=STATE._citaPend;
  else{
    const cid=$('rr-cons').value;
    d={rr:true,patId:$('rr-pat').value,nombre:$('rr-nombre').value.replace(/\s+/g,' ').trim(),tel:$('rr-tel').value.trim(),mail:$('rr-mail').value.trim(),fecha:$('rr-fecha').value,time:$('rr-hora').value,proc:$('rr-proc').value,dur:Number($('rr-dur').value)||30,consId:cid,cons:consLabelDe('rr-cons'),doc:getMedicoLabel(),presupuestoId:$('rr-pres').value||''};
  }
  const marca=(id,msg)=>{showToast(msg);const el=$(id);if(el){el.classList.add('campo-error');el.focus();setTimeout(()=>el.classList.remove('campo-error'),2500);}};
  if(force!==true){
    if(d.nombre.split(' ').filter(Boolean).length<2){marca('rr-nombre','Escribe nombre y apellido');return;}
    if(d.tel.replace(/\D/g,'').length<7){marca('rr-tel','Falta un teléfono de contacto válido');return;}
    if(!emailValido(d.mail)){marca('rr-mail','Falta un correo válido');return;}
    if(!d.fecha||!d.time){showToast('Elige día y hora');return;}
    const fb=formacionEnSlot(d.fecha,d.time);
    if(fb){showToast(`Ese horario está bloqueado por la formación "${fb.nombre}"`);return;}
    const c=citaSolapa(d.fecha,d.time,d.dur,d.cons,null);
    if(c){STATE._citaPend=d;avisoSolape(c,d,`reservaRapida(STATE._citaPend.fecha,STATE._citaPend.time,Object.assign({abrirDetalles:true},STATE._citaPend))`,'guardarReserva(true)');return;}
  }
  STATE._citaPend=null;
  // Paciente: el elegido de la lista, uno existente con el mismo nombre (si es único) o uno nuevo como Lead
  let p=d.patId?STATE.patients.find(x=>x.id===d.patId):null;
  if(p&&normName(p.name)!==normName(d.nombre))p=null;
  if(!p){const mismos=STATE.patients.filter(x=>normName(x.name)===normName(d.nombre));if(mismos.length===1)p=mismos[0];}
  let nuevo=false;
  if(!p){
    p={id:'P'+Date.now(),name:d.nombre,cedula:'—',phone:d.tel,email:d.mail,dob:'—',tags:['Nueva'],lastVisit:'',procedures:0,etapa:'lead',creadoEl:new Date().toISOString(),origen:'agenda'};
    STATE.patients.unshift(p);nuevo=true;
  }else{
    if(limpio(p.phone)!==d.tel)p.phone=d.tel;
    if(limpio(p.email)!==d.mail)p.email=d.mail;
  }
  syncToSheet('Pacientes',STATE.patients);
  const cita={id:'A'+(Date.now()+1),fecha:d.fecha,time:d.time,dur:d.dur,patient:p.name,patientId:p.id,proc:d.proc,doc:d.doc,status:'pendiente',consultorio:d.cons,timezone:'VET',precio:precioCatalogo(d.proc),creadaEl:new Date().toISOString()};
  if(d.presupuestoId)cita.presupuestoId=d.presupuestoId;
  STATE.appointments.push(cita);
  STATE.appointments.sort((a,b)=>a.fecha===b.fecha?String(a.time).localeCompare(String(b.time)):String(a.fecha).localeCompare(String(b.fecha)));
  syncToSheet('Citas',STATE.appointments);
  actualizarBadgeAgenda();closeModal();
  showToast(`Cita reservada: ${p.name} · ${fmtDateVET(d.fecha)} ${d.time}${nuevo?' · ficha creada':''}`);
  if(STATE.view==='agenda'){STATE.agendaDia=d.fecha;renderAgenda();}else if(STATE.view==='dashboard')renderDashboard();else programarRefresco();
}

// ═══════════════════════════════════════════════════════════════════════════
// v6 · LO QUE UN SISTEMA DE CLÍNICA ESTÉTICA NECESITA
//  • Indicadores de negocio (inasistencia, ocupación, ticket medio, repetición…)
//  • Bonos de sesiones por paciente, con descuento al atender
//  • Cierre de caja diario con arqueo de efectivo
//  • Avisos de seguridad en la cita: alergias, consentimiento pendiente, inasistencias
// ═══════════════════════════════════════════════════════════════════════════
function pct(n,d){return d>0?Math.round(n*100/d):null;}
function fmtPct(v){return v===null?'—':v+'%';}
function procDeMovimiento(m){
  if(m.citaId){const a=STATE.appointments.find(x=>x.id===m.citaId)||(STATE.archivados.Citas||[]).find(x=>x.id===m.citaId);if(a&&a.proc)return a.proc;}
  if(m.presupuestoId)return'Presupuestos (cirugía y planes)';
  if(m.formacionId)return'Formaciones';
  const d=String(m.desc||'');const i=d.lastIndexOf(' — ');
  return(i>0?d.slice(0,i):d)||'Sin detalle';
}
function indicadores(dias){
  const hoy=todayVET(),desde=fechaMas(hoy,-dias);
  const enPer=f=>f&&f>desde&&f<=hoy;
  const citas=STATE.appointments.filter(a=>enPer(a.fecha));
  const atendidas=citas.filter(a=>a.status==='completado').length;
  const faltas=citas.filter(a=>a.status==='no_asistio').length;
  const canceladas=citas.filter(a=>a.status==='cancelado').length;
  const minutos=citas.filter(a=>a.status!=='cancelado'&&a.status!=='no_asistio').reduce((s,a)=>s+(Number(a.dur)||30),0);
  let laborables=0;for(let i=0;i<dias;i++){const w=diaSemana(fechaMas(hoy,-i));if(w>=1&&w<=5)laborables++;}
  const ingresos=STATE.movimientos.filter(m=>m.tipo==='ingreso'&&enPer(m.fecha));
  const totalIng=ingresos.reduce((s,m)=>s+montoEnUSD(m),0);
  const porProc={};ingresos.forEach(m=>{const k=procDeMovimiento(m);porProc[k]=(porProc[k]||0)+montoEnUSD(m);});
  const pres=STATE.presupuestos.filter(p=>enPer(p.fecha));
  const presOk=pres.filter(p=>['aceptado','parcial','cobrado'].includes(estadoPresupuesto(p))).length;
  const conCitas={};STATE.appointments.filter(a=>a.status==='completado').forEach(a=>{const k=a.patientId||normName(a.patient);conCitas[k]=(conCitas[k]||0)+1;});
  const atendidos=Object.keys(conCitas).length,repiten=Object.values(conCitas).filter(n=>n>=2).length;
  const limite=fechaMas(hoy,2);
  const sinConfirmar=STATE.appointments.filter(a=>a.fecha>=hoy&&a.fecha<=limite&&a.status==='pendiente').length;
  const porCobrar=citasPorCobrar().reduce((s,a)=>s+Math.max(0,precioCita(a)-cobradoCita(a.id)),0)+presupuestosPorCobrar().reduce((s,p)=>s+Math.max(0,totalPresupuesto(p)-getPresupuestoPagado(p.id)),0);
  return{dias,citas:citas.length,atendidas,faltas,canceladas,inasistencia:pct(faltas,atendidas+faltas),ocupacion:pct(minutos,laborables*8*60),horas:Math.round(minutos/6)/10,totalIng,cobros:ingresos.length,ticket:ingresos.length?totalIng/ingresos.length:0,top:Object.entries(porProc).sort((a,b)=>b[1]-a[1]).slice(0,6),pres:pres.length,aceptacion:pct(presOk,pres.length),repeticion:pct(repiten,atendidos),atendidos,sinConfirmar,porCobrar};
}
function buildRepNegocio(){
  const d=STATE.repDias||30;const k=indicadores(d);
  const tono=(v,ok,mal)=>v===null?'':v<=ok?'color:var(--green)':v>=mal?'color:var(--red)':'color:var(--gold)';
  const max=k.top.length?k.top[0][1]:1;

function bonosDe(p){return Array.isArray(p&&p.bonos)?p.bonos:[];}
function bonoRestantes(b){return Math.max(0,(Number(b.total)||0)-((b.usadas||[]).length));}
function bonoVigente(b){return bonoRestantes(b)>0&&(!b.vence||b.vence>=todayVET());}
function bonoParaCita(a){

}

function bonoSugerir(){
  const n=Math.max(1,parseInt($('bn-total').value)||1);const u=precioCatalogo($('bn-proc').value);

function guardarBono(patId){
  const p=STATE.patients.find(x=>x.id===patId);if(!p)return;
  const total=parseInt($('bn-total').value)||0,precio=parseFloat($('bn-precio').value),proc=$('bn-proc').value,meses=parseInt($('bn-meses').value)||0;
  if(total<1){showToast('Indica cuántas sesiones incluye');return;}
  if(isNaN(precio)||precio<0){showToast('Indica el precio total del bono');return;}
  const hoy=todayVET();let vence='';
  if(meses){const d=new Date(hoy+'T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+meses);vence=d.toISOString().slice(0,10);}
  const bono={id:'B'+Date.now(),proc,total,precio,fecha:hoy,vence,usadas:[]};

  p.bonos.push(bono);
  syncToSheet('Pacientes',STATE.patients);

  const p=pacienteDeCita(a);const b=bonoParaCita(a);if(!p||!b){showToast('No hay un bono vigente para este tratamiento');return;}

function resumenCajaDia(fecha){
  const movs=STATE.movimientos.filter(m=>m.fecha===fecha);const porMetodo={};
  movs.forEach(m=>{const k=(m.metodo||'Sin método')+'|'+(m.moneda==='BS'?'BS':'USD');const s=m.tipo==='ingreso'?1:-1;porMetodo[k]=(porMetodo[k]||0)+s*Number(m.monto||0);});
  const efe=mon=>Object.entries(porMetodo).filter(([k])=>/efectivo/i.test(k)&&k.endsWith('|'+mon)).reduce((s,[,v])=>s+v,0);
  return{movs,porMetodo,efectivoUSD:efe('USD'),efectivoBS:efe('BS'),totalUSD:movs.reduce((s,m)=>s+(m.tipo==='ingreso'?1:-1)*montoEnUSD(m),0)};
}

// ═══════════════════════════════════════════════════════════════════════════
// v7 · EXPEDIENTE QUIRÚRGICO
//  Cada presupuesto quirúrgico es un caso con etapas: valoración → reserva →
//  preoperatorio → programada → postoperatorio → alta. El caso vive dentro del
//  propio presupuesto (campo "caso"), así pagos, citas y paciente ya están unidos.
// ═══════════════════════════════════════════════════════════════════════════
// Reglas de EPC: se reserva con el 30% del presupuesto aceptado y se paga el total antes de la cirugía.
const CASO_RESERVA_PCT=0.30;
const CASO_ETAPAS=[['valoracion','Valoración'],['reserva','Reserva'],['preop','Preoperatorio'],['programada','Programada'],['postop','Postoperatorio'],['alta','Alta']];
// Plantillas editables: el equipo médico las ajusta por caso.
const PREOP_BASE=['Hematología completa','Química sanguínea (glicemia, urea, creatinina)','Tiempos de coagulación (PT y PTT)','Grupo sanguíneo y factor Rh','Serología (VIH y VDRL)','Examen de orina','Radiografía de tórax','Evaluación cardiovascular preoperatoria','Evaluación preanestésica','Consentimiento quirúrgico firmado','Fotos preoperatorias','Indicaciones preoperatorias entregadas'];
const POSTOP_BASE=[[1,'Control a las 24 horas'],[7,'Control a los 7 días · retiro de puntos'],[15,'Control a los 15 días'],[30,'Control al mes'],[90,'Control a los 3 meses'],[180,'Control a los 6 meses · fotos de resultado']];
const TERCEROS_BASE=['Quirófano y hospitalización','Anestesiólogo','Ayudante quirúrgico','Instrumentista','Prótesis o implantes','Faja y medicación','Laboratorio y estudios','Otro'];

function casosQuirurgicos(){return STATE.presupuestos.filter(p=>p.tipo==='quirurgico');}
function casoVista(pr){
  const c=pr.caso||{};
  return{etapa:etapaCaso(pr),preop:Array.isArray(c.preop)?c.preop:PREOP_BASE.map(t=>({t,ok:false})),postop:Array.isArray(c.postop)?c.postop:[],terceros:Array.isArray(c.terceros)?c.terceros:[],cirugia:c.cirugia||{}};
}
function casoEdit(pr){
  if(!pr.caso||typeof pr.caso!=='object')pr.caso={creadoEl:new Date().toISOString()};
  const c=pr.caso;
  if(!Array.isArray(c.preop))c.preop=PREOP_BASE.map(t=>({t,ok:false}));
  if(!Array.isArray(c.postop))c.postop=[];
  if(!Array.isArray(c.terceros))c.terceros=[];
  if(!c.cirugia||typeof c.cirugia!=='object')c.cirugia={};
  return c;
}
function etapaCaso(pr){
  const c=pr.caso||{};
  if(c.etapa&&CASO_ETAPAS.some(e=>e[0]===c.etapa))return c.etapa;
  return['aceptado','parcial','cobrado'].includes(estadoPresupuesto(pr))?'reserva':'valoracion';
}
function pagadoTerceros(prId,terId){
  return STATE.movimientos.filter(m=>m.presupuestoId===prId&&m.tipo==='egreso'&&(!terId||m.terceroId===terId)).reduce((a,m)=>a+montoEnUSD(m),0);
}
function guardarCaso(id){syncToSheet('Presupuestos',STATE.presupuestos);if(STATE.view==='cirugias')renderCirugias();}
function abrirCaso(id){STATE.casoActivo=id;showView('cirugias');}
function cerrarCaso(){STATE.casoActivo=null;renderCirugias();}

function renderCirugias(){
  const pr=STATE.casoActivo?STATE.presupuestos.find(p=>p.id===STATE.casoActivo):null;
  if(pr){renderCaso(pr);return;}
  STATE.casoActivo=null;
  const casos=casosQuirurgicos();
  const f=STATE.casoFiltro||'activos';
  const porEtapa=e=>casos.filter(p=>etapaCaso(p)===e);
  const visibles=f==='activos'?CASO_ETAPAS.filter(e=>e[0]!=='alta'):CASO_ETAPAS.filter(e=>e[0]===f);
  const hoy=todayVET();
  const proximas=casos.filter(p=>{const c=casoVista(p);return c.cirugia.fecha&&c.cirugia.fecha>=hoy&&['preop','programada'].includes(c.etapa);}).sort((a,b)=>String(casoVista(a).cirugia.fecha).localeCompare(String(casoVista(b).cirugia.fecha)));
  const porCobrar=casos.filter(p=>!['valoracion','alta'].includes(etapaCaso(p))).reduce((s,p)=>s+Math.max(0,totalPresupuesto(p)-getPresupuestoPagado(p.id)),0);
  const tarjeta=p=>{const c=casoVista(p);const total=totalPresupuesto(p),pag=getPresupuestoPagado(p.id);const okPre=c.preop.filter(x=>x.ok).length;const pend=c.postop.filter(x=>!x.ok).length;

function casoAvanzar(id){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;
  const c=casoEdit(pr);const etapa=etapaCaso(pr);const ahora=new Date().toISOString();
  if(etapa==='valoracion'){pr.estado='aceptado';pr.aceptadoEl=ahora;c.etapa='reserva';}
  else if(etapa==='reserva'){
    const total=totalPresupuesto(pr),pag=getPresupuestoPagado(id),minR=total*CASO_RESERVA_PCT;
    if(pag<minR-0.01){showToast(`Falta el anticipo del 30%: ${fmtMonto(minR-pag)} por cobrar`);return;}
    c.etapa='preop';
  }
  else if(etapa==='preop'){
    const faltan=c.preop.filter(x=>!x.ok);
    if(faltan.length){showToast(`Faltan ${faltan.length} requisito(s): ${faltan[0].t}${faltan.length>1?' y otros':''}`);return;}
    if(!c.cirugia.fecha){showToast('Indica la fecha de cirugía y guarda los datos');return;}
    c.etapa='programada';
  }
  else if(etapa==='programada'){
    if(!c.cirugia.fecha){showToast('Falta la fecha de cirugía');return;}
    if(c.cirugia.fecha>todayVET()){showToast('La fecha de cirugía aún no ha llegado');return;}
    const saldoC=totalPresupuesto(pr)-getPresupuestoPagado(id);
    if(saldoC>0.01){showToast(`El paciente debe ${fmtMonto(saldoC)}: el pago va completo antes de la cirugía`);return;}
    c.etapa='postop';c.cirugia.realizadaEl=ahora;
    const kit=[];consumirReceta(((pr.items||[])[0]||{}).desc||'',kit,'Cirugía · '+(pr.paciente||''));if(kit.length)c.cirugia.insumos=kit;
    if(!c.postop.length)c.postop=POSTOP_BASE.map(([d,t])=>({t,fecha:fechaMas(c.cirugia.fecha,d),ok:false}));
    const cita=STATE.appointments.find(a=>a.presupuestoId===id&&a.esCirugia);
    if(cita&&cita.status!=='completado'){cita.status='completado';cita.atendidaEl=ahora;syncToSheet('Citas',STATE.appointments);}
  }
  else if(etapa==='postop'){
    const pend=c.postop.filter(x=>!x.ok).length;
    if(pend){showToast(`Quedan ${pend} control(es) por marcar antes del alta`);return;}
    c.etapa='alta';c.altaEl=ahora;
  }else return;
  c[c.etapa+'El']=ahora;
  showToast('Caso: '+CASO_ETAPAS.find(e=>e[0]===c.etapa)[1]);
  guardarCaso(id);
}
function casoRetroceder(id){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;
  const c=casoEdit(pr);const i=CASO_ETAPAS.findIndex(e=>e[0]===etapaCaso(pr));if(i<=0)return;
  c.etapa=CASO_ETAPAS[i-1][0];
  if(c.etapa==='valoracion'&&pr.estado==='aceptado')pr.estado='enviado';
  showToast('Caso: '+CASO_ETAPAS[i-1][1]);guardarCaso(id);
}
function togglePreop(id,i){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;const c=casoEdit(pr);if(!c.preop[i])return;
  c.preop[i].ok=!c.preop[i].ok;c.preop[i].fecha=c.preop[i].ok?todayVET():'';guardarCaso(id);
}
function agregarPreop(id){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;const t=$('pre-nuevo').value.trim();if(!t){showToast('Escribe el requisito');return;}
  casoEdit(pr).preop.push({t,ok:false});guardarCaso(id);
}
function togglePostop(id,i){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;const c=casoEdit(pr);if(!c.postop[i])return;
  c.postop[i].ok=!c.postop[i].ok;c.postop[i].hechoEl=c.postop[i].ok?todayVET():'';guardarCaso(id);
}
function agendarControl(id,i){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;const x=casoVista(pr).postop[i];if(!x)return;
  openNewCita(pr.pacienteId||'',{fecha:x.fecha&&x.fecha>=todayVET()?x.fecha:todayVET(),proc:'Control Post-operatorio',presupuestoId:id});
}
function guardarCirugia(id){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;const c=casoEdit(pr);
  ['fecha','hora','lugar','anestesia','equipo','implantes','nota'].forEach(k=>{const el=$('cx-'+k);if(el)c.cirugia[k]=el.value.trim();});
  if(c.cirugia.fecha&&c.cirugia.hora){
    const p=STATE.patients.find(x=>x.id===pr.pacienteId);
    let cita=STATE.appointments.find(a=>a.presupuestoId===id&&a.esCirugia);
    if(cita){cita.fecha=c.cirugia.fecha;cita.time=c.cirugia.hora;cita.consultorio=c.cirugia.lugar||'Quirófano';}
    else STATE.appointments.push({id:'A'+Date.now(),fecha:c.cirugia.fecha,time:c.cirugia.hora,dur:180,patient:pr.paciente||'',patientId:p?p.id:(pr.pacienteId||''),proc:((pr.items||[])[0]||{}).desc||'Cirugía',doc:pr.doc||'Dr. Higuerey',status:'confirmado',consultorio:c.cirugia.lugar||'Quirófano',timezone:'VET',presupuestoId:id,esCirugia:true,precio:0,creadaEl:new Date().toISOString()});
    STATE.appointments.sort((a,b)=>a.fecha===b.fecha?String(a.time).localeCompare(String(b.time)):String(a.fecha).localeCompare(String(b.fecha)));
    syncToSheet('Citas',STATE.appointments);actualizarBadgeAgenda();
  }
  showToast(c.cirugia.fecha&&c.cirugia.hora?'Cirugía guardada y bloqueada en la agenda':'Datos de cirugía guardados');
  guardarCaso(id);
}
function agregarTercero(id){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;
  const monto=parseFloat($('ter-mon').value);if(isNaN(monto)||monto<=0){showToast('Indica el monto previsto');return;}
  casoEdit(pr).terceros.push({id:'T'+Date.now(),concepto:$('ter-con').value,beneficiario:$('ter-ben').value.trim(),monto});
  guardarCaso(id);
}
function quitarTercero(id,terId){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;const c=casoEdit(pr);
  if(pagadoTerceros(id,terId)>0){showToast('Ya tiene pagos registrados: no se puede quitar');return;}
  const t=c.terceros.find(x=>x.id===terId);
  if(t){if(!Array.isArray(c.tercerosArchivados))c.tercerosArchivados=[];c.tercerosArchivados.push({...t,archivadoEl:new Date().toISOString()});}
  c.terceros=c.terceros.filter(x=>x.id!==terId);guardarCaso(id);
}
function pagarTercero(id,terId){
  const pr=STATE.presupuestos.find(p=>p.id===id);if(!pr)return;const t=casoVista(pr).terceros.find(x=>x.id===terId);if(!t)return;
  const resto=Math.max(0,(Number(t.monto)||0)-pagadoTerceros(id,terId));
  openNewMovimiento({tipo:'egreso',desc:`${t.concepto}${t.beneficiario?' · '+t.beneficiario:''} — caso ${pr.paciente}`,presupuestoId:id,terceroId:terId,monto:resto>0?resto.toFixed(2):''});
}

// ── INVENTARIO: lotes con costo y vencimiento, consumo por receta ─────────────
function diasPara(f){return Math.round((Date.parse(f+'T12:00:00Z')-Date.parse(todayVET()+'T12:00:00Z'))/864e5);}
function productosInventario(){const s=new Map();STATE.inventario.forEach(i=>{const k=normName(i.producto);if(k&&!s.has(k))s.set(k,i.producto);});return[...s.values()].sort((a,b)=>a.localeCompare(b));}
function lotesDe(producto){
  return STATE.inventario.filter(i=>normName(i.producto)===normName(producto)&&Number(i.stock)>0&&!(i.vence&&i.vence<todayVET()))
    .sort((a,b)=>String(a.vence||'9999').localeCompare(String(b.vence||'9999')));
}
function stockDisponible(producto){return lotesDe(producto).reduce((s,i)=>s+Number(i.stock),0);}
function unidadDe(producto){const i=STATE.inventario.find(x=>normName(x.producto)===normName(producto));return i?(i.unidad||'u.'):'u.';}
function costoUnitario(producto){
  const l=STATE.inventario.filter(i=>normName(i.producto)===normName(producto)&&Number(i.costo)>0);
  if(!l.length)return 0;
  const conStock=l.filter(i=>Number(i.stock)>0);const base=conStock.length?conStock:l;
  return base.reduce((s,i)=>s+Number(i.costo),0)/base.length;
}
function movStock(item,tipo,cant,ref){
  if(!Array.isArray(item.movs))item.movs=[];
  item.movs.push({f:todayVET(),t:tipo,c:cant,r:String(ref||'').slice(0,80)});
  if(item.movs.length>150)item.movs=item.movs.slice(-150);
}
function consumirProducto(producto,cant,ref){
  let resto=Number(cant)||0;const usados=[];
  for(const lot of lotesDe(producto)){
    if(resto<=0)break;
    const toma=Math.min(Number(lot.stock),resto);
    lot.stock=Math.round((Number(lot.stock)-toma)*1000)/1000;
    movStock(lot,'consumo',toma,ref);
    usados.push({lote:lot.lote,marca:lot.marca||'',cant:toma,unidad:lot.unidad||'u.'});
    resto=Math.round((resto-toma)*1000)/1000;
  }
  return{usados,faltante:resto>0?resto:0};
}
function recetaDe(proc){return Array.isArray((STATE.recetas||{})[proc])?STATE.recetas[proc]:[];}
// Descuenta los insumos del servicio. Si el formulario de consulta está abierto usa las cantidades ajustadas allí.
function consumirReceta(proc,prods,ref){
  let lineas=recetaDe(proc).map(l=>({producto:l.producto,cant:Number(l.cant)||0}));
  const box=$('rc-box');
  if(box&&box.dataset.proc===proc)lineas=[...box.querySelectorAll('.rc-cant')].map(i=>({producto:i.dataset.prod,cant:parseFloat(i.value)||0}));
  const faltan=[];let hubo=false;
  lineas.forEach(l=>{
    if(!(l.cant>0))return;
    const r=consumirProducto(l.producto,l.cant,ref);
    r.usados.forEach(u=>{hubo=true;prods.push({marca:u.marca,prod:l.producto,dosis:u.cant+' '+u.unidad,zona:'',lote:u.lote});});
    if(r.faltante>0)faltan.push(l.producto);
  });
  if(hubo)syncToSheet('Inventario',STATE.inventario);
  if(faltan.length)setTimeout(()=>showToast('Sin stock suficiente de: '+faltan.join(', ')),1800);
  return faltan;
}
function recetaBox(){
  const box=$('rc-box'),s=$('fc-proc');if(!box||!s)return;
  const proc=s.value;box.dataset.proc=proc;const l=recetaDe(proc);
  box.innerHTML=l.length?`<div style="background:#F4F7FA;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px">
    <div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px">Insumos que se descontarán del inventario</div>
    ${l.map(x=>{const st=stockDisponible(x.producto);return`<div style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12.5px"><span style="flex:1;min-width:0">${esc(x.producto)}</span><input class="form-input rc-cant" data-prod="${esc(x.producto)}" type="number" min="0" step="0.01" value="${Number(x.cant)||0}" style="width:74px;padding:5px 8px"><span style="width:92px;color:${st<Number(x.cant)?'var(--red)':'var(--text3)'};font-size:11.5px">${esc(unidadDe(x.producto))} · hay ${st}</span></div>`;}).join('')}
    <div style="font-size:11px;color:var(--text3);margin-top:8px">Ajusta la cantidad si usaste más o menos. Sale primero el lote que vence antes.</div>
  </div>`:`<div style="font-size:11.5px;color:var(--text3);margin-bottom:12px">Este servicio aún no tiene insumos configurados (Productos y lotes › Insumos por servicio).</div>`;
}

function alertasInventario(){
  const hoy=todayVET();const porProd={};
  STATE.inventario.forEach(i=>{const k=normName(i.producto);if(!porProd[k])porProd[k]={nombre:i.producto,stock:0,min:0};if(!(i.vence&&i.vence<hoy))porProd[k].stock+=Number(i.stock)||0;porProd[k].min=Math.max(porProd[k].min,Number(i.minimo)||0);});
  return{bajo:Object.values(porProd).filter(p=>p.min>0&&p.stock<=p.min),vencidos:STATE.inventario.filter(i=>i.vence&&i.vence<hoy&&Number(i.stock)>0),porVencer:STATE.inventario.filter(i=>i.vence&&i.vence>=hoy&&diasPara(i.vence)<=60&&Number(i.stock)>0)};
}

  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveInventario()">Guardar entrada</button></div>`);
}
function saveInventario(){
  const producto=$('fi-prod').value.trim(),lote=$('fi-lote').value.trim();const stock=parseFloat($('fi-stock').value);
  if(!producto||!lote||isNaN(stock)||stock<0){showToast('Producto, lote y cantidad son obligatorios');return;}
  const existe=STATE.inventario.find(i=>normName(i.producto)===normName(producto)&&normName(i.lote)===normName(lote));
  const costo=parseFloat($('fi-costo').value)||0;
  if(existe){
    existe.stock=Math.round((Number(existe.stock)+stock)*1000)/1000;if(costo>0)existe.costo=costo;if($('fi-vence').value)existe.vence=$('fi-vence').value;
    movStock(existe,'entrada',stock,'Entrada de stock');
  }else{
    const it={id:'INV'+Date.now(),producto,marca:$('fi-marca').value.trim(),lote,stock,unidad:$('fi-unidad').value.trim()||'u.',minimo:parseFloat($('fi-minimo').value)||0,costo,vence:$('fi-vence').value||'',creadoEl:new Date().toISOString()};
    movStock(it,'entrada',stock,'Entrada de stock');STATE.inventario.unshift(it);
  }
  syncToSheet('Inventario',STATE.inventario);
  closeModal();showToast(existe?'Stock sumado al lote existente':'Entrada de stock guardada');
  if(STATE.view==='productos')renderProductos();
}
function openAjusteStock(id){
  const i=STATE.inventario.find(x=>x.id===id);if(!i)return;
  openModal(`<div class="modal-title">Ajustar stock</div>
  <div style="font-size:13px;color:var(--text2);margin:-8px 0 14px">${esc(i.producto)} · lote ${esc(i.lote)} · hay <strong>${Number(i.stock)} ${esc(i.unidad||'u.')}</strong></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Cantidad real que hay ahora</label><input class="form-input" id="aj-real" type="number" min="0" step="0.01" value="${Number(i.stock)}"></div><div class="form-group"><label class="form-label">Motivo</label><select class="form-input" id="aj-motivo"><option>Conteo físico</option><option>Merma o rotura</option><option>Vencimiento</option><option>Uso sin registrar</option><option>Corrección de entrada</option></select></div></div>
  ${(i.movs||[]).length?`<div style="font-size:12px;color:var(--text3);margin:4px 0 6px">Últimos movimientos</div>${i.movs.slice(-6).reverse().map(m=>`<div style="font-size:12px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border)">${m.f?fmtDateVET(m.f):''} · ${m.t==='entrada'?'Entrada +':m.t==='consumo'?'Consumo −':'Ajuste '}${m.c} · ${esc(m.r||'')}</div>`).join('')}`:''}
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="guardarAjusteStock('${jsq(id)}')">Guardar ajuste</button></div>`);
}
function guardarAjusteStock(id){
  const i=STATE.inventario.find(x=>x.id===id);if(!i)return;
  const real=parseFloat($('aj-real').value);if(isNaN(real)||real<0){showToast('Indica la cantidad real');return;}
  const dif=Math.round((real-Number(i.stock))*1000)/1000;
  if(dif!==0){movStock(i,'ajuste',dif>0?'+'+dif:String(dif),$('aj-motivo').value);i.stock=real;syncToSheet('Inventario',STATE.inventario);}
  closeModal();showToast(dif===0?'Sin cambios':'Stock ajustado');if(STATE.view==='productos')renderProductos();
}
function ajustarStock(id,delta){openAjusteStock(id);}

function guardarRecetas(){syncToSheet('Config',[{id:'recetas',map:STATE.recetas}],{partial:true});}
function costoReceta(proc){return recetaDe(proc).reduce((s,l)=>s+(Number(l.cant)||0)*costoUnitario(l.producto),0);}

  const proc=STATE.recetaServicio;const l=recetaDe(proc);const costo=costoReceta(proc),precio=precioCatalogo(proc);
  const prods=productosInventario();
  const conReceta=todos.filter(s=>recetaDe(s).length);
  $('productos-tab-content').innerHTML=`
  <div class="card" style="margin-top:16px">
    <div class="card-title">Insumos que consume cada servicio</div>
    <div style="font-size:12.5px;color:var(--text2);margin:-6px 0 14px">Al guardar una consulta de este servicio (o registrar la cirugía) se descuentan del inventario, empezando por el lote que vence antes.</div>

    ${l.length?l.map((x,i)=>`<div class="agenda-item" style="flex-wrap:wrap"><div style="flex:1;min-width:140px"><div class="agenda-name">${esc(x.producto)}</div><div class="agenda-proc">Hay ${stockDisponible(x.producto)} ${esc(unidadDe(x.producto))}${costoUnitario(x.producto)?' · '+fmtMonto(costoUnitario(x.producto))+' por unidad':''}</div></div><input class="form-input" type="number" min="0" step="0.01" value="${Number(x.cant)||0}" style="width:84px" onchange="recetaCant(${i},this.value)"><button class="icon-btn btn-sm" aria-label="Quitar" onclick="recetaQuitar(${i})">✕</button></div>`).join(''):'<div style="color:var(--text3);font-size:13px;padding:4px 0 10px">Este servicio no tiene insumos configurados.</div>'}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px">
      <div style="flex:1 1 200px"><label class="form-label">Insumo</label><input class="form-input" id="rc-prod" list="rc-lista" placeholder="Elige del inventario o escribe"><datalist id="rc-lista">${prods.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
      <div style="flex:0 1 110px"><label class="form-label">Cantidad</label><input class="form-input" id="rc-cantn" type="number" min="0" step="0.01" value="1"></div>

    </div>
    <div class="kpi-grid" style="margin:16px 0 0;box-shadow:none">
      <div class="kpi-card"><div class="kpi-label">Costo de insumos</div><div class="kpi-value" style="font-size:20px">${fmtMonto(Math.round(costo*100)/100)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Precio de lista</div><div class="kpi-value" style="font-size:20px">${precio?fmtMonto(precio):'—'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Margen sobre insumos</div><div class="kpi-value" style="font-size:20px">${precio?fmtMonto(Math.round((precio-costo)*100)/100)+` <span style="font-size:12px;color:var(--text3);font-weight:500">${Math.round((precio-costo)*100/precio)}%</span>`:'—'}</div></div>
    </div>
  </div>
  ${conReceta.length?`<div class="card" style="margin-top:16px"><div class="card-title">Servicios configurados (${conReceta.length})</div>${conReceta.map(s=>{const c=costoReceta(s),p=precioCatalogo(s);return`<div class="agenda-item" style="cursor:pointer" onclick="STATE.recetaServicio='${jsq(s)}';renderRecetas()"><div style="flex:1;min-width:0"><div class="agenda-name">${esc(s)}</div><div class="agenda-proc">${recetaDe(s).map(x=>esc(x.cant+' × '+x.producto)).join(' · ')}</div></div><div style="text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums"><div>Insumos ${fmtMonto(Math.round(c*100)/100)}</div>${p?`<div style="color:var(--text3)">Margen ${Math.round((p-c)*100/p)}%</div>`:''}</div></div>`;}).join('')}</div>`:''}`;
  $('rc-serv').onchange=function(){STATE.recetaServicio=this.value;renderRecetas();};
}
function recetaAgregar(){
  const prod=$('rc-prod').value.trim(),cant=parseFloat($('rc-cantn').value);
  if(!prod||!(cant>0)){showToast('Indica el insumo y la cantidad');return;}
  const proc=STATE.recetaServicio;STATE.recetas=Object.assign({},STATE.recetas||{});
  const l=recetaDe(proc).slice();const ex=l.find(x=>normName(x.producto)===normName(prod));
  if(ex)ex.cant=cant;else l.push({producto:prod,cant});
  STATE.recetas[proc]=l;guardarRecetas();renderRecetas();
}
function recetaCant(i,v){const proc=STATE.recetaServicio;const l=recetaDe(proc).slice();if(!l[i])return;l[i]=Object.assign({},l[i],{cant:Math.max(0,parseFloat(v)||0)});STATE.recetas=Object.assign({},STATE.recetas,{[proc]:l});guardarRecetas();renderRecetas();}
function recetaQuitar(i){const proc=STATE.recetaServicio;const l=recetaDe(proc).slice();l.splice(i,1);STATE.recetas=Object.assign({},STATE.recetas,{[proc]:l});guardarRecetas();renderRecetas();}

function contraparte(m){
  if(m.nombre)return m.nombre;
  if(m.patientId){const p=STATE.patients.find(x=>x.id===m.patientId)||(STATE.archivados.Pacientes||[]).find(x=>x.id===m.patientId);if(p)return p.name;}
  const i=String(m.desc||'').lastIndexOf(' — ');return i>0?String(m.desc).slice(i+3):'';
}
function montoBs(m){return m.moneda==='BS'?Number(m.monto)||0:(Number(m.tasaBCV)>0?(Number(m.monto)||0)*Number(m.tasaBCV):0);}
function datosLibro(tipo,mes){
  const movs=STATE.movimientos.filter(m=>String(m.fecha||'').slice(0,7)===mes).slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))||String(a.id).localeCompare(String(b.id)));
  const n2=x=>(Math.round(x*100)/100).toFixed(2);
  if(tipo==='diario'){
    let saldo=0;const filas=movs.map(m=>{const usd=montoEnUSD(m);saldo+=m.tipo==='ingreso'?usd:-usd;return[m.fecha,m.desc||'',m.metodo||'',m.tipo==='ingreso'?n2(usd):'',m.tipo==='egreso'?n2(usd):'',n2(saldo)];});
    return{cab:['Fecha','Concepto','Método','Ingreso USD','Egreso USD','Saldo USD'],filas};
  }
  const sel=movs.filter(m=>m.tipo===(tipo==='ventas'?'ingreso':'egreso'));
  const cab=['Fecha','N.º factura','N.º control',tipo==='ventas'?'Cliente':'Proveedor','RIF o cédula','Concepto'].concat(tipo==='compras'?['Categoría']:[]).concat(['Método','Moneda','Monto','Tasa BCV','Monto Bs','Monto USD']);
  const filas=sel.map(m=>[m.fecha,m.factura||'',m.control||'',contraparte(m),m.rif||'',m.desc||''].concat(tipo==='compras'?[m.categoria||'']:[]).concat([m.metodo||'',m.moneda==='BS'?'Bs':'USD',n2(Number(m.monto)||0),m.tasaBCV?n2(Number(m.tasaBCV)):'',montoBs(m)?n2(montoBs(m)):'',n2(montoEnUSD(m))]));
  return{cab,filas};
}
function renderLibros(){
  const mes=STATE.libroMes||todayVET().slice(0,7),tipo=STATE.libroTipo||'ventas';
  const d=datosLibro(tipo,mes);const iUSD=d.cab.indexOf('Monto USD'),iBs=d.cab.indexOf('Monto Bs');
  const tot=i=>i<0?0:d.filas.reduce((s,f)=>s+(parseFloat(f[i])||0),0);
  const sinFactura=tipo==='diario'?0:d.filas.filter(f=>!f[1]).length;

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="form-input" type="month" id="lb-mes" value="${mes}" style="width:auto;padding:7px 10px" onchange="STATE.libroMes=this.value;renderLibros()"><button class="btn-outline btn-sm" onclick="copiarLibro()">Copiar para Excel</button><button class="btn btn-gold btn-sm" onclick="descargarLibro()">Descargar CSV</button></div>
  </div>
  <div class="tab-bar" style="max-width:420px">${[['ventas','Ventas'],['compras','Compras'],['diario','Diario']].map(([k,l])=>`<div class="tab${tipo===k?' active':''}" onclick="STATE.libroTipo='${k}';renderLibros()">${l}</div>`).join('')}</div>
  ${sinFactura?`<div class="aviso aviso-ambar">${sinFactura} de ${d.filas.length} movimiento(s) no tienen número de factura. Se añade al registrar o editar el movimiento.</div>`:''}
  <div class="card" style="padding:0;overflow-x:auto">
    ${d.filas.length?`<table class="patients-table" style="min-width:${tipo==='diario'?620:1100}px"><thead><tr>${d.cab.map(c=>`<th style="${num.has(c)?'text-align:right':''}">${c}</th>`).join('')}</tr></thead>
    <tbody>${d.filas.map(f=>`<tr>${f.map((c,i)=>`<td style="font-size:12.5px;${num.has(d.cab[i])?'text-align:right;font-variant-numeric:tabular-nums':''}${i===0?';white-space:nowrap':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}
    ${tipo==='diario'?'':`<tr>${d.cab.map((c,i)=>`<td style="font-weight:650;${num.has(c)?'text-align:right;font-variant-numeric:tabular-nums':''}">${i===0?'Total':i===iUSD?tot(iUSD).toFixed(2):i===iBs?tot(iBs).toFixed(2):''}</td>`).join('')}</tr>`}</tbody></table>`
    :`<div style="text-align:center;padding:36px;color:var(--text3)">Sin movimientos en ${esc(mes)}.</div>`}

}
function textoLibro(sep){
  const d=datosLibro(STATE.libroTipo||'ventas',STATE.libroMes||todayVET().slice(0,7));
  const q=c=>sep===','?'"'+String(c).replace(/"/g,'""')+'"':String(c).replace(/[\t\n]/g,' ');
  return[d.cab].concat(d.filas).map(f=>f.map(q).join(sep)).join('\n');
}
function copiarLibro(){
  const t=textoLibro('\t');
  try{navigator.clipboard.writeText(t).then(()=>showToast('Copiado: pégalo en Excel'),()=>showToast('No se pudo copiar desde este navegador'));}catch(e){showToast('No se pudo copiar desde este navegador');}
}
function descargarLibro(){
  try{
    const blob=new Blob(['﻿'+textoLibro(',')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`EPC-libro-${STATE.libroTipo||'ventas'}-${STATE.libroMes||todayVET().slice(0,7)}.csv`;document.body.appendChild(a);a.click();a.remove();
    showToast('Libro descargado');

function oblPeriodo(o,f){
  f=f||todayVET();const y=f.slice(0,4),m=Number(f.slice(5,7));
  if(o.periodicidad==='mensual')return f.slice(0,7);
  if(o.periodicidad==='trimestral')return y+'-T'+Math.ceil(m/3);
  if(o.periodicidad==='anual')return y;
  return'unica';
}
function oblPagada(o,per){return(o.pagos||[]).some(p=>p.periodo===per);}
function oblVence(o,per){
  per=per||oblPeriodo(o);const d=Math.min(28,Math.max(1,Number(o.dia)||0));
  if(!Number(o.dia))return'';
  const dd=String(d).padStart(2,'0');
  if(o.periodicidad==='mensual')return per+'-'+dd;
  if(o.periodicidad==='trimestral'){const t=Number(per.slice(6));const y=per.slice(0,4);return y+'-'+String(t*3).padStart(2,'0')+'-'+dd;}
  if(o.periodicidad==='anual')return per+'-'+String(Math.min(12,Math.max(1,Number(o.mes)||1))).padStart(2,'0')+'-'+dd;
  return o.fecha||'';
}
function oblEstado(o){
  const per=oblPeriodo(o);
  if(oblPagada(o,per))return['pagada','Pagada','badge-green'];
  const v=oblVence(o,per);
  if(!v)return['sinfecha','Sin fecha','badge-gray'];
  const d=diasPara(v);
  if(d<0)return['vencida','Vencida','badge-red'];
  if(d<=7)return['proxima','Vence en '+d+' día(s)','badge-gold'];
  return['pendiente','Pendiente','badge-gray'];
}

function guardarObligacion(id){
