<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCfxR_QeyJuFQD2EJlZOdcTu4idQeFmtCM",
  authDomain: "epc-clinic.firebaseapp.com",
  projectId: "epc-clinic",
  storageBucket: "epc-clinic.firebasestorage.app",
  messagingSenderId: "503441399542",
  appId: "1:503441399542:web:60fd39c9d3b6c8524716d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
window.fsLoad = async function(col){
  try{ const s=await db.collection(col).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){ return []; }
};
window.fsSave = async function(col,arr){
  try{
    const b=db.batch();
    arr.forEach(item=>{ if(item.id) b.set(db.collection(col).doc(String(item.id)),item); });
    await b.commit(); return true;
  }catch(e){ return false; }
};
window.firebaseReady=true;
window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A452;--gold2:#a88535;--gold3:#e8c97a;--silver:#B0B8C1;
  --bg:#0f1923;--bg2:#172231;--bg3:#1e2d3d;
  --text:#f0f4f8;--text2:#a0b0bc;--text3:#6a7e8c;
  --border:rgba(176,184,193,0.12);--border2:rgba(201,164,82,0.25);
  --green:#1D9E75;--blue:#378ADD;--red:#E24B4A;--purple:#7F77DD;
  --radius:10px;--radius2:16px;
}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden}
#sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.logo-area{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.logo-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--gold);letter-spacing:1px}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
nav{padding:14px 0;flex:1;overflow-y:auto}
.nav-section{padding:8px 20px 4px;font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;border-left:3px solid transparent;transition:all .2s;font-size:13px;color:var(--text2)}
.nav-item:hover{background:rgba(201,164,82,0.07);color:var(--text)}
.nav-item.active{background:rgba(201,164,82,0.1);border-left-color:var(--gold);color:var(--gold);font-weight:500}
.nav-icon{font-size:15px;width:18px;text-align:center}
.nav-badge{margin-left:auto;background:var(--gold);color:#1e2830;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#1e2830;flex-shrink:0}
.user-name{font-size:12px;font-weight:500;color:var(--text)}
.user-role{font-size:10px;color:var(--text3)}
#main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.page-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn{padding:8px 18px;border-radius:var(--radius);font-size:12px;font-weight:500;font-family:'Montserrat',sans-serif;cursor:pointer;border:none;transition:all .2s}
.btn-gold{background:var(--gold);color:#1e2830}.btn-gold:hover{background:var(--gold3)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border);font-family:'Montserrat',sans-serif;cursor:pointer;font-size:12px;font-weight:500;padding:8px 18px;border-radius:var(--radius);transition:all .2s}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:5px 12px;font-size:11px}
.content{padding:22px 28px;flex:1}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.card-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:18px;position:relative;overflow:hidden}
.kpi-card::after{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:var(--gold);opacity:.4}
.kpi-label{font-size:11px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:600;font-family:'Cormorant Garamond',serif;color:var(--text);margin-bottom:3px}
.kpi-sub{font-size:11px;color:var(--text3)}
.dashboard-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.agenda-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.agenda-item:last-child{border-bottom:none}
.agenda-time{font-size:12px;font-weight:600;color:var(--gold);min-width:46px}
.agenda-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}.dot-gold{background:var(--gold)}.dot-gray{background:var(--text3)}.dot-blue{background:var(--blue)}
.agenda-name{font-size:13px;font-weight:500;color:var(--text)}
.agenda-proc{font-size:11px;color:var(--text3)}
.status-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:500;white-space:nowrap}
.badge-green{background:rgba(29,158,117,.15);color:var(--green)}.badge-gold{background:rgba(201,164,82,.15);color:var(--gold)}

.proc-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}

.proc-bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.proc-bar{height:100%;background:var(--gold);border-radius:2px}
.search-bar{display:flex;gap:10px;margin-bottom:18px}
.search-input{flex:1;padding:10px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:'Montserrat',sans-serif;outline:none}
.search-input:focus{border-color:var(--gold)}.search-input::placeholder{color:var(--text3)}
.patients-table{width:100%;border-collapse:collapse}

.patient-avatar{width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gold);flex-shrink:0}
.patient-name-cell{display:flex;align-items:center;gap:10px}
.tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500}
.tag-vip{background:rgba(201,164,82,.2);color:var(--gold)}.tag-new{background:rgba(29,158,117,.15);color:var(--green)}.tag-surg{background:rgba(55,138,221,.15);color:var(--blue)}.tag-rec{background:rgba(176,184,193,.15);color:var(--silver)}
.agenda-controls{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.date-display{font-size:14px;font-weight:500;color:var(--text);min-width:200px;text-align:center}
.doc-chip{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .2s;font-family:'Montserrat',sans-serif}
.doc-chip.active{background:var(--gold);color:#1e2830;border-color:var(--gold);font-weight:500}
.calendar-grid{display:grid;grid-template-columns:60px repeat(7,1fr);gap:1px;background:var(--border)}
.cal-header{background:var(--bg3);padding:10px 8px;text-align:center;font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase}
.cal-header.today{color:var(--gold)}
.cal-time{background:var(--bg2);padding:8px;font-size:11px;color:var(--text3);text-align:right}
.cal-cell{background:var(--bg3);min-height:50px;padding:4px}
.cal-cell.today-col{background:rgba(201,164,82,.04)}
.cal-event{background:rgba(201,164,82,.15);border-left:3px solid var(--gold);border-radius:4px;padding:4px 6px;margin-bottom:2px;cursor:pointer;transition:all .15s}
.cal-event:hover{background:rgba(201,164,82,.28)}
.cal-event.green{background:rgba(29,158,117,.15);border-left-color:var(--green)}
.cal-event-name{font-size:10px;font-weight:600;color:var(--text)}
.cal-event-proc{font-size:10px;color:var(--text3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);width:680px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:28px}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--gold);margin-bottom:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}

.form-input{padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:'Montserrat',sans-serif;outline:none;width:100%}
.form-input:focus{border-color:var(--gold)}.form-input::placeholder{color:var(--text3)}

.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;cursor:pointer;color:var(--text2);font-size:12px;transition:all .2s;font-family:'Montserrat',sans-serif}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 20px;font-size:13px;color:var(--text);z-index:500;display:flex;align-items:center;gap:10px;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0}
.hidden{display:none!important}
.tab-bar{display:flex;gap:2px;background:var(--bg2);border-radius:var(--radius);padding:4px;margin-bottom:18px}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .2s}
.tab.active{background:var(--bg3);color:var(--gold);border:1px solid var(--border2)}
.hc-grid{display:grid;grid-template-columns:270px 1fr;gap:16px}
.hc-patient-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .2s;margin-bottom:8px}

.hc-panel{display:flex;flex-direction:column;gap:14px}
.hc-section{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:18px}
.hc-section-title{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.hc-field{display:flex;gap:8px;margin-bottom:10px}
.hc-field-label{font-size:11px;color:var(--text3);min-width:120px;padding-top:2px}
.hc-field-value{font-size:13px;color:var(--text);flex:1}
.consulta-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.consulta-date{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px}
.consulta-proc{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.consulta-note{font-size:12px;color:var(--text2);line-height:1.6}
.consulta-prods{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prod-chip{padding:3px 10px;background:rgba(201,164,82,.1);border:1px solid var(--border2);border-radius:6px;font-size:10px;color:var(--gold)}
.consent-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.consent-item:last-child{border-bottom:none}
.consent-check{width:20px;height:20px;border-radius:5px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.consent-check.done{background:rgba(29,158,117,.15);border-color:var(--green);color:var(--green)}
.trat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.trat-cat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;cursor:pointer;transition:all .2s;text-align:center}

.trat-price{font-size:13px;font-weight:500;color:var(--gold);min-width:90px;text-align:right;cursor:pointer;text-decoration:underline dotted}

.mov-monto-pos{font-weight:600;color:var(--green);min-width:85px;text-align:right}
.mov-monto-neg{font-weight:600;color:var(--red);min-width:85px;text-align:right}
.balance-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}

.periodo-btn{padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;font-family:'Montserrat',sans-serif;transition:all .2s}

.presup-clinic-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#2C3740}
.presup-item-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid #eee}
.presup-item-row:last-child{border-bottom:none}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.rep-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.rep-kpi{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.rep-kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.rep-kpi-value{font-size:24px;font-weight:600;font-family:'Cormorant Garamond',serif;color:var(--gold)}
.rep-kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.chart-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.chart-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px}
.chart-subtitle{font-size:11px;color:var(--text3);margin-bottom:16px}
.chart-wrap{position:relative;height:220px}

.rank-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rank-item:last-child{border-bottom:none}
.rank-num{font-size:12px;font-weight:600;color:var(--gold);min-width:22px}
.rank-bar-wrap{width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0}

// ── FIREBASE SYNC ─────────────────────────────────────────────────────────────
function saveLocal(k,d){try{localStorage.setItem('epc_'+k,JSON.stringify(d));}catch(e){}}
function loadLocal(k){try{const d=localStorage.getItem('epc_'+k);return d?JSON.parse(d):null;}catch(e){return null;}}

async function syncToSheet(col,arr){
  saveLocal(col,arr);
  showSyncBadge('↻ Guardando…');
  if(window.firebaseReady){
    const ok=await window.fsSave(col,arr);
    showSyncBadge(ok?'✓ Sincronizado':'⚠ Solo local');
  } else {
    showSyncBadge('● Local');
  }
}

async function loadFromSheet(col){
  if(window.firebaseReady){
    try{
      const data=await window.fsLoad(col);
      if(data&&data.length>0){saveLocal(col,data);return data;}
    }catch(e){}
  }
  return loadLocal(col)||[];
}

function showSyncBadge(msg){
  const el=$('sync-badge');if(!el)return;
  el.textContent=msg;
  el.style.color=msg.includes('✓')?'var(--green)':msg.includes('↻')?'var(--gold)':'var(--red)';
  if(msg.includes('✓'))setTimeout(()=>{el.textContent='● En línea';el.style.color='var(--green)';},2500);
}

async function loadAllData(){
  showSyncBadge('↻ Cargando…');
  const lp=loadLocal('Pacientes');if(lp&&lp.length)STATE.patients=lp;
  const lc=loadLocal('Citas');if(lc&&lc.length)STATE.appointments=lc;
  const lm=loadLocal('Movimientos');if(lm&&lm.length)STATE.movimientos=lm;
  const lpr=loadLocal('Presupuestos');if(lpr&&lpr.length)STATE.presupuestos=lpr;
  const lf=loadLocal('Formaciones');if(lf&&lf.length)STATE.formaciones=lf;
  $('badge-agenda').textContent=STATE.appointments.length;
  renderDashboard();
  const doLoad=async()=>{
    try{
      const[p,c,m,pr,f]=await Promise.all([
        loadFromSheet('Pacientes'),loadFromSheet('Citas'),loadFromSheet('Movimientos'),
        loadFromSheet('Presupuestos'),loadFromSheet('Formaciones')
      ]);
      let u=false;
      if(p.length){STATE.patients=p;u=true;}
      if(c.length){STATE.appointments=c;u=true;}
      if(m.length){STATE.movimientos=m;u=true;}
      if(pr.length){STATE.presupuestos=pr;u=true;}
      if(f.length){STATE.formaciones=f;u=true;}
      if(u){$('badge-agenda').textContent=STATE.appointments.length;if(STATE.view==='dashboard')renderDashboard();showSyncBadge('✓ Sincronizado');}
      else showSyncBadge('● En línea');
    }catch(e){showSyncBadge('● Local');}
  };
  if(window.firebaseReady)doLoad();
  else window.addEventListener('firebase-ready',doLoad,{once:true});
}

  const todayVet=nowVET();
  const weekStart=new Date(todayVet);
  weekStart.setDate(todayVet.getDate()-todayVet.getDay()+(agendaWeekOffset*7));
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
  const times=['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
  const hoy=todayVET();
  const evMap={};
  STATE.appointments.forEach(a=>{
    const dt=new Date(a.fecha+'T12:00:00');
    const diff=Math.round((dt-weekStart)/86400000);
    if(diff<0||diff>6)return;
    const ti=times.indexOf(a.time);if(ti<0)return;
    if(!evMap[diff])evMap[diff]={};
    if(!evMap[diff][ti])evMap[diff][ti]=[];
    evMap[diff][ti].push(a);
  });
  const ws=weekStart.toISOString().split('T')[0];
  const we=weekEnd.toISOString().split('T')[0];
  const citasSemana=STATE.appointments.filter(a=>a.fecha>=ws&&a.fecha<=we);
  const label=weekStart.toLocaleDateString('es-VE',{day:'2-digit',month:'short',timeZone:'America/Caracas'})+' – '+weekEnd.toLocaleDateString('es-VE',{day:'2-digit',month:'short',year:'numeric',timeZone:'America/Caracas'});
  $('content-area').innerHTML=`
  <div class="agenda-controls">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="icon-btn" onclick="agendaWeekOffset--;renderAgenda()">‹ Anterior</button>
      <div class="date-display">${label}</div>
      <button class="icon-btn" onclick="agendaWeekOffset++;renderAgenda()">Siguiente ›</button>
      ${agendaWeekOffset!==0?`<button class="icon-btn btn-sm" onclick="agendaWeekOffset=0;renderAgenda()">Hoy</button>`:''}
    </div>
    <span class="tz-badge">🕐 VET</span>
    <div style="display:flex;gap:8px;margin-left:auto">
      <button class="doc-chip active">Todos</button>
      <button class="btn btn-gold btn-sm" onclick="openNewCita()">+ Nueva cita</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">
    <div class="calendar-grid">
      <div class="cal-header" style="background:var(--bg2)"></div>
      ${days.map((d,i)=>{const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+i);const isT=dt.toISOString().split('T')[0]===hoy;return`<div class="cal-header${isT?' today':''}">${d}<br><span style="font-size:14px;font-weight:600">${dt.getDate()}</span></div>`;}).join('')}
      ${times.map((t,ti)=>`<div class="cal-time">${t}</div>${days.map((d,di)=>{
        const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+di);
        const isT=dt.toISOString().split('T')[0]===hoy;
        const evs=(evMap[di]||{})[ti]||[];
        return`<div class="cal-cell${isT?' today-col':''}">${evs.map(ev=>`<div class="cal-event" ondblclick="abrirHCDesdeCita('${ev.id}')" onclick="showToast('Doble clic → HC de ${ev.patient}')"><div class="cal-event-name">${ev.patient.split(' ')[0]}</div><div class="cal-event-proc">${ev.proc.split('—')[0].trim().slice(0,16)}</div></div>`).join('')}</div>`;
      }).join('')}`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Citas — ${label} (${citasSemana.length})</div>
    ${citasSemana.length?citasSemana.sort((a,b)=>a.fecha===b.fecha?a.time.localeCompare(b.time):a.fecha.localeCompare(b.fecha)).map(a=>`
    <div class="agenda-item">
      <div style="min-width:80px"><div class="agenda-time">${a.time} <span style="font-size:9px;color:var(--text3)">VET</span></div><div style="font-size:10px;color:var(--text3)">${fmtDateVET(a.fecha)}</div></div>
      <span class="agenda-dot dot-${a.status==='en_consulta'?'gold':a.status==='confirmado'?'green':a.status==='completado'?'blue':'gray'}"></span>
      <div style="flex:1"><div class="agenda-name">${a.patient}</div><div class="agenda-proc">${a.proc} · ${a.consultorio} · ${a.doc}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="status-badge ${statusMap[a.status].cls}">${statusMap[a.status].label}</span>
        <button class="icon-btn btn-sm" onclick="cycleStatus('${a.id}')">↺</button>
        <button class="icon-btn btn-sm" onclick="abrirHCDesdeCita('${a.id}')">📋 HC</button>
        <button class="icon-btn btn-sm" onclick="enviarRecordatorioWA('${a.id}')">📲</button>
        <button class="icon-btn btn-sm" onclick="openRegistrarCobro('${a.patient}','${a.proc}')">💰</button>
        <button class="icon-btn btn-sm" style="color:var(--red)" onclick="eliminarCita('${a.id}')">✕</button>
      </div>
    </div>`).join(''):`<div style="color:var(--text3);text-align:center;padding:20px;font-size:13px">Sin citas esta semana.</div>`}
  </div>`;
}

function enviarRecordatorioWA(citaId){
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const p=STATE.patients.find(x=>x.name===a.patient);
  const tel=(p?.phone||'').replace(/\D/g,'');
  const msg=`Hola ${a.patient} 👋\n\nLe recordamos su cita en *Elite Plastic Center*:\n\n📅 *Fecha:* ${fmtDateVET(a.fecha)}\n🕐 *Hora:* ${a.time} VET\n💉 *Procedimiento:* ${a.proc}\n👨‍⚕️ *Médico:* ${a.doc}\n📍 C.C. Trinidad Tepuy, Consultorio 1-13, Baruta, Caracas\n\n¡Nos vemos pronto! ✨`;
  window.open(tel?`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  showToast('Abriendo WhatsApp…');
}

function cycleStatus(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const c=['pendiente','confirmado','en_consulta','completado','cancelado'];
  a.status=c[(c.indexOf(a.status)+1)%c.length];
  syncToSheet('Citas',STATE.appointments);
  showToast('Estado: '+statusMap[a.status].label);renderAgenda();
}

function abrirHCDesdeCita(citaId){
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const p=STATE.patients.find(x=>x.name===a.patient);
  if(p){STATE.activeHCPatient=p.id;STATE.activeHCTab='consultas';showView('hc');setTimeout(()=>openNewConsulta(p.id),300);}
  else showToast('Paciente no encontrado');
}

function eliminarCita(id){
  openModal(`<div class="modal-title" style="color:var(--red)">Eliminar cita</div>
  <div style="background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.25);border-radius:var(--radius);padding:14px;margin-bottom:18px;font-size:13px;color:var(--text2)">¿Eliminar esta cita? No se puede deshacer.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--red);color:#fff;font-family:Montserrat,sans-serif;font-size:12px;padding:8px 18px;border-radius:var(--radius);cursor:pointer;border:none" onclick="confirmarEliminarCita('${id}')">Eliminar</button></div>`);
}
function confirmarEliminarCita(id){
  STATE.appointments=STATE.appointments.filter(a=>a.id!==id);
  $('badge-agenda').textContent=STATE.appointments.length;
  syncToSheet('Citas',STATE.appointments);
  closeModal();showToast('Cita eliminada');renderAgenda();
}

// ── PACIENTES ─────────────────────────────────────────────────────────────────
function renderPacientes(filter=''){
  const pts=filter?STATE.patients.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())||p.cedula.includes(filter)):STATE.patients;
  $('content-area').innerHTML=`
  <div class="section-header">
    <div class="section-title">Pacientes (${STATE.patients.length})</div>
    <button class="btn btn-gold" onclick="openNewPatient()">+ Nuevo paciente</button>
  </div>
  <div class="search-bar"><input class="search-input" placeholder="Buscar por nombre o cédula…" value="${filter}" oninput="renderPacientes(this.value)"></div>
  ${!STATE.patients.length?`<div class="card" style="text-align:center;padding:48px;color:var(--text3)"><div style="font-size:40px;opacity:.3;margin-bottom:12px">👤</div><div style="margin-bottom:16px">No hay pacientes registrados</div><button class="btn btn-gold" onclick="openNewPatient()">+ Registrar primer paciente</button></div>`:`
  <div class="card" style="padding:0;overflow:hidden">
    <table class="patients-table">
      <thead><tr><th>Paciente</th><th>Cédula</th><th>Teléfono</th><th>Etiquetas</th><th>Última visita</th><th style="text-align:center">Procs.</th><th></th></tr></thead>
      <tbody>${pts.map(p=>`
      <tr>
        <td><div class="patient-name-cell"><div class="patient-avatar">${initials(p.name)}</div><div><div style="font-weight:500;color:var(--text)">${p.name}</div><div style="font-size:11px;color:var(--text3)">${p.email||''}</div></div></div></td>
        <td style="color:var(--text2);font-size:12px">${p.cedula||''}</td>
        <td style="color:var(--text2);font-size:12px">${p.phone||''}</td>
        <td><div style="display:flex;gap:4px;flex-wrap:wrap">${(p.tags||[]).map(t=>`<span class="tag tag-${tagCls(t)}">${t}</span>`).join('')}</div></td>
        <td style="font-size:12px;color:var(--text2)">${p.lastVisit||'—'}</td>
        <td style="font-size:13px;font-weight:500;color:var(--gold);text-align:center">${p.procedures||0}</td>
        <td><div style="display:flex;gap:5px">
          <button class="icon-btn btn-sm" onclick="showView('hc');setTimeout(()=>openHCPatient('${p.id}'),50)">HC</button>
          <button class="icon-btn btn-sm" onclick="openEditarPaciente('${p.id}')">✏</button>
          <button class="icon-btn btn-sm" onclick="openNewPresupuestoForPat('${p.id}')">Presup.</button>
          <button class="icon-btn btn-sm" style="color:var(--red)" onclick="confirmarEliminarPaciente('${p.id}','${p.name}')">✕</button>
        </div></td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`}`;
}

function openNewPatient(){
  openModal(`<div class="modal-title">Nuevo paciente</div>
  <div class="form-row"><div class="form-group"><label class="form-label">Nombre completo</label><input class="form-input" id="f-nombre" placeholder="Nombre completo"></div><div class="form-group"><label class="form-label">Cédula</label><input class="form-input" id="f-cedula" placeholder="V-00.000.000"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="f-phone" placeholder="+58 412 000 0000"></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" placeholder="correo@email.com"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Fecha de nacimiento</label><input class="form-input" type="date" id="f-dob"></div><div class="form-group"><label class="form-label">Etiqueta</label><select class="form-input" id="f-tag"><option>Nueva</option><option>Recurrente</option><option>VIP</option><option>Cirugía</option></select></div></div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveNewPatient()">Guardar</button></div>`);
}
function saveNewPatient(){
  const n=$('f-nombre').value.trim(),c=$('f-cedula').value.trim();
  if(!n||!c){showToast('Nombre y cédula obligatorios');return;}
  STATE.patients.unshift({id:'P'+Date.now(),name:n,cedula:c,phone:$('f-phone').value||'—',email:$('f-email').value||'—',dob:$('f-dob').value||'—',tags:[$('f-tag').value],lastVisit:'',procedures:0});
  closeModal();showToast('Paciente registrado');
  syncToSheet('Pacientes',STATE.patients);
  if(STATE.view==='pacientes')renderPacientes();else renderDashboard();
}

function openEditarPaciente(id){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return;
  openModal(`<div class="modal-title">Editar paciente</div>
  <div class="form-row"><div class="form-group"><label class="form-label">Nombre</label><input class="form-input" id="ep-nombre" value="${p.name||''}"></div><div class="form-group"><label class="form-label">Cédula</label><input class="form-input" id="ep-cedula" value="${p.cedula||''}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="ep-phone" value="${p.phone||''}"></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" id="ep-email" value="${p.email||''}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Fecha de nacimiento</label><input class="form-input" type="date" id="ep-dob" value="${p.dob||''}"></div><div class="form-group"><label class="form-label">Etiqueta</label><select class="form-input" id="ep-tag">${['Nueva','Recurrente','VIP','Cirugía'].map(t=>`<option${(p.tags||[]).includes(t)?' selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="guardarEdicionPaciente('${id}')">Guardar</button></div>`);
}
function guardarEdicionPaciente(id){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return;
  p.name=$('ep-nombre').value.trim();p.cedula=$('ep-cedula').value.trim();p.phone=$('ep-phone').value;p.email=$('ep-email').value;p.dob=$('ep-dob').value;p.tags=[$('ep-tag').value];
  closeModal();showToast('Paciente actualizado');
  syncToSheet('Pacientes',STATE.patients);renderPacientes();
}
function confirmarEliminarPaciente(id,nombre){
  openModal(`<div class="modal-title" style="color:var(--red)">Eliminar paciente</div>
  <div style="background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.25);border-radius:var(--radius);padding:14px;margin-bottom:18px;font-size:13px;color:var(--text2)">¿Eliminar a <strong>${nombre}</strong>? No se puede deshacer.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--red);color:#fff;font-family:Montserrat,sans-serif;font-size:12px;padding:8px 18px;border-radius:var(--radius);cursor:pointer;border:none" onclick="eliminarPaciente('${id}')">Eliminar</button></div>`);
}
function eliminarPaciente(id){
  STATE.patients=STATE.patients.filter(p=>p.id!==id);
  if(STATE.hcData[id])delete STATE.hcData[id];
  closeModal();showToast('Paciente eliminado');
  syncToSheet('Pacientes',STATE.patients);renderPacientes();
}

// ── HISTORIA CLÍNICA ─────────────────────────────────────────────────────────
function renderHC(){
  if(!STATE.patients.length){$('content-area').innerHTML=`<div class="card" style="text-align:center;padding:48px;color:var(--text3)"><div style="font-size:40px;opacity:.3;margin-bottom:12px">📋</div><div style="margin-bottom:16px">No hay pacientes</div><button class="btn btn-gold" onclick="showView('pacientes')">Ir a Pacientes</button></div>`;return;}
  STATE.activeHCPatient=STATE.activeHCPatient||STATE.patients[0].id;
  $('content-area').innerHTML=`<div class="hc-grid">
    <div>
      <div class="search-bar" style="margin-bottom:10px"><input class="search-input" placeholder="Buscar paciente…" oninput="filterHCList(this.value)"></div>
      <div id="hc-list">${STATE.patients.map(p=>`<div class="hc-patient-card${p.id===STATE.activeHCPatient?' active':''}" onclick="openHCPatient('${p.id}')"><div style="display:flex;align-items:center;gap:10px"><div class="patient-avatar">${initials(p.name)}</div><div><div style="font-size:13px;font-weight:500;color:var(--text)">${p.name}</div><div style="font-size:11px;color:var(--text3)">${p.cedula||''} · ${p.procedures||0} procs.</div></div></div></div>`).join('')}</div>
    </div>
    <div id="hc-panel">${buildHCPanel(STATE.activeHCPatient)}</div>
  </div>`;
}

function filterHCList(q){
  const pts=q?STATE.patients.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())):STATE.patients;
  $('hc-list').innerHTML=pts.map(p=>`<div class="hc-patient-card${p.id===STATE.activeHCPatient?' active':''}" onclick="openHCPatient('${p.id}')"><div style="display:flex;align-items:center;gap:10px"><div class="patient-avatar">${initials(p.name)}</div><div><div style="font-size:13px;font-weight:500;color:var(--text)">${p.name}</div><div style="font-size:11px;color:var(--text3)">${p.cedula||''} · ${p.procedures||0} procs.</div></div></div></div>`).join('');
}

function openHCPatient(id){
  STATE.activeHCPatient=id;
  const panel=$('hc-panel');if(panel)panel.innerHTML=buildHCPanel(id);
  filterHCList('');
}

function buildHCPanel(id){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return'';
  const hc=STATE.hcData[id]||{antecedentes:{},consultas:[],consentimientos:[]};
  const tab=STATE.activeHCTab;
  return`<div class="hc-panel">
    <div class="hc-section" style="padding:14px 18px">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="patient-avatar" style="width:46px;height:46px;font-size:14px">${initials(p.name)}</div>
        <div style="flex:1"><div style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--gold)">${p.name}</div><div style="font-size:12px;color:var(--text3)">${p.cedula||''} · ${p.phone||''}</div></div>
        <div style="display:flex;gap:6px">${(p.tags||[]).map(t=>`<span class="tag tag-${tagCls(t)}">${t}</span>`).join('')}</div>
        <button class="icon-btn btn-sm" onclick="openEditarPaciente('${id}')">✏</button>
        <button class="btn btn-gold btn-sm" onclick="openNewConsulta('${id}')">+ Consulta</button>
      </div>
    </div>
    <div class="tab-bar">
      <div class="tab${tab==='antecedentes'?' active':''}" onclick="switchHCTab('antecedentes')">Antecedentes</div>
      <div class="tab${tab==='consultas'?' active':''}" onclick="switchHCTab('consultas')">Consultas (${(hc.consultas||[]).length})</div>
      <div class="tab${tab==='consentimientos'?' active':''}" onclick="switchHCTab('consentimientos')">Consentimientos</div>
    </div>
    <div id="hc-tab-content">${buildHCTab(id,tab)}</div>
  </div>`;
}

function switchHCTab(tab){STATE.activeHCTab=tab;const el=$('hc-tab-content');if(el)el.innerHTML=buildHCTab(STATE.activeHCPatient,tab);}

function buildHCTab(id,tab){
  const hc=STATE.hcData[id]||{antecedentes:{},consultas:[],consentimientos:[]};
  const ant=hc.antecedentes||{};
  if(tab==='antecedentes')return`<div class="hc-section"><div class="hc-section-title">Antecedentes <button class="icon-btn btn-sm" onclick="openEditAntecedentes('${id}')">✏ Editar</button></div>${[['Alergias',ant.alergias||'—'],['Medicamentos',ant.medicamentos||'—'],['Antec. personales',ant.antPersonales||'—'],['Antec. familiares',ant.antFamiliares||'—'],['Cirugías previas',ant.cirugiasPrevias||'—']].map(([l,v])=>`<div class="hc-field"><span class="hc-field-label">${l}</span><span class="hc-field-value">${v}</span></div>`).join('')}</div>`;
  if(tab==='consultas'){const cs=hc.consultas||[];if(!cs.length)return`<div class="hc-section" style="text-align:center;padding:28px;color:var(--text3)">Sin consultas.<br><button class="btn btn-gold btn-sm" style="margin-top:10px" onclick="openNewConsulta('${id}')">+ Primera consulta</button></div>`;return cs.map(c=>`<div class="consulta-card"><div class="consulta-date">📅 ${c.fecha} · ${c.doc}</div><div class="consulta-proc">${c.proc}</div><div class="consulta-note">${c.nota}</div>${(c.productos||[]).length?`<div class="consulta-prods">${c.productos.map(pr=>`<span class="prod-chip">💉 ${pr.prod} ${pr.dosis} — ${pr.zona} (${pr.lote})</span>`).join('')}</div>`:''}</div>`).join('');}
  if(tab==='consentimientos'){const cs=hc.consentimientos||[];return`<div class="hc-section"><div class="hc-section-title">Consentimientos <button class="icon-btn btn-sm" onclick="openAddConsentimiento('${id}')">+ Agregar</button></div>${cs.length?cs.map(c=>`<div class="consent-item"><div class="consent-check${c.firmado?' done':''}">${c.firmado?'✓':''}</div><div style="flex:1;font-size:13px;color:var(--text)">${c.nombre}</div><div style="font-size:11px;color:var(--text3)">${c.firmado?'Firmado '+c.fecha:'Pendiente'}</div>${!c.firmado?`<button class="icon-btn btn-sm" onclick="firmarConsentimiento('${id}','${c.nombre}')">Firmar</button>`:''}</div>`).join(''):'<div style="color:var(--text3);font-size:13px">Sin consentimientos.</div>'}</div>`;}
  return'';
}

function openEditAntecedentes(id){
  const ant=(STATE.hcData[id]||{}).antecedentes||{};
  openModal(`<div class="modal-title">Antecedentes — ${STATE.patients.find(p=>p.id===id)?.name||''}</div>
  <div class="form-group"><label class="form-label">Alergias</label><input class="form-input" id="fa-alergias" value="${ant.alergias||''}"></div>
  <div class="form-group"><label class="form-label">Medicamentos</label><input class="form-input" id="fa-meds" value="${ant.medicamentos||''}"></div>
  <div class="form-group"><label class="form-label">Antecedentes personales</label><textarea class="form-input" id="fa-pers">${ant.antPersonales||''}</textarea></div>
  <div class="form-group"><label class="form-label">Antecedentes familiares</label><textarea class="form-input" id="fa-fam">${ant.antFamiliares||''}</textarea></div>
  <div class="form-group"><label class="form-label">Cirugías previas</label><input class="form-input" id="fa-cir" value="${ant.cirugiasPrevias||''}"></div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveAntecedentes('${id}')">Guardar</button></div>`);
}
function saveAntecedentes(id){
  if(!STATE.hcData[id])STATE.hcData[id]={antecedentes:{},consultas:[],consentimientos:[]};
  STATE.hcData[id].antecedentes={alergias:$('fa-alergias').value,medicamentos:$('fa-meds').value,antPersonales:$('fa-pers').value,antFamiliares:$('fa-fam').value,cirugiasPrevias:$('fa-cir').value};
  closeModal();showToast('Antecedentes guardados');const el=$('hc-tab-content');if(el)el.innerHTML=buildHCTab(id,'antecedentes');
}
function openNewConsulta(id){
  id=id||STATE.activeHCPatient||STATE.patients[0]?.id;
  if(!id){showToast('Registra un paciente primero');return;}
  openModal(`<div class="modal-title">Registrar Consulta</div>
  <div class="form-row"><div class="form-group"><label class="form-label">Paciente</label>${buildPacienteSelect('fc-pat',id)}</div><div class="form-group"><label class="form-label">Fecha</label><input class="form-input" type="date" id="fc-fecha" value="${todayVET()}"></div></div>
  <div class="form-group"><label class="form-label">Procedimiento</label>${buildServiciosSelect('fc-proc')}</div>

function saveConsulta(){

  const m=$('fp-marca').value,pr=$('fp-prod').value;
  const prods=(m||pr)?[{marca:m,prod:pr,dosis:$('fp-dosis').value,zona:$('fp-zona').value,lote:$('fp-lote').value}]:[];
  STATE.hcData[patId].consultas.unshift({fecha:$('fc-fecha').value,proc:$('fc-proc').value,doc:getMedicoLabel(),nota:$('fc-nota').value,productos:prods});

function buildTratList(cat,items){
  const sc=cat.replace(/\W/g,'');
  return`<div class="trat-list-header"><div style="font-size:13px;font-weight:500;color:var(--text)">${cat} (${items.length})</div><span style="font-size:11px;color:var(--text3)">Clic en precio para editar</span></div>
  ${items.map((s,i)=>`<div class="trat-row"><div class="trat-name">${s.n}</div><div class="trat-price" id="price-display-${sc}-${i}" onclick="editPrice('${cat}',${i})">${fmtUSD(s.p)}</div><button class="icon-btn btn-sm" onclick="openNewConsulta(STATE.activeHCPatient)">Sesión</button></div>`).join('')}`;
}
function selectTratCat(cat){STATE.activeTratCat=cat;const c=$('trat-list-container');if(c)c.innerHTML=buildTratList(cat,SERVICIOS[cat]||[]);document.querySelectorAll('.trat-cat-card').forEach(el=>el.classList.toggle('active',el.querySelector('div:nth-child(2)')?.textContent===cat));}
function filterTratamientos(q){
  if(!q){renderTratamientos();return;}
  const all=[];Object.entries(SERVICIOS).forEach(([cat,items])=>items.forEach(s=>all.push({...s,cat})));
  const filtered=all.filter(s=>s.n.toLowerCase().includes(q.toLowerCase()));
  const c=$('trat-list-container');if(c)c.innerHTML=`<div class="trat-list-header"><div style="font-size:13px;font-weight:500;color:var(--text)">"${q}" — ${filtered.length} resultados</div></div>${filtered.map(s=>`<div class="trat-row"><div class="trat-name">${s.n}</div><span style="font-size:10px;padding:2px 8px;background:rgba(176,184,193,.1);border-radius:4px;color:var(--text3)">${s.cat.split('&')[0].trim()}</span><div class="trat-price">${fmtUSD(s.p)}</div><button class="icon-btn btn-sm" onclick="openNewConsulta(STATE.activeHCPatient)">Sesión</button></div>`).join('')}`;
}
function editPrice(cat,idx){
  const sc=cat.replace(/\W/g,'');const item=SERVICIOS[cat][idx];const el=$(`price-display-${sc}-${idx}`);if(!el)return;
  el.innerHTML=`<div style="display:flex;align-items:center;gap:5px"><span style="color:var(--text3);font-size:12px">$</span><input id="pinp-${sc}-${idx}" type="number" min="0" step="1" value="${item.p}" style="width:82px;padding:4px 8px;background:var(--bg2);border:1px solid var(--gold);border-radius:6px;color:var(--gold);font-size:13px;font-weight:600;font-family:'Montserrat',sans-serif;outline:none" onkeydown="if(event.key==='Enter')savePrice('${cat}',${idx});if(event.key==='Escape')cancelPrice('${cat}',${idx})" onblur="savePrice('${cat}',${idx})"><button class="icon-btn btn-sm" style="padding:3px 7px" onclick="savePrice('${cat}',${idx})">✓</button><button class="icon-btn btn-sm" style="padding:3px 7px" onclick="cancelPrice('${cat}',${idx})">✕</button></div>`;
  setTimeout(()=>{const i=$(`pinp-${sc}-${idx}`);if(i){i.focus();i.select();}},40);
}
function savePrice(cat,idx){const sc=cat.replace(/\W/g,'');const inp=$(`pinp-${sc}-${idx}`);if(!inp)return;const val=Math.max(0,parseInt(inp.value)||0);SERVICIOS[cat][idx].p=val;const el=$(`price-display-${sc}-${idx}`);if(el)el.innerHTML=fmtUSD(val);showToast(`Precio → ${fmtUSD(val)}`);}
function cancelPrice(cat,idx){const sc=cat.replace(/\W/g,'');const el=$(`price-display-${sc}-${idx}`);if(el)el.innerHTML=fmtUSD(SERVICIOS[cat][idx].p);}

function addPresupItem(){

  document.querySelectorAll('.presup-item-entry').forEach(row=>{const d=row.querySelector('select');const m=row.querySelector('input[type="number"]');if(d&&m&&d.value)items.push({desc:d.value,monto:parseFloat(m.value)||0});});

function saveCita(){

  const time=$('f-ctime').value,proc=$('f-cproc').value,fecha=$('f-cdate').value;

function openAgregarParticipante(formId){

  openModal(`<div class="modal-title">Agregar Participante</div>
  <div style="background:rgba(201,164,82,.08);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)"><strong style="color:var(--gold)">${f.nombre||''}</strong> · Base: ${fmtUSD(Number(f.precio)||0)}</div>

  <div class="form-row"><div class="form-group"><label class="form-label">WhatsApp</label><input class="form-input" id="fpar-ws" placeholder="+58 412…"></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" id="fpar-email" placeholder="correo@…"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Monto (USD)</label><input class="form-input" type="number" id="fpar-monto" value="${f.precio||0}" min="0"></div><div class="form-group"><label class="form-label">Estado de pago</label><select class="form-input" id="fpar-pagado"><option value="0">Pendiente</option><option value="1">Ya pagó</option></select></div></div>

function guardarParticipante(formId){
  const nombre=$('fpar-nombre').value.trim();if(!nombre){showToast('Nombre obligatorio');return;}
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;
  if(!f.participantes)f.participantes=[];
  f.participantes.push({id:'PAR'+Date.now(),nombre,pais:$('fpar-pais').value,whatsapp:$('fpar-ws').value,email:$('fpar-email').value,monto:parseFloat($('fpar-monto').value)||0,pagado:$('fpar-pagado').value==='1',fechaInscripcion:todayVET()});
  closeModal();showToast(`${nombre} agregado`);syncToSheet('Formaciones',STATE.formaciones);renderFormaciones();
}
function marcarPagado(formId,parId){
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;
  const p=(f.participantes||[]).find(x=>x.id===parId);if(!p)return;
  p.pagado=true;closeModal();showToast(`Pago registrado — ${p.nombre}`);syncToSheet('Formaciones',STATE.formaciones);renderFormaciones();
}
function eliminarParticipante(formId,parId){
  const f=STATE.formaciones.find(x=>x.id===formId);if(!f)return;
  f.participantes=(f.participantes||[]).filter(x=>x.id!==parId);
  closeModal();showToast('Participante eliminado');syncToSheet('Formaciones',STATE.formaciones);renderFormaciones();
}
function eliminarFormacion(id){
  openModal(`<div class="modal-title" style="color:var(--red)">Eliminar formación</div>
  <div style="background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.25);border-radius:var(--radius);padding:14px;margin-bottom:18px;font-size:13px;color:var(--text2)">¿Confirmas eliminar esta formación y sus participantes?</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--red);color:#fff;font-family:Montserrat,sans-serif;font-size:12px;padding:8px 18px;border-radius:var(--radius);cursor:pointer;border:none" onclick="confirmarEliminarFormacion('${id}')">Eliminar</button></div>`);
}
function confirmarEliminarFormacion(id){STATE.formaciones=STATE.formaciones.filter(f=>f.id!==id);closeModal();showToast('Formación eliminada');syncToSheet('Formaciones',STATE.formaciones);renderFormaciones();}

  <div class="form-group"><label class="form-label">Paciente</label>${patOpts}</div>
  <div class="form-group"><label class="form-label">Mensaje (editable)</label><textarea class="form-input" id="mkt-preview" style="min-height:180px;font-size:12px;line-height:1.6">${pl.texto}</textarea></div>
  <div style="background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.25);border-radius:var(--radius);padding:12px;margin-bottom:16px;font-size:12px;color:var(--text2)">💡 Edita el mensaje y haz clic en "Abrir WhatsApp" — se abrirá con el número y mensaje listos.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn" style="background:#25D366;color:#fff;font-family:Montserrat,sans-serif;font-size:12px;font-weight:500;padding:8px 18px;border-radius:var(--radius);cursor:pointer;border:none" onclick="enviarWAMarketing('${id}')">📲 Abrir WhatsApp</button></div>`);
  setTimeout(()=>previewWA(id),100);
  if(STATE.patients.length){const sel=$('mkt-pat');if(sel)sel.addEventListener('change',()=>previewWA(id));}
}
function previewWA(plId){
  const pl=WA_PLANTILLAS.find(x=>x.id===plId);if(!pl)return;
  const sel=$('mkt-pat');if(!sel)return;
  const p=STATE.patients.find(x=>x.id===sel.value);if(!p)return;
  const cita=STATE.appointments.filter(a=>a.patient===p.name).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
  const prev=$('mkt-preview');if(!prev)return;
  prev.value=pl.texto.replace(/\[NOMBRE\]/g,p.name).replace(/\[HORA\]/g,cita?cita.time:'[HORA]').replace(/\[FECHA\]/g,cita?fmtDateVET(cita.fecha):'[FECHA]').replace(/\[PROC\]/g,cita?cita.proc:'[PROCEDIMIENTO]');
}
function enviarWAMarketing(plId){
  const sel=$('mkt-pat');const p=sel?STATE.patients.find(x=>x.id===sel.value):null;
  const tel=(p?.phone||'').replace(/\D/g,'');
  const msg=$('mkt-preview')?.value||'';
  window.open(tel?`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  closeModal();showToast(`WhatsApp abierto${p?' para '+p.name:''}`);
}
function abrirPlantillaEmail(id){
  const pl=EMAIL_PLANTILLAS[id];if(!pl)return;
  const patOpts=!STATE.patients.length?`<div style="color:var(--text3);font-size:13px">Sin pacientes</div>`:buildPacienteSelect('email-pat');
  openModal(`<div class="modal-title">📧 ${pl.nombre}</div>
  <div class="form-group"><label class="form-label">Destinatario</label>${patOpts}</div>
  <div class="form-group"><label class="form-label">Asunto</label><input class="form-input" id="email-asunto" value="${pl.asunto}"></div>
  <div class="form-group"><label class="form-label">Mensaje</label><textarea class="form-input" id="email-cuerpo" style="min-height:200px;font-size:12px;line-height:1.6">${pl.cuerpo}</textarea></div>
  <div style="background:rgba(55,138,221,.08);border:1px solid rgba(55,138,221,.25);border-radius:var(--radius);padding:12px;margin-bottom:16px;font-size:12px;color:var(--text2)">💡 Se abrirá Gmail con el correo listo desde eliteplasticcenter@gmail.com</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="enviarEmailMarketing()">📧 Abrir Gmail</button></div>`);
  if(STATE.patients.length){setTimeout(()=>{const sel=$('email-pat');if(sel)sel.addEventListener('change',()=>previewEmail(id));previewEmail(id);},100);}
}
function previewEmail(plId){
  const sel=$('email-pat');if(!sel)return;
  const p=STATE.patients.find(x=>x.id===sel.value);if(!p)return;
  const cita=STATE.appointments.filter(a=>a.patient===p.name).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
  const cb=$('email-cuerpo');const as=$('email-asunto');
  if(cb)cb.value=cb.value.replace(/\[NOMBRE\]/g,p.name).replace(/\[HORA\]/g,cita?cita.time:'[HORA]').replace(/\[FECHA\]/g,cita?fmtDateVET(cita.fecha):'[FECHA]').replace(/\[PROC\]/g,cita?cita.proc:'[PROCEDIMIENTO]');
  if(as)as.value=as.value.replace(/\[NOMBRE\]/g,p.name);
}
function enviarEmailMarketing(){
  const sel=$('email-pat');const p=sel?STATE.patients.find(x=>x.id===sel.value):null;
  const url=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(p?.email||'')}&su=${encodeURIComponent($('email-asunto')?.value||'')}&body=${encodeURIComponent($('email-cuerpo')?.value||'')}&from=eliteplasticcenter@gmail.com`;
  window.open(url,'_blank');
  closeModal();showToast(`Gmail abierto${p?' para '+p.name:''}`);
}

// ── REPORTES ──────────────────────────────────────────────────────────────────
function renderReportes(){
  const movs=STATE.movimientos;
  const ing=movs.filter(m=>m.tipo==='ingreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  const egr=movs.filter(m=>m.tipo==='egreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  $('content-area').innerHTML=`
  <div class="rep-tabs">
    ${['financiero','pacientes','agenda'].map(t=>`<button class="rep-tab${STATE.activeRepTab===t?' active':''}" onclick="switchRepTab('${t}')">${{financiero:'💰 Financiero',pacientes:'👥 Pacientes',agenda:'📅 Agenda'}[t]}</button>`).join('')}
  </div>
  <div id="rep-content">${buildRepTab(STATE.activeRepTab)}</div>`;
  setTimeout(()=>drawRepCharts(STATE.activeRepTab),120);
}
function switchRepTab(tab){
  STATE.activeRepTab=tab;Object.keys(chartsInstances).forEach(destroyChart);
  document.querySelectorAll('.rep-tab').forEach(b=>b.classList.toggle('active',b.textContent.includes(tab==='financiero'?'💰':tab==='pacientes'?'👥':'📅')));
  const el=$('rep-content');if(el)el.innerHTML=buildRepTab(tab);
  setTimeout(()=>drawRepCharts(tab),120);
}
function buildRepTab(tab){
  const movs=STATE.movimientos;
  const ing=movs.filter(m=>m.tipo==='ingreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  const egr=movs.filter(m=>m.tipo==='egreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
  if(tab==='financiero')return`
    <div class="rep-kpi-grid">
      <div class="rep-kpi"><div class="rep-kpi-label">Ingresos USD</div><div class="rep-kpi-value">${fmtUSD(ing)}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Egresos USD</div><div class="rep-kpi-value">${fmtUSD(egr)}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Balance</div><div class="rep-kpi-value">${fmtUSD(ing-egr)}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Movimientos</div><div class="rep-kpi-value">${movs.length}</div></div>
    </div>
    <div class="rep-grid">
      <div class="chart-card"><div class="chart-title">Ingresos vs Egresos</div><div class="chart-subtitle">USD acumulado</div><div class="chart-wrap"><canvas id="chart-ing-egr"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">Por método de pago</div><div class="chart-subtitle">Distribución</div><div class="chart-wrap"><canvas id="chart-metodos"></canvas></div></div>
    </div>`;
  if(tab==='pacientes')return`
    <div class="rep-kpi-grid">
      <div class="rep-kpi"><div class="rep-kpi-label">Total</div><div class="rep-kpi-value">${STATE.patients.length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">VIP</div><div class="rep-kpi-value">${STATE.patients.filter(p=>(p.tags||[]).includes('VIP')).length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Nuevos</div><div class="rep-kpi-value">${STATE.patients.filter(p=>(p.tags||[]).some(t=>t==='Nueva'||t==='Nuevo')).length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Cirugía</div><div class="rep-kpi-value">${STATE.patients.filter(p=>(p.tags||[]).includes('Cirugía')).length}</div></div>
    </div>
    <div class="card"><div class="card-title">Por procedimientos</div>${STATE.patients.sort((a,b)=>(b.procedures||0)-(a.procedures||0)).map((p,i)=>`<div class="rank-item"><div class="rank-num">#${i+1}</div><div style="font-size:12px;color:var(--text);flex:1">${p.name}</div><div class="rank-bar-wrap"><div class="rank-bar" style="width:${STATE.patients[0]?.procedures>0?Math.round((p.procedures||0)/STATE.patients[0].procedures*100):0}%"></div></div><div style="font-size:12px;font-weight:600;color:var(--text2)">${p.procedures||0}</div></div>`).join('')||'<div style="color:var(--text3);font-size:13px">Sin datos</div>'}</div>`;
  if(tab==='agenda')return`
    <div class="rep-kpi-grid">
      <div class="rep-kpi"><div class="rep-kpi-label">Total citas</div><div class="rep-kpi-value">${STATE.appointments.length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Confirmadas</div><div class="rep-kpi-value">${STATE.appointments.filter(a=>a.status==='confirmado').length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Pendientes</div><div class="rep-kpi-value">${STATE.appointments.filter(a=>a.status==='pendiente').length}</div></div>
      <div class="rep-kpi"><div class="rep-kpi-label">Completadas</div><div class="rep-kpi-value">${STATE.appointments.filter(a=>a.status==='completado').length}</div></div>
    </div>
    <div class="card"><div class="card-title">Todas las citas</div>${STATE.appointments.map(a=>`<div class="rank-item"><div style="font-size:11px;color:var(--gold);min-width:80px">${a.fecha}</div><div style="font-size:11px;color:var(--text3);min-width:50px">${a.time} VET</div><div style="font-size:12px;color:var(--text);flex:1">${a.patient}</div><span class="status-badge ${statusMap[a.status].cls}">${statusMap[a.status].label}</span></div>`).join('')||'<div style="color:var(--text3);font-size:13px;padding:16px 0">Sin citas.</div>'}</div>`;
  return'';
}
function drawRepCharts(tab){
  const cd={color:'#a0b0bc',grid:'rgba(176,184,193,0.08)',gold:'#C9A452',green:'#1D9E75',blue:'#378ADD',red:'#E24B4A'};
  const movs=STATE.movimientos;
  if(tab==='financiero'){
    const ing=movs.filter(m=>m.tipo==='ingreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
    const egr=movs.filter(m=>m.tipo==='egreso'&&(m.moneda==='USD'||!m.moneda)).reduce((a,m)=>a+Number(m.monto),0);
    const c1=$('chart-ing-egr');if(c1){chartsInstances['c1']=new Chart(c1,{type:'bar',data:{labels:['Ingresos','Egresos','Balance'],datasets:[{data:[ing,egr,ing-egr],backgroundColor:['rgba(29,158,117,0.6)','rgba(226,75,74,0.5)','rgba(201,164,82,0.6)'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:cd.color},grid:{color:cd.grid}},y:{ticks:{color:cd.color,callback:v=>'$'+v},grid:{color:cd.grid}}}}});}
    const byM={};movs.filter(m=>m.tipo==='ingreso').forEach(m=>{byM[m.metodo||'']=(byM[m.metodo||'']||0)+Number(m.monto);});
    const c2=$('chart-metodos');if(c2&&Object.keys(byM).length){chartsInstances['c2']=new Chart(c2,{type:'doughnut',data:{labels:Object.keys(byM),datasets:[{data:Object.values(byM),backgroundColor:[cd.gold,'rgba(201,164,82,0.6)',cd.blue,cd.green,'#7F77DD'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'right',labels:{color:cd.color,font:{size:11},boxWidth:12}}}}});}
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function updateClock(){
  const n=nowVET();
  $('fecha-hoy').textContent=n.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+' · '+n.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})+' VET';
}
updateClock();
setInterval(updateClock,60000);
loadAllData();
</script>
</body>
