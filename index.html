<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPC — Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCfxR_QeyJuFQD2EJlZOdcTu4idQeFmtCM",
  authDomain: "epc-clinic.firebaseapp.com",
  projectId: "epc-clinic",
  storageBucket: "epc-clinic.firebasestorage.app",
  messagingSenderId: "503441399542",
  appId: "1:503441399542:web:60fd39c9d3b6c8524716d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
try{ db.settings({ignoreUndefinedProperties:true}); }catch(e){}
// Caché offline oficial de Firestore (IndexedDB): si se cae internet, los cambios quedan en cola
// y se envían solos al reconectar. Sustituye al antiguo localStorage, que "resucitaba" datos borrados.
window.FS_PERSIST = db.enablePersistence({synchronizeTabs:true}).then(()=>true).catch(e=>{console.warn('Persistencia offline no disponible:',e&&e.code);return false;});
window.firebaseReady=true;
window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#D4AD68;--gold2:#8E7038;--gold3:#E6C68A;--goldline:rgba(212,173,104,.4);
  --bg:#12161B;--bg2:rgba(255,247,232,0.045);--bg3:rgba(255,247,232,0.05);--bg4:rgba(255,247,232,0.09);
  --navy:#2C3740;
  --text:#F1ECE0;--text2:#ADB4B8;--text3:#767E82;
  --border:rgba(255,255,255,0.09);--border2:rgba(212,173,104,0.35);
  --green:#5FA085;--blue:#6B93B8;--red:#C17268;--purple:#8D84BF;
  --radius:10px;--radius2:16px;--radius3:22px;
  --blur:20px;
  --shadow-card:0 8px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);
  --shadow-glass:0 16px 48px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09);
}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse 900px 600px at 8% -5%, rgba(212,173,104,.16), transparent 60%),
  radial-gradient(ellipse 800px 700px at 100% 15%, rgba(107,147,184,.13), transparent 60%),
  radial-gradient(ellipse 700px 600px at 20% 100%, rgba(141,132,191,.11), transparent 60%),
  radial-gradient(ellipse 900px 500px at 90% 95%, rgba(95,160,133,.09), transparent 60%),
  var(--bg)}
*:focus-visible{outline:1.5px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(166,175,184,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(201,164,82,.35)}

/* ── SIDEBAR ─────────────────────────────────────────────────────────────── */
#sidebar{width:232px;min-width:232px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;box-shadow:1px 0 0 rgba(255,255,255,.04)}
.logo-area{padding:26px 22px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.logo-mark{width:38px;height:38px;border:1px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.5px;flex-shrink:0}
.logo-title{font-family:var(--display);font-size:20px;font-weight:600;color:var(--text);letter-spacing:.4px;line-height:1.1}
.logo-sub{font-size:9.5px;color:var(--text3);letter-spacing:1.8px;text-transform:uppercase;margin-top:3px}
nav{padding:18px 0;flex:1;overflow-y:auto}
.nav-section{padding:16px 22px 6px;font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.nav-section:first-child{padding-top:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 22px;cursor:pointer;border-left:2px solid transparent;transition:background .15s,color .15s,border-color .15s;font-size:13px;color:var(--text2)}
.nav-item:hover{background:rgba(201,164,82,0.06);color:var(--text)}
.nav-item.active{background:rgba(212,173,104,0.1);border-left-color:var(--gold);color:var(--gold3);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.nav-icon{font-size:14px;width:16px;text-align:center;opacity:.9}
.nav-badge{margin-left:auto;background:transparent;border:1px solid var(--border2);color:var(--gold);font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px}
.sidebar-footer{padding:16px 22px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:6px;background:var(--bg4);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gold);flex-shrink:0;font-family:var(--display)}
.user-name{font-size:12px;font-weight:500;color:var(--text)}
.user-role{font-size:10px;color:var(--text3);margin-top:1px}

/* ── MAIN / TOPBAR ───────────────────────────────────────────────────────── */
#main{margin-left:232px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(18,22,27,.55);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.page-title{font-family:var(--display);font-size:26px;font-weight:600;color:var(--text);letter-spacing:.2px}
.topbar-right{display:flex;align-items:center;gap:14px}
.btn{padding:9px 20px;border-radius:var(--radius);font-size:12px;font-weight:500;font-family:'Instrument Sans',sans-serif;cursor:pointer;border:none;transition:background .15s,color .15s,border-color .15s;letter-spacing:.2px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#171008;box-shadow:0 4px 14px rgba(212,173,104,.25),inset 0 1px 0 rgba(255,255,255,.3)}.btn-gold:hover{background:linear-gradient(135deg,var(--gold3),var(--gold))}
.btn-outline{background:rgba(255,247,232,.03);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--text2);border:1px solid var(--border);font-family:'Instrument Sans',sans-serif;cursor:pointer;font-size:12px;font-weight:500;padding:9px 20px;border-radius:var(--radius);transition:border-color .15s,color .15s,background .15s}.btn-outline:hover{background:rgba(255,247,232,.07)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:6px 13px;font-size:11px}
.content{padding:26px 32px 40px;flex:1;max-width:1440px}

/* ── CARDS ────────────────────────────────────────────────────────────────── */
.card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:22px;box-shadow:var(--shadow-card);transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.card-title{font-size:12.5px;font-weight:500;color:var(--text2);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px}

/* ── KPI STRIP (momento de firma: una franja continua, no 4 cajas sueltas) ── */
.kpi-grid{display:flex;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow-card)}
.kpi-card{transition:background .2s}
.kpi-card:hover{background:rgba(255,247,232,0.06)}
.kpi-card{flex:1;padding:20px 24px;position:relative;border-left:1px solid var(--border)}
.kpi-card:first-child{border-left:none}
.kpi-card::after{content:none}
.kpi-label{font-size:10.5px;color:var(--text3);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-size:28px;font-weight:600;font-family:var(--display);color:var(--text);margin-bottom:3px;line-height:1}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
.dashboard-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}

/* ── AGENDA / LISTAS ──────────────────────────────────────────────────────── */
.agenda-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.agenda-item:last-child{border-bottom:none}
.agenda-time{font-size:12px;font-weight:600;color:var(--gold);min-width:46px;font-variant-numeric:tabular-nums}
.agenda-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}.dot-gold{background:var(--gold)}.dot-gray{background:var(--text3)}.dot-blue{background:var(--blue)}
.agenda-name{font-size:13px;font-weight:500;color:var(--text)}
.agenda-proc{font-size:11px;color:var(--text3);margin-top:1px}
.status-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;letter-spacing:.2px}
.badge-green{background:rgba(63,143,115,.15);color:var(--green)}.badge-gold{background:rgba(201,164,82,.15);color:var(--gold)}
.badge-gray{background:rgba(105,115,125,.18);color:var(--text2)}.badge-blue{background:rgba(90,141,191,.15);color:var(--blue)}.badge-red{background:rgba(194,89,85,.15);color:var(--red)}
.proc-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.proc-item:last-child{border-bottom:none}
.proc-bar-wrap{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.proc-bar{height:100%;background:var(--gold);border-radius:2px}

/* ── BUSQUEDA / TABLA PACIENTES ──────────────────────────────────────────── */
.search-bar{display:flex;gap:10px;margin-bottom:20px}
.search-input{flex:1;padding:11px 16px;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:'Instrument Sans',sans-serif;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--gold)}.search-input::placeholder{color:var(--text3)}
.patients-table{width:100%;border-collapse:collapse}
.patients-table th{font-size:10.5px;color:var(--text3);letter-spacing:1.6px;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);font-weight:500}
.patients-table td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px}
.patients-table tr:hover td{background:rgba(201,164,82,.035)}
.patient-avatar{width:34px;height:34px;border-radius:7px;background:var(--bg4);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gold);flex-shrink:0;font-family:var(--display)}
.patient-name-cell{display:flex;align-items:center;gap:11px}
.tag{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:500}
.tag-vip{background:rgba(201,164,82,.2);color:var(--gold)}.tag-new{background:rgba(63,143,115,.15);color:var(--green)}.tag-surg{background:rgba(90,141,191,.15);color:var(--blue)}.tag-rec{background:rgba(166,175,184,.15);color:var(--text2)}

/* ── AGENDA / CALENDARIO ──────────────────────────────────────────────────── */
.agenda-controls{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.date-display{font-family:var(--display);font-size:16px;font-weight:600;color:var(--text);min-width:200px;text-align:center}
.doc-chip{padding:6px 15px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:background .15s,color .15s,border-color .15s;font-family:'Instrument Sans',sans-serif}
.doc-chip.active{background:var(--gold);color:#101820;border-color:var(--gold);font-weight:500}
.calendar-grid{display:grid;grid-template-columns:56px repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden}
.cal-header{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:11px 8px;text-align:center;font-size:10.5px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.cal-header.today{color:var(--gold)}
.cal-time{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:6px 8px;font-size:10.5px;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}
.cal-time-half{color:transparent;border-top:1px dashed var(--border)}
.cal-cell{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));min-height:34px;padding:3px}
.cal-cell-half{border-top:1px dashed var(--border)}
.cal-cell.today-col{background:rgba(201,164,82,.035)}
.cal-event{background:rgba(201,164,82,.14);border-left:2px solid var(--gold);border-radius:4px;padding:5px 7px;margin-bottom:2px;cursor:pointer;transition:background .15s}
.cal-event:hover{background:rgba(201,164,82,.26)}
.cal-event.green{background:rgba(63,143,115,.14);border-left-color:var(--green)}
.cal-event-name{font-size:10px;font-weight:600;color:var(--text)}
.cal-event-proc{font-size:10px;color:var(--text3)}

/* ── MODALES / FORMULARIOS ───────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(6,10,15,.78);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.modal{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius3);width:680px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:30px;box-shadow:var(--shadow-glass)}
.modal-title{font-family:var(--display);font-size:23px;font-weight:600;color:var(--gold);margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-label{font-size:10.5px;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;font-weight:500}
.form-input{padding:10px 14px;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:'Instrument Sans',sans-serif;outline:none;width:100%;transition:border-color .15s}
.form-input:focus{border-color:var(--gold)}.form-input::placeholder{color:var(--text3)}
.form-input{color-scheme:dark}
select.form-input{cursor:pointer}
select.form-input option{background:#1C2229;color:#F1ECE0;padding:6px}
select.form-input option:checked{background:#8E7038;color:#FFFFFF}
select.form-input optgroup{background:#12161B;color:#D4AD68;font-style:normal;font-weight:600}
textarea.form-input{resize:vertical;min-height:80px;line-height:1.55}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:7px 13px;cursor:pointer;color:var(--text2);font-size:12px;transition:border-color .15s,color .15s;font-family:'Instrument Sans',sans-serif}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-title{font-family:var(--display);font-size:21px;font-weight:600;color:var(--text)}
.toast{position:fixed;bottom:26px;right:26px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius);padding:14px 20px;font-size:13px;color:var(--text);z-index:500;display:flex;align-items:center;gap:10px;transform:translateY(100px);opacity:0;transition:transform .3s,opacity .3s;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.show{transform:translateY(0);opacity:1}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.hidden{display:none!important}
.tab-bar{display:flex;gap:2px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-radius:var(--radius);padding:4px;margin-bottom:20px}
.tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:6px;transition:background .15s,color .15s}
.tab.active{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--gold);border:1px solid var(--border2)}

/* ── HISTORIA CLÍNICA ─────────────────────────────────────────────────────── */
.hc-grid{display:grid;grid-template-columns:270px 1fr;gap:16px}
.hc-patient-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:8px}
.hc-patient-card:hover,.hc-patient-card.active{border-color:var(--gold);background:rgba(201,164,82,.055)}
.hc-panel{display:flex;flex-direction:column;gap:14px}
.hc-section{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.hc-section-title{font-size:10.5px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.hc-field{display:flex;gap:8px;margin-bottom:10px}
.hc-field-label{font-size:11px;color:var(--text3);min-width:120px;padding-top:2px}
.hc-field-value{font-size:13px;color:var(--text);flex:1}
.consulta-card{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:10px}
.consulta-date{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px}
.consulta-proc{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.consulta-note{font-size:12px;color:var(--text2);line-height:1.6}
.consulta-prods{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prod-chip{padding:3px 10px;background:rgba(201,164,82,.1);border:1px solid var(--border2);border-radius:20px;font-size:10px;color:var(--gold)}
.consent-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.consent-item:last-child{border-bottom:none}
.consent-check{width:20px;height:20px;border-radius:5px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.consent-check.done{background:rgba(63,143,115,.15);border-color:var(--green);color:var(--green)}

/* ── TRATAMIENTOS ─────────────────────────────────────────────────────────── */
.trat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.trat-cat-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:15px;cursor:pointer;transition:border-color .15s,background .15s;text-align:center}
.trat-cat-card:hover,.trat-cat-card.active{border-color:var(--gold);background:rgba(201,164,82,.055)}
.trat-list{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden}
.trat-list-header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.trat-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);transition:background .15s}
.trat-row:last-child{border-bottom:none}.trat-row:hover{background:rgba(201,164,82,.03)}
.trat-name{font-size:13px;color:var(--text);flex:1}
.trat-price{font-size:13px;font-weight:500;color:var(--gold);min-width:90px;text-align:right;cursor:pointer;text-decoration:underline dotted}

/* ── CAJA ─────────────────────────────────────────────────────────────────── */
.movimiento-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.movimiento-row:last-child{border-bottom:none}.movimiento-row:hover{background:rgba(201,164,82,.03)}
.mov-tipo{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mov-ingreso{background:var(--green)}.mov-egreso{background:var(--red)}
.mov-monto-pos{font-weight:600;color:var(--green);min-width:85px;text-align:right;font-variant-numeric:tabular-nums}
.mov-monto-neg{font-weight:600;color:var(--red);min-width:85px;text-align:right;font-variant-numeric:tabular-nums}
.balance-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:none;padding-top:13px}
.balance-label{font-size:12px;color:var(--text3)}
.periodo-btn{padding:6px 13px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;font-family:'Instrument Sans',sans-serif;transition:background .15s,color .15s,border-color .15s}
.periodo-btn.active{background:var(--gold);color:#101820;border-color:var(--gold);font-weight:500}

/* ── PRESUPUESTOS ─────────────────────────────────────────────────────────── */
.presup-list{display:flex;flex-direction:column;gap:10px}
.presup-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:17px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s}
.presup-card:hover{border-color:var(--gold)}
.presup-preview{background:#FBF9F4;color:#22282E;border-radius:var(--radius2);padding:38px;max-width:560px;margin:0 auto;font-family:'Instrument Sans',sans-serif}
.presup-preview-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;padding-bottom:18px;border-bottom:2px solid #2C3740}
.presup-clinic-name{font-family:var(--display);font-size:24px;font-weight:600;color:#2C3740}
.presup-item-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid #eee}
.presup-item-row:last-child{border-bottom:none}

/* ── REPORTES ─────────────────────────────────────────────────────────────── */
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.rep-kpi-grid{display:flex;background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);margin-bottom:20px;overflow:hidden}
.rep-kpi{flex:1;padding:18px 20px;border-left:1px solid var(--border)}
.rep-kpi:first-child{border-left:none}
.rep-kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px}
.rep-kpi-value{font-size:25px;font-weight:600;font-family:var(--display);color:var(--gold)}
.rep-kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.chart-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:22px}
.chart-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px}
.chart-subtitle{font-size:11px;color:var(--text3);margin-bottom:18px}
.chart-wrap{position:relative;height:220px}
.rep-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.rep-tab{padding:7px 17px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:background .15s,color .15s,border-color .15s;font-family:'Instrument Sans',sans-serif}
.rep-tab.active{background:var(--gold);color:#101820;border-color:var(--gold);font-weight:500}
.rank-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rank-item:last-child{border-bottom:none}
.rank-num{font-size:12px;font-weight:600;color:var(--gold);min-width:22px;font-family:var(--display)}
.rank-bar-wrap{width:80px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0}
.rank-bar{height:100%;background:var(--gold);border-radius:2px}
.tz-badge{background:rgba(201,164,82,.1);border:1px solid var(--border2);border-radius:20px;padding:4px 11px;font-size:10px;color:var(--gold);font-weight:600;letter-spacing:.8px}

/* ── MARKETING ────────────────────────────────────────────────────────────── */
.mkt-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:17px;cursor:pointer;transition:border-color .15s;margin-bottom:10px;display:flex;align-items:center;gap:13px}
.mkt-card:hover{border-color:var(--gold)}
.mkt-icon{width:40px;height:40px;border-radius:9px;background:rgba(201,164,82,.1);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* ── RESPONSIVE ───────────────────────────────────────────────────────────── */
@media(max-width:1080px){
  .dashboard-grid{grid-template-columns:1fr}
  .trat-grid{grid-template-columns:repeat(2,1fr)}
  .hc-grid{grid-template-columns:1fr}
  .rep-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  body{flex-direction:column}
  #sidebar{position:relative;width:100%;min-width:0;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  nav{display:flex;overflow-x:auto;padding:8px 10px;gap:2px}
  .nav-section{display:none}
  .nav-item{flex-shrink:0;border-left:none;border-bottom:2px solid transparent;padding:8px 12px;white-space:nowrap}
  .nav-item.active{border-left:none;border-bottom-color:var(--gold)}
  .sidebar-footer{display:none}
  #main{margin-left:0}
  .kpi-grid{flex-wrap:wrap}
  .kpi-card{flex:1 1 50%;border-left:1px solid var(--border)}
  .content{padding:18px 16px 32px}
  .topbar{padding:14px 18px;flex-wrap:wrap;gap:10px}
  .form-row{grid-template-columns:1fr}
  .dashboard-grid,.trat-grid,.hc-grid,.rep-grid{grid-template-columns:1fr}
}

/* ── HERO: PRÓXIMA CITA (dashboard) ──────────────────────────────────────── */
.hero-next{background:linear-gradient(135deg,rgba(44,55,64,.65) 0%,rgba(56,67,77,.55) 100%);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid rgba(255,255,255,.1);border-radius:var(--radius3);padding:26px 30px;margin-bottom:22px;color:#F7F4EC;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow-glass)}
.hero-eyebrow{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold3);margin-bottom:8px;opacity:.9}
.hero-name{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.15}
.hero-meta{font-size:12.5px;color:#C9D1D8;margin-top:5px}
.hero-countdown{margin-left:auto;text-align:right;flex-shrink:0}
.hero-countdown-num{font-family:var(--display);font-size:34px;font-weight:600;color:var(--gold3);line-height:1}
.hero-countdown-label{font-size:10.5px;color:#C9D1D8;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.hero-actions{display:flex;gap:8px;flex-shrink:0}
.hero-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#F7F4EC;padding:8px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:background .15s}
.hero-btn:hover{background:rgba(255,255,255,.2)}
.hero-empty{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius3);padding:22px 28px;margin-bottom:22px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-card)}
.hero-empty-icon{font-size:26px}
.hero-empty-text{font-size:13px;color:var(--text2)}

/* ── BÚSQUEDA GLOBAL (topbar) ────────────────────────────────────────────── */
.global-search{position:relative;width:230px}
.global-search input{width:100%;padding:8px 14px 8px 32px;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:20px;font-size:12.5px;font-family:'Instrument Sans',sans-serif;color:var(--text);outline:none;transition:border-color .15s,width .15s}
.global-search input:focus{border-color:var(--gold);width:280px}
.global-search input::placeholder{color:var(--text3)}
.global-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text3);pointer-events:none}
.global-search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 12px 28px rgba(44,55,64,.16);overflow:hidden;z-index:300;max-height:280px;overflow-y:auto}
.gsr-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}
.gsr-item:last-child{border-bottom:none}
.gsr-item:hover{background:rgba(201,164,82,.06)}
.gsr-empty{padding:16px;text-align:center;font-size:12px;color:var(--text3)}

/* ── POPOVER DE CITA (agenda) ────────────────────────────────────────────── */
.event-popover{position:fixed;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius2);box-shadow:0 16px 36px rgba(44,55,64,.2);padding:14px;z-index:400;width:220px}
.event-popover-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.event-popover-proc{font-size:11.5px;color:var(--text3);margin-bottom:12px}
.event-popover-actions{display:flex;flex-direction:column;gap:4px}
.event-popover-actions button{display:flex;align-items:center;gap:8px;background:transparent;border:none;text-align:left;padding:7px 8px;border-radius:6px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:background .12s,color .12s}
.event-popover-actions button:hover{background:rgba(201,164,82,.08);color:var(--gold2)}
.event-popover-actions button.danger:hover{background:rgba(177,78,72,.08);color:var(--red)}

/* ── ALERTA DE ALERGIAS (Historia Clínica) ───────────────────────────────── */
.alert-banner{display:flex;align-items:center;gap:10px;background:rgba(193,114,104,.14);border:1px solid rgba(193,114,104,.4);border-radius:var(--radius);padding:11px 16px;margin-bottom:14px;font-size:12.5px;color:#E8B3AC}
.alert-banner strong{color:#F0958A}
.alert-banner-icon{font-size:15px;flex-shrink:0}

/* ── LÍNEA DE TIEMPO UNIFICADA (Historia Clínica) ────────────────────────── */
.tl-wrap{padding-left:4px}
.tl-item{position:relative;padding:0 0 22px 24px;border-left:1.5px solid var(--border);margin-left:4px}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0}
.tl-dot{position:absolute;left:-6.5px;top:2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg3)}
.tl-dot.cita{background:var(--blue)}
.tl-dot.consulta{background:var(--gold)}
.tl-dot.consentimiento{background:var(--green)}
.tl-dot.pago{background:var(--purple)}
.tl-date{font-size:10.5px;color:var(--gold);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px}
.tl-title{font-size:13.5px;font-weight:500;color:var(--text)}
.tl-sub{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.5}

/* ── PIPELINE DE PACIENTES (Lead → Prospecto → Paciente) ─────────────────── */
.pipeline-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pipeline-col{background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius2);padding:14px;min-height:120px}
.pipeline-col-header{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--text);margin-bottom:2px}
.pipeline-col-count{background:var(--bg4);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--gold);font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:20px}
.pipeline-col-hint{font-size:10.5px;color:var(--text3);margin-bottom:12px}
.pipeline-col-body{display:flex;flex-direction:column;gap:8px}
.pipeline-card{background:var(--bg3);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);padding:11px}
.pipeline-empty{text-align:center;font-size:11.5px;color:var(--text3);padding:18px 0;border:1px dashed var(--border);border-radius:var(--radius)}
.etapa-badge{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:500}
.etapa-lead{background:rgba(163,171,175,.18);color:var(--text2)}
.etapa-paciente{background:rgba(198,160,90,.18);color:var(--gold)}
@media(max-width:1080px){.pipeline-board{grid-template-columns:1fr}}

/* ── BUSCADOR DE PACIENTE (reemplaza el desplegable en formularios) ─────── */
.patsearch-wrap{position:relative}
.patsearch-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 12px 28px rgba(0,0,0,.3);overflow:hidden;z-index:250;max-height:240px;overflow-y:auto}
.patsearch-item{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}
.patsearch-item:last-child{border-bottom:none}
.patsearch-item:hover{background:rgba(198,160,90,.08)}
.patsearch-empty{padding:14px;text-align:center;font-size:12px;color:var(--text3)}

/* v3 */
.stepper{display:flex;gap:4px;margin:14px 0 16px;flex-wrap:wrap}
.stp{flex:1;min-width:64px;text-align:center;font-size:10.5px;color:var(--text3);padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--bg3)}
.stp span{display:block;font-weight:600;font-size:12px;margin-bottom:2px}
.stp.on{color:var(--gold);border-color:var(--border2)}
.stp.cur{background:rgba(201,164,82,.16);color:var(--text)}
.cita-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cal-event.ce-cancelado,.cal-event.ce-no_asistio{opacity:.45;text-decoration:line-through}
.cal-event.ce-completado{opacity:.8}
.mas-op{margin:6px 0 4px;border-top:1px solid var(--border);padding-top:8px}
.mas-op summary{cursor:pointer;font-size:12px;color:var(--gold);font-weight:500;list-style:none;padding:6px 0}
.mas-op summary::-webkit-details-marker{display:none}
.mas-op summary::before{content:'＋  '}
.mas-op[open] summary::before{content:'－  '}
.dia-fila{display:flex;gap:6px;align-items:stretch;border-bottom:1px solid var(--border);min-height:48px;cursor:pointer}
.dia-fila:last-child{border-bottom:none}
.dia-fila:hover{background:rgba(201,164,82,.05)}
.dia-hora{width:58px;flex:none;padding:14px 8px 0;font-size:11px;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}
.dia-fila.media .dia-hora{opacity:.55}
.dia-celda{flex:1;padding:5px 8px 5px 0;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.dia-libre{font-size:11px;color:var(--text3);opacity:.28}
.dia-fila:hover .dia-libre{opacity:1;color:var(--gold)}
.cal-event.ev-dia{display:flex;gap:10px;align-items:center;padding:9px 11px;flex-wrap:wrap;margin-bottom:0}
.cal-event.ev-dia .cal-event-name{font-size:13px}
.cal-event.ev-dia .cal-event-proc{font-size:11px}
.cal-event.ev-green{background:rgba(63,143,115,.14);border-left-color:var(--green)}
.cal-event.ev-blue{background:rgba(91,141,239,.12);border-left-color:#5B8DEF}
.cal-libre{cursor:pointer}
.cal-libre:hover{background:rgba(201,164,82,.09)}
.rr-sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#1B2128;border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.rr-op{padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border)}
.rr-op:last-child{border-bottom:none}
.rr-op span{color:var(--text3);font-size:11px}
.rr-op.rr-nuevo{color:var(--gold);font-weight:500}
.campo-error{border-color:var(--red)!important}
.menu-lista{display:flex;flex-direction:column;gap:6px}
.menu-lista button{text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:13px 14px;font:500 13px Instrument Sans,sans-serif;cursor:pointer}
.menu-lista button:hover{border-color:var(--border2)}
#tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:400;background:#12161B;border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
#tabbar button{flex:1;background:none;border:none;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;font-size:19px;line-height:1.1;cursor:pointer;filter:grayscale(1);opacity:.7}
#tabbar button span{font:500 10px Instrument Sans,sans-serif}
#tabbar button.active{color:var(--gold);filter:none;opacity:1}
@media(max-width:760px){
  .hero-next{flex-direction:column;align-items:flex-start!important;gap:14px}
  .hero-actions{flex-wrap:wrap}
  .topbar{flex-wrap:wrap;gap:10px;height:auto;padding-top:10px;padding-bottom:10px}
  .topbar-right{flex-wrap:wrap;gap:8px}
  .calendar-grid{min-width:640px}
  .card:has(>.calendar-grid){overflow-x:auto!important}
  .agenda-item{flex-wrap:wrap}
  .kpi-grid{grid-template-columns:1fr 1fr!important}
  .presup-card{flex-wrap:wrap}
  .modal-actions{flex-wrap:wrap}
  .cal-event.ev-dia>div:first-child{flex:1 1 100%}
  #sidebar{display:none!important}
  #tabbar{display:flex}
  .content{padding-bottom:92px!important}
  #fecha-hoy{display:none}
  .toast{bottom:84px!important}
}

/* ═══ v5 · TEMA PRO: espacio de trabajo claro, tinta marina, bronce solo como marca ═══ */
:root{
  --ink:#0F1B26;--display:'Instrument Sans',system-ui,sans-serif;
  --gold:#8A5A0B;--gold2:#6E4708;--gold3:#D9B36A;--goldline:#D9B36A;
  --bg:#EEF1F4;--bg2:#FFFFFF;--bg3:#FFFFFF;--bg4:#E8EDF2;
  --navy:#0F1B26;
  --text:#111C27;--text2:#4A5663;--text3:#7C8794;
  --border:#E1E6EB;--border2:#CBD3DB;
  --green:#1F8A5B;--blue:#2F6FB3;--red:#C2413A;--purple:#6B5FB5;
  --radius:8px;--radius2:12px;--radius3:14px;--blur:0px;
  --shadow-card:0 1px 2px rgba(16,28,39,.05);--shadow-glass:0 12px 32px rgba(16,28,39,.12);
}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;letter-spacing:-.003em}
body::before{display:none}
button,input,select,textarea{font-family:inherit!important}
*:focus-visible{outline:2px solid #2F6FB3;outline-offset:2px}
::-webkit-scrollbar-thumb{background:#C5CDD6}
.ico{width:18px;height:18px;flex:none;display:block}

/* Barra lateral */
#sidebar{background:var(--ink);border-right:none}
.logo-area{border-bottom:1px solid rgba(255,255,255,.08);padding:22px 20px 18px}
.logo-mark{color:#D9B36A;border-color:rgba(217,179,106,.55);font-family:'Cormorant Garamond',serif}
.logo-title{color:#fff;font-family:'Cormorant Garamond',serif}
.logo-sub{color:#8795A3;text-transform:none;letter-spacing:.1px;font-size:11px}
nav{padding:14px 0}
.nav-section{color:#6F7E8D;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600;padding:14px 22px 6px}
.nav-item{color:#B7C2CD;border-left:none;margin:1px 10px;padding:9px 12px;border-radius:8px;font-size:13.5px;gap:10px}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:none}
.nav-icon{width:18px;height:18px;opacity:1;display:inline-flex}
.nav-badge{background:#D9B36A;color:var(--ink);border:none;font-weight:700;padding:1px 7px}
.sidebar-footer{border-top:1px solid rgba(255,255,255,.08)}
.user-name{color:#fff}.user-role{color:#8795A3}
.user-avatar{background:rgba(255,255,255,.08);border:none;color:#D9B36A}

/* Barra superior y botones */
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 28px}
.page-title{font-size:20px;font-weight:650;letter-spacing:-.015em;color:var(--text)}
.content{padding:22px 28px 40px}

.toast{background:var(--ink);color:#fff;border:none;border-radius:10px;box-shadow:0 10px 30px rgba(15,27,38,.3)}

.tab-bar{background:#E3E8ED;border-radius:9px;padding:3px}

.periodo-btn{border-radius:8px;background:#fff;border-color:var(--border2);color:var(--text2)}

<script>
// ── FIREBASE SYNC ─────────────────────────────────────────────────────────────
function saveLocal(k,d){try{localStorage.setItem('epc_'+k,JSON.stringify(d));}catch(e){}}
function loadLocal(k){try{const d=localStorage.getItem('epc_'+k);return d?JSON.parse(d):null;}catch(e){return null;}}

// ═══════════════════════════════════════════════════════════════════════════
// CAPA DE DATOS — Firestore es la ÚNICA fuente de verdad.
//  • Cada cambio se escribe documento por documento (crear / modificar / BORRAR).
//  • Cada equipo escucha la base de datos en tiempo real (onSnapshot): lo que se
//    hace en Venezuela aparece en España al instante, y viceversa.
//  • Un equipo solo envía lo que ÉL cambió: nunca reescribe la colección entera,
//    así un equipo con datos viejos no puede resucitar citas borradas ni pisar
//    cambios de otro.
// ═══════════════════════════════════════════════════════════════════════════
const COLECCIONES=['Pacientes','Citas','Movimientos','Presupuestos','Formaciones','HistoriaClinica','Config','Inventario'];
const SYNC={arch:{},base:{},last:{},raw:{},docIds:{},anomalias:{},loaded:{},fromCache:{},pending:0,error:null,persist:false,migrated:false};
const FOTO_CACHE={};
const LIMITE_DOC=950000;      // Firestore rechaza documentos > 1 MB
const AVISO_DOC=700000;

function sanitizeDoc(o){return JSON.parse(JSON.stringify(o));}
function canon(v){
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}

// Guarda en Firestore SOLO las diferencias entre lo que hay en pantalla y lo último
// que llegó de la base de datos. opts.partial = no borra documentos ausentes (Config).
async function syncToSheet(col,arr,opts){
  opts=opts||{};
  const base=SYNC.base[col]||(SYNC.base[col]={});
  const next={};
  (arr||[]).forEach(item=>{
    if(!item||item.id===undefined||item.id===null||item.id==='')return;
    next[String(item.id)]=sanitizeDoc(item);
  });
  const ops=[];
  Object.keys(next).forEach(id=>{const s=canon(next[id]);if(base[id]!==s)ops.push({t:'set',id,data:next[id],s});});
  // v3 · NADA SE BORRA: un registro que desaparece de la pantalla se ARCHIVA
  // (archivado:true) y sigue en la base de datos; se restaura desde "Archivados".
  const arch=SYNC.arch[col]||(SYNC.arch[col]={});
  if(!opts.partial)Object.keys(base).forEach(id=>{
    if((id in next)||arch[id])return;
    const prev=(SYNC.last[col]||[]).find(d=>String(d.id)===id);
    if(!prev)return;
    const data=sanitizeDoc({...prev,archivado:true,archivadoEl:new Date().toISOString()});
    ops.push({t:'set',id,data,s:canon(data),arch:true});
  });
  if(!ops.length)return true;

  // CANDADO DE SEGURIDAD: ninguna acción de la app borra más de 1 registro a la vez,
  // salvo que se autorice explícitamente (eliminar paciente con sus citas).
  const borrados=ops.filter(o=>o.arch).length;
  const maxBorrados=opts.maxBorrados!==undefined?opts.maxBorrados:1;
  if(borrados>maxBorrados){
    console.error('[EPC] Borrado masivo bloqueado',col,borrados);
    revertirColeccion(col);
    alertaDatos('Operación bloqueada por seguridad',`La app intentó archivar <strong>${borrados} registros</strong> de <strong>${col}</strong> en una sola acción. Esto no es normal, así que se bloqueó y <strong>no se cambió nada</strong>. Recarga la app; si vuelve a ocurrir, avísame.`);
    return false;
  }

  const grande=ops.find(o=>o.t==='set'&&!o.arch&&o.s.length>LIMITE_DOC);
  if(grande){
    revertirColeccion(col);
    alertaDatos('No se guardó',`El registro <strong>${grande.id}</strong> de <strong>${col}</strong> supera el tamaño máximo permitido por la base de datos (normalmente por demasiadas fotos en una misma historia clínica).<br><br><strong>El último cambio NO se guardó.</strong> Quita alguna foto de esa consulta e inténtalo de nuevo.`);
    return false;
  }
  const cerca=ops.find(o=>o.t==='set'&&o.s.length>AVISO_DOC);
  if(cerca)setTimeout(()=>showToast('⚠ Esta historia clínica está cerca del límite de fotos'),3400);

  const mapa=SYNC.docIds[col]||(SYNC.docIds[col]={});
  ops.forEach(o=>{o.doc=mapa[o.id]||o.id;});
  ops.forEach(o=>{base[o.id]=o.s;mapa[o.id]=o.doc;if(o.arch)arch[o.id]=true;});
  SYNC.pending++;updateSyncBadge();
  try{
    for(let i=0;i<ops.length;i+=400){
      const b=db.batch();
      ops.slice(i,i+400).forEach(o=>{
        const ref=db.collection(col).doc(o.doc);
        if(opts.partial)b.set(ref,o.data,{merge:true});else b.set(ref,o.data);
      });
      await b.commit();
    }
    SYNC.pending--;updateSyncBadge();
    return true;
  }catch(e){
    SYNC.pending--;
    ops.forEach(o=>{delete base[o.id];if(o.arch)delete arch[o.id];});
    reportarErrorDatos(col,e,true);
    return false;
  }
}

// Rellena campos faltantes SOLO en memoria para que un registro incompleto no rompa
// la pantalla. No se escribe nada en Firebase por esto.
function normalizarDoc(col,d){
  const str=k=>{if(d[k]===undefined||d[k]===null)d[k]='';else if(typeof d[k]!=='string')d[k]=String(d[k]);};
  if(col==='Citas'){['patient','proc','time','fecha','consultorio','doc'].forEach(str);if(!statusMap[d.status])d.status='pendiente';}
  else if(col==='Pacientes'){['name'].forEach(str);if(!Array.isArray(d.tags))d.tags=d.tags?[String(d.tags)]:[];}
  else if(col==='Movimientos'){['desc','fecha','tipo'].forEach(str);}
  else if(col==='Inventario'){['producto','lote'].forEach(str);}
  else if(col==='Presupuestos'){['paciente','fecha'].forEach(str);if(!Array.isArray(d.items))d.items=[];}
  else if(col==='HistoriaClinica'){
    if(!Array.isArray(d.consultas))d.consultas=[];
    if(!Array.isArray(d.consentimientos))d.consentimientos=[];
    d.consultas.forEach(c=>{if(c&&typeof c==='object')['fecha','proc','nota','doc'].forEach(k=>{if(c[k]===undefined||c[k]===null)c[k]='';else if(typeof c[k]!=='string')c[k]=String(c[k]);});});
  }
  return d;
}
function aplicarColeccion(col,docs){
  docs=sanitizeDoc(docs); // copia independiente
  STATE.archivados[col]=docs.filter(d=>d&&d.archivado===true);
  docs=docs.filter(d=>!(d&&d.archivado===true));
  const num=id=>{const m=String(id).match(/\d+/g);return m?Number(m.join('').slice(0,15)):0;};
  const porIdDesc=(a,b)=>num(b.id)-num(a.id);
  if(col==='Pacientes')STATE.patients=docs.slice().sort(porIdDesc);
  else if(col==='Citas')STATE.appointments=docs.slice().sort((a,b)=>(a.fecha||'')===(b.fecha||'')?String(a.time||'').localeCompare(String(b.time||'')):String(a.fecha||'').localeCompare(String(b.fecha||'')));
  else if(col==='Movimientos')STATE.movimientos=docs.slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||porIdDesc(a,b));
  else if(col==='Presupuestos')STATE.presupuestos=docs.slice().sort(porIdDesc);
  else if(col==='Formaciones')STATE.formaciones=docs.slice();
  else if(col==='Inventario')STATE.inventario=docs.slice().sort(porIdDesc);
  else if(col==='HistoriaClinica')STATE.hcData=hcArrayToMap(docs);
  else if(col==='Config'){
    const c=docs.find(x=>x.id==='main');STATE.bcvRate=c?Number(c.bcvRate)||0:0;STATE.cierres=(c&&c.cierres)||{};
    STATE.bcvFecha=c&&c.bcvFecha||'';STATE.bcvFuente=c&&c.bcvFuente||'';
    const pr=docs.find(x=>x.id==='precios');STATE.precios=(pr&&pr.map)||{};
    const rc=docs.find(x=>x.id==='recetas');STATE.recetas=(rc&&rc.map)||{};
    const ob=docs.find(x=>x.id==='obligaciones');STATE.obligaciones=(ob&&Array.isArray(ob.lista))?ob.lista:[];
    const sv=docs.find(x=>x.id==='servicios');STATE.serviciosExtra=(sv&&Array.isArray(sv.lista))?sv.lista:[];STATE.serviciosOcultos=(sv&&Array.isArray(sv.ocultos))?sv.ocultos:[];
    reconstruirServicios();
  }
  actualizarBadgeAgenda();
}
function revertirColeccion(col){
  if(SYNC.last[col]){aplicarColeccion(col,SYNC.last[col]);programarRefresco();}
}

function escucharColeccion(col){
  db.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{
    SYNC.fromCache[col]=snap.metadata.fromCache;
    const primera=!SYNC.loaded[col];
    if(primera||snap.docChanges().length){
      // Identidad = documento real de Firestore. Si un registro tiene un campo "id"
      // distinto de su documento (p.ej. datos cargados por script) se respeta ese id
      // para no romper vínculos, pero se escribe siempre en SU documento original.
      // Si dos documentos comparten el mismo "id", el segundo se distingue por su
      // documento para que nunca se confundan ni se borren juntos.
      const docs=[],mapa={},vistos={};let anom=0;
      SYNC.raw[col]=snap.docs.map(d=>({docId:d.id,data:d.data()}));
      snap.docs.forEach(d=>{
        const data=d.data();
        let id=(data.id!==undefined&&data.id!==null&&data.id!=='')?data.id:d.id;
        if(vistos[String(id)]){id=d.id;anom++;}
        if(vistos[String(id)]){id=d.id+'#'+docs.length;anom++;}
        if(String(id)!==d.id)anom++;
        vistos[String(id)]=true;mapa[String(id)]=d.id;
        docs.push(normalizarDoc(col,sanitizeDoc({...data,id})));
      });
      SYNC.docIds[col]=mapa;SYNC.anomalias[col]=anom;
      const ar={};docs.forEach(d=>{if(d.archivado===true)ar[String(d.id)]=true;});SYNC.arch[col]=ar;
      SYNC.last[col]=docs;
      const base={};docs.forEach(d=>{base[d.id]=canon(sanitizeDoc(d));});
      SYNC.base[col]=base;
      aplicarColeccion(col,docs);
      SYNC.loaded[col]=true;
      if(primera)verificarCargaInicial();else programarRefresco();
    }
    if(SYNC.error&&SYNC.error.lectura&&!snap.metadata.fromCache){SYNC.error=null;ocultarBannerDatos();}
    vincularCitasHuerfanas();
    updateSyncBadge();
  },err=>{reportarErrorDatos(col,err,false);});
}

  else if(code==='resource-exhausted')msg='Se alcanzó el límite de uso de Firebase. Los cambios pueden no estar guardándose.';
  else msg=`${escritura?'No se pudo guardar':'No se pudo leer'} <strong>${col}</strong> (${code||'error desconocido'}).${escritura?' <strong>El último cambio no quedó guardado.</strong>':''}`;

// ── VÍNCULO CITA ↔ PACIENTE (por ID, no por nombre escrito) ────────────────────
function normName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();}
function pacienteDeCita(a){
  if(!a)return null;
  if(a.patientId){const p=STATE.patients.find(x=>x.id===a.patientId);if(p)return p;}
  const n=normName(a.patient);if(!n)return null;
  const c=STATE.patients.filter(p=>normName(p.name)===n);
  // Si hay 2+ pacientes con el mismo nombre NO se adivina: la cita queda "por vincular"
  // (así, borrar un paciente duplicado nunca arrastra citas que no son suyas).
  return c.length===1?c[0]:null;
}
function citasDePaciente(p){
  if(!p)return[];
  return STATE.appointments.filter(a=>{const q=pacienteDeCita(a);return q&&q.id===p.id;});
}
// Una sola vez por sesión, cuando hay datos reales del servidor: a las citas antiguas
// (guardadas solo con el nombre) se les asigna el ID del paciente si el nombre coincide sin ambigüedad.
function vincularCitasHuerfanas(){
  if(SYNC.migrated||!SYNC.loaded.Pacientes||!SYNC.loaded.Citas||SYNC.fromCache.Pacientes||SYNC.fromCache.Citas)return;
  SYNC.migrated=true;
  let cambios=0;
  STATE.appointments.forEach(a=>{
    if(a.patientId&&STATE.patients.some(p=>p.id===a.patientId))return;
    const n=normName(a.patient);
    const c=STATE.patients.filter(p=>normName(p.name)===n);
    if(c.length===1){a.patientId=c[0].id;cambios++;}
  });
  if(cambios)syncToSheet('Citas',STATE.appointments);
}
function abrirVincularCita(citaId){
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  openModal(`<div class="modal-title">Vincular cita a un paciente</div>
  <div style="background:rgba(201,164,82,.08);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:var(--text2);line-height:1.55">La cita de <strong style="color:var(--text)">${a.patient||'(sin nombre)'}</strong> — ${a.fecha?fmtDateVET(a.fecha):''} ${a.time||''} · ${a.proc||''} — no está asociada a ningún paciente registrado (el paciente fue eliminado o su nombre se escribió distinto). Elige el paciente correcto o créalo.</div>
  <div class="form-group"><label class="form-label">Paciente</label>${buildPacienteSelect('fv-pat','')}</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn-outline" onclick="crearPacienteDesdeCita('${citaId}')">Crear paciente nuevo</button><button class="btn btn-gold" onclick="guardarVinculoCita('${citaId}')">Vincular</button></div>`);
}

// ── TASA BCV (conversión USD↔Bs real, en vez de dos cajas que nunca se tocan) ──
function montoEnUSD(m){
  // Cada pago en Bs se convierte con la tasa del DÍA en que se registró (si la tiene guardada)
  const tasa=Number(m.tasaBCV)>0?Number(m.tasaBCV):STATE.bcvRate;
  if(m.moneda==='BS')return tasa>0?Number(m.monto)/tasa:0;
  return Number(m.monto);
}
function guardarTasaBCV(){
  const v=parseFloat($('bcv-input')?.value);
  if(isNaN(v)||v<=0){showToast('Ingresa una tasa válida');return;}
  STATE.bcvRate=v;STATE.bcvFecha=todayVET();STATE.bcvFuente='manual';
  syncToSheet('Config',[{id:'main',bcvRate:v,bcvFecha:todayVET(),bcvFuente:'manual'}],{partial:true});
  showToast(`Tasa BCV actualizada: ${v} Bs/$`);renderCaja();
}

// ── TASA BCV AUTOMÁTICA: se busca sola una vez al día (fuente principal + respaldo).
// Si ya se cargó hoy (automática o a mano) no se toca. Si falla, se mantiene la última conocida.
const FUENTES_BCV=[
  ['BCV · dolarapi',async()=>{const r=await fetch('https://ve.dolarapi.com/v1/dolares/oficial',{cache:'no-store'});const j=await r.json();return Number(j.promedio);}],
  ['BCV · chitty-bcv',async()=>{const r=await fetch('https://chitty400.github.io/chitty-bcv-api/latest.json',{cache:'no-store'});const j=await r.json();return Number(j.tasa_bcv);}],
];
let _bcvEnCurso=false;
async function actualizarTasaBCVAuto(forzar){
  if(_bcvEnCurso)return false;
  if(!forzar&&STATE.bcvFecha===todayVET()&&STATE.bcvRate>0)return true;
  _bcvEnCurso=true;
  try{
    for(const[nombre,fn]of FUENTES_BCV){
      let tasa=0;try{tasa=await fn();}catch(e){continue;}
      if(!(tasa>0))continue;
      // Control de cordura: un salto de más del 50% en un día se considera un dato erróneo
      if(STATE.bcvRate>0&&(tasa>STATE.bcvRate*1.5||tasa<STATE.bcvRate/1.5)){console.warn('[BCV] tasa descartada',nombre,tasa);continue;}
      tasa=Math.round(tasa*10000)/10000;
      STATE.bcvRate=tasa;STATE.bcvFecha=todayVET();STATE.bcvFuente=nombre;
      await syncToSheet('Config',[{id:'main',bcvRate:tasa,bcvFecha:todayVET(),bcvFuente:nombre}],{partial:true});
      if(forzar)showToast(`Tasa BCV actualizada: ${tasa} Bs/$`);
      if(STATE.view==='caja')programarRefresco();
      return true;
    }
    if(forzar)showToast('No se pudo obtener la tasa BCV automáticamente. Ingrésala a mano.');
    return false;
  }finally{_bcvEnCurso=false;}
}
setInterval(()=>{if(SYNC.inicioHecho)actualizarTasaBCVAuto(false);},60*60*1000);

// ── RESPALDO AUTOMÁTICO (evita depender solo de "confiar" en que Firebase no falle) ──
async function exportarRespaldo(silent){
  try{
    if(!silent)showToast('Preparando respaldo…');
    const data={exportadoEl:new Date().toISOString(),formato:'EPC-firestore-v2',colecciones:{}};
    COLECCIONES.forEach(c=>{data.colecciones[c]=(SYNC.raw[c]||[]).map(r=>({docId:r.docId,data:r.data}));});
    try{const s=await db.collection('Fotos').get();data.colecciones.Fotos=s.docs.map(d=>({docId:d.id,data:d.data()}));}
    catch(e){data.colecciones.Fotos=[];data.avisoFotos='No se pudieron incluir las fotos: '+(e&&e.code||'');}
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`EPC-respaldo-${todayVET()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    saveLocal('lastBackup',{fecha:todayVET()});
    if(!silent)showToast('Respaldo descargado');
  }catch(e){if(!silent)showToast('No se pudo generar el respaldo');}
}
function checkAutoBackup(){
  try{
    const lb=loadLocal('lastBackup');
    if(!lb||!lb.fecha){exportarRespaldo(true);showToast('Respaldo automático descargado (primera vez)');return;}
    const hoy=todayVET();
    const dias=Math.round((new Date(hoy+'T12:00:00')-new Date(lb.fecha+'T12:00:00'))/86400000);
    if(dias>=7){exportarRespaldo(true);showToast('Respaldo automático descargado (han pasado '+dias+' días)');}
  }catch(e){}
}

// ── AGENDA ────────────────────────────────────────────────────────────────────
function renderAgenda(){
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const todayVet=nowVET();
  const weekStart=new Date(todayVet);
  weekStart.setDate(todayVet.getDate()-todayVet.getDay()+(agendaWeekOffset*7));
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
  const times=['07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];
  const hoy=todayVET();
  const evMap={};
  STATE.appointments.forEach(a=>{
    const dt=new Date(a.fecha+'T12:00:00');
    const diff=Math.round((dt-weekStart)/86400000);
    if(diff<0||diff>6)return;
    let ti=times.indexOf(a.time);
    if(ti<0){
      // Cita a una hora fuera de la grilla estándar: la ubicamos en el slot más cercano para que NUNCA desaparezca.
      const[ah,am]=(a.time||'00:00').split(':').map(Number);
      const targetMin=ah*60+(am||0);
      let best=0,bestDiff=Infinity;
      times.forEach((t,i)=>{const[th,tm]=t.split(':').map(Number);const d=Math.abs(th*60+tm-targetMin);if(d<bestDiff){bestDiff=d;best=i;}});
      ti=best;
    }
    if(!evMap[diff])evMap[diff]={};
    if(!evMap[diff][ti])evMap[diff][ti]=[];
    evMap[diff][ti].push(a);
  });
  const ws=weekStart.toISOString().split('T')[0];
  const we=weekEnd.toISOString().split('T')[0];
  const citasSemana=STATE.appointments.filter(a=>a.fecha>=ws&&a.fecha<=we);
  const label=weekStart.toLocaleDateString('es-VE',{day:'2-digit',month:'short',timeZone:'America/Caracas'})+' – '+weekEnd.toLocaleDateString('es-VE',{day:'2-digit',month:'short',year:'numeric',timeZone:'America/Caracas'});
  $('content-area').innerHTML=`
  <div class="agenda-controls">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="icon-btn" onclick="agendaWeekOffset--;renderAgenda()">‹ Anterior</button>
      <div class="date-display">${label}</div>
      <button class="icon-btn" onclick="agendaWeekOffset++;renderAgenda()">Siguiente ›</button>
      ${agendaWeekOffset!==0?`<button class="icon-btn btn-sm" onclick="agendaWeekOffset=0;renderAgenda()">Hoy</button>`:''}
    </div>
    <span class="tz-badge">VET</span>
    <div style="display:flex;gap:8px;margin-left:auto;align-items:center">
      <span style="font-size:11px;color:var(--text3)">Dr. Higuerey</span>
      <button class="btn btn-gold btn-sm" onclick="openNewCita()">+ Nueva cita</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">
    <div class="calendar-grid">
      <div class="cal-header" style="background:var(--bg2)"></div>
      ${days.map((d,i)=>{const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+i);const isT=dt.toISOString().split('T')[0]===hoy;return`<div class="cal-header${isT?' today':''}">${d}<br><span style="font-size:14px;font-weight:600">${dt.getDate()}</span></div>`;}).join('')}
      ${times.map((t,ti)=>{const isHalf=t.endsWith(':30');return`<div class="cal-time${isHalf?' cal-time-half':''}">${isHalf?'':t}</div>${days.map((d,di)=>{
        const dt=new Date(weekStart);dt.setDate(weekStart.getDate()+di);
        const isT=dt.toISOString().split('T')[0]===hoy;
        const evs=(evMap[di]||{})[ti]||[];
        return`<div class="cal-cell${isT?' today-col':''}${isHalf?' cal-cell-half':''}">${evs.map(ev=>`<div class="cal-event ce-${ev.status}" onclick="abrirCita('${ev.id}')"><div class="cal-event-name">${ev.time} ${ev.patient.split(' ')[0]}</div><div class="cal-event-proc">${ev.proc.split('—')[0].trim().slice(0,16)}</div></div>`).join('')}</div>`;
      }).join('')}`;}).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Detalle y acciones — ${citasSemana.length} citas esta semana</div>
    ${citasSemana.length?citasSemana.sort((a,b)=>a.fecha===b.fecha?a.time.localeCompare(b.time):a.fecha.localeCompare(b.fecha)).map(a=>`
    <div class="agenda-item">
      <div style="min-width:80px"><div class="agenda-time">${a.time} <span style="font-size:9px;color:var(--text3)">VET</span></div><div style="font-size:10px;color:var(--text3)">${fmtDateVET(a.fecha)}</div></div>
      <span class="agenda-dot dot-${a.status==='en_consulta'?'gold':a.status==='confirmado'?'green':a.status==='completado'?'blue':'gray'}"></span>
      <div style="flex:1;cursor:pointer" onclick="abrirCita('${a.id}')"><div class="agenda-name">${esc(a.patient)}</div><div class="agenda-proc">${esc(a.proc)} · ${esc(a.consultorio)} · ${esc(a.doc)}</div></div>
      ${filaAccionesCita(a)}
    </div>`).join(''):`<div style="color:var(--text3);text-align:center;padding:20px;font-size:13px">Sin citas esta semana.</div>`}
  </div>`;
}

function closeEventPopover(){const p=$('event-popover');if(p)p.remove();}
function showEventPopover(evt,citaId){
  evt.stopPropagation();closeEventPopover();
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const rect=evt.target.closest('.cal-event').getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='event-popover';pop.id='event-popover';
  pop.style.top=Math.min(rect.bottom+6,window.innerHeight-220)+'px';
  pop.style.left=Math.min(rect.left,window.innerWidth-236)+'px';
  pop.innerHTML=`
    <div class="event-popover-name">${a.patient}</div>${pacienteDeCita(a)?'':`<div style="font-size:11px;color:var(--red);margin:2px 0 6px">⚠ No vinculada a un paciente registrado</div>`}
    <div class="event-popover-proc">${a.proc} · ${a.time} VET</div>
    <div class="event-popover-actions">
      ${pacienteDeCita(a)?`<button onclick="abrirHCDesdeCita('${a.id}');closeEventPopover()">Ver historia clínica</button>`:`<button onclick="abrirVincularCita('${a.id}');closeEventPopover()">Vincular a paciente</button>`}
      <button onclick="enviarRecordatorioWA('${a.id}');closeEventPopover()">Enviar recordatorio</button>
      <button onclick="cycleStatus('${a.id}');closeEventPopover()">↺ Cambiar estado</button>
      <button onclick="openRegistrarCobro('${a.patient}','${a.proc}');closeEventPopover()">Registrar cobro</button>
      <button class="danger" onclick="eliminarCita('${a.id}');closeEventPopover()">✕ Eliminar cita</button>
    </div>`;
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click',closeEventPopover,{once:true}),0);
}

function enviarRecordatorioWA(citaId){
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const p=pacienteDeCita(a);
  const tel=(p?.phone||'').replace(/\D/g,'');
  const msg=`Hola ${a.patient} 👋\n\nLe recordamos su cita en *Elite Plastic Center*:\n\n📅 *Fecha:* ${fmtDateVET(a.fecha)}\n🕐 *Hora:* ${a.time} VET\n💉 *Procedimiento:* ${a.proc}\n👨‍⚕️ *Médico:* ${a.doc}\n📍 C.C. Trinidad Tepuy, Consultorio 1-13, Baruta, Caracas\n\n¡Nos vemos pronto! ✨`;
  window.open(tel?`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  showToast('Abriendo WhatsApp…');
}

function cycleStatus(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const c=['pendiente','confirmado','en_consulta','completado','cancelado'];
  a.status=c[(c.indexOf(a.status)+1)%c.length];
  syncToSheet('Citas',STATE.appointments);
  showToast('Estado: '+statusMap[a.status].label);renderAgenda();
}

function abrirHCDesdeCita(citaId){
  const a=STATE.appointments.find(x=>x.id===citaId);if(!a)return;
  const p=pacienteDeCita(a);
  if(p){STATE.activeHCPatient=p.id;STATE.activeHCTab='consultas';showView('hc');setTimeout(()=>openNewConsulta(p.id),300);}
  else abrirVincularCita(citaId);
}

function eliminarCita(id){
  openModal(`<div class="modal-title">Archivar cita</div>
  <div style="background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.25);border-radius:var(--radius);padding:14px;margin-bottom:18px;font-size:13px;color:var(--text2)">¿Archivar esta cita? Sale de la agenda, pero no se borra: queda en Archivados y se puede restaurar.</div>
  <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--red);color:#fff;font-family:Instrument Sans,sans-serif;font-size:12px;padding:8px 18px;border-radius:var(--radius);cursor:pointer;border:none" onclick="confirmarEliminarCita('${id}')">Archivar</button></div>`);
}
function confirmarEliminarCita(id){
  STATE.appointments=STATE.appointments.filter(a=>a.id!==id);
  actualizarBadgeAgenda();
  syncToSheet('Citas',STATE.appointments);
  closeModal();showToast('Cita archivada');renderAgenda();
}

// ── PACIENTES ─────────────────────────────────────────────────────────────────
function renderPacientes(filter=''){
  const view=STATE.activePacientesView||'pipeline';
  let pts=filter?STATE.patients.filter(p=>(p.name||'').toLowerCase().includes(filter.toLowerCase())||(p.cedula||'').includes(filter)):STATE.patients;
  const nPend=STATE.patients.filter(fichaIncompleta).length;
  if(STATE.soloFichasPend)pts=pts.filter(fichaIncompleta);
  $('content-area').innerHTML=`
  <div class="section-header">
    <div class="section-title">Pacientes (${STATE.patients.length})${nPend?` <span onclick="toggleFichasPend()" style="font-family:Instrument Sans,sans-serif;font-size:11px;font-weight:600;color:#E6B04A;background:rgba(230,176,74,${STATE.soloFichasPend?'.28':'.12'});border:1px solid rgba(230,176,74,.4);border-radius:12px;padding:3px 10px;cursor:pointer;vertical-align:middle">${STATE.soloFichasPend?'✕ Ver todas':'⚠ '+nPend+' fichas por completar'}</span>`:''}</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="tab-bar" style="margin-bottom:0;width:auto">
        <div class="tab${view==='pipeline'?' active':''}" style="padding:8px 16px" onclick="setPacientesView('pipeline')">Pipeline</div>
        <div class="tab${view==='lista'?' active':''}" style="padding:8px 16px" onclick="setPacientesView('lista')">Lista</div>
      </div>
      <button class="btn-outline btn-sm" onclick="openNewPatient('lead')">+ Lead</button>
      <button class="btn btn-gold" onclick="openNewPatient('paciente')">+ Nuevo paciente</button>
    </div>
  </div>
  ${view==='pipeline'?buildPipelineBoard(pts,filter):buildPacientesLista(pts,filter)}`;
}

function buildPacientesLista(pts,filter){
  return`
  <div class="search-bar"><input class="search-input" placeholder="Buscar por nombre o cédula…" value="${filter}" oninput="renderPacientes(this.value)"></div>
  ${!STATE.patients.length?`<div class="card" style="text-align:center;padding:48px;color:var(--text3)"><div style="font-size:40px;opacity:.3;margin-bottom:12px"></div><div style="margin-bottom:16px">No hay pacientes registrados</div><button class="btn btn-gold" onclick="openNewPatient('paciente')">+ Registrar primer paciente</button></div>`:`
  <div class="card" style="padding:0;overflow:hidden">
    <table class="patients-table">
      <thead><tr><th>Paciente</th><th>Etapa</th><th>Cédula</th><th>Teléfono</th><th>Etiquetas</th><th>Última visita</th><th style="text-align:center">Procs.</th><th></th></tr></thead>
      <tbody>${pts.map(p=>`
      <tr>
        <td><div class="patient-name-cell"><div class="patient-avatar">${initials(p.name)}</div><div><div style="font-weight:500;color:var(--text)">${p.name}</div><div style="font-size:11px;color:var(--text3)">${p.email&&p.email!=='—'?p.email:''}</div>${badgeFichaPend(p)}</div></div></td>
        <td><span class="etapa-badge etapa-${p.etapa||'paciente'}">${etapaLabel(p.etapa||'paciente')}</span></td>
        <td style="color:var(--text2);font-size:12px">${p.cedula||'—'}</td>
        <td style="color:var(--text2);font-size:12px">${p.phone||''}</td>
        <td><div style="display:flex;gap:4px;flex-wrap:wrap">${(p.tags||[]).map(t=>`<span class="tag tag-${tagCls(t)}">${t}</span>`).join('')}</div></td>
        <td style="font-size:12px;color:var(--text2)">${p.lastVisit||'—'}</td>
        <td style="font-size:13px;font-weight:500;color:var(--gold);text-align:center">${p.procedures||0}</td>
        <td><div style="display:flex;gap:5px">
          <button class="icon-btn btn-sm" onclick="showView('hc');setTimeout(()=>openHCPatient('${p.id}'),50)">HC</button>
          <button class="icon-btn btn-sm" onclick="openEditarPaciente('${p.id}')">Editar</button>
          <button class="icon-btn btn-sm" onclick="openNewPresupuestoForPat('${p.id}')">Presup.</button>
          <button class="icon-btn btn-sm" style="color:var(--red)" onclick="confirmarEliminarPaciente('${p.id}','${p.name}')">✕</button>
        </div></td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`}`;
}

function setPacientesView(v){STATE.activePacientesView=v;renderPacientes();}
// Ficha por completar: sin cédula real (vacía, "—" o solo ceros) o sin teléfono válido
function fichaIncompleta(p){
  const ced=String(p.cedula||'').replace(/\D/g,'');
  const tel=String(p.phone||'').replace(/\D/g,'');
  return !ced||/^0+$/.test(ced)||tel.length<7;
}
function badgeFichaPend(p){
  return fichaIncompleta(p)?`<span onclick="event.stopPropagation();openEditarPaciente('${p.id}')" title="Faltan datos: cédula y/o teléfono" style="display:inline-block;margin-top:3px;font-size:10px;font-weight:600;color:#E6B04A;background:rgba(230,176,74,.12);border:1px solid rgba(230,176,74,.35);border-radius:10px;padding:1px 7px;cursor:pointer">⚠ Completar ficha</span>`:'';
}
function toggleFichasPend(){STATE.soloFichasPend=!STATE.soloFichasPend;renderPacientes();}
function etapaLabel(e){return{lead:'Lead',paciente:'Paciente'}[e]||'Paciente';}

// ── PIPELINE (Lead → Paciente) ──────────────────────────────────────────────
function buildPipelineBoard(pts,filter){
  const cols=[
    {key:'lead',label:'Lead',hint:'Contacto o cita agendada, sin consulta todavía'},
    {key:'paciente',label:'Paciente',hint:'Ya tuvo su primera consulta'},
  ];
  return`${filter?`<div class="search-bar"><input class="search-input" placeholder="Buscar por nombre o cédula…" value="${filter}" oninput="renderPacientes(this.value)"></div>`:''}
  <div class="pipeline-board">
    ${cols.map(col=>{
      const items=pts.filter(p=>col.key==='paciente'?(p.etapa||'paciente')==='paciente':(p.etapa||'paciente')!=='paciente');
      return`<div class="pipeline-col">
        <div class="pipeline-col-header"><span>${col.label}</span><span class="pipeline-col-count">${items.length}</span></div>
        <div class="pipeline-col-hint">${col.hint}</div>
        <div class="pipeline-col-body">
          ${items.length?items.map(p=>buildPipelineCard(p)).join(''):`<div class="pipeline-empty">Vacío</div>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function buildPipelineCard(p){
  const etapa=p.etapa||'paciente';
  const tel=(p.phone||'').replace(/\D/g,'');
  let accion='';
  if(etapa!=='paciente')accion=`<button class="btn btn-gold btn-sm" style="width:100%;margin-top:8px" onclick="showView('hc');setTimeout(()=>openNewConsulta('${p.id}'),100)">+ Primera consulta</button><div style="display:flex;gap:10px;justify-content:center;margin-top:5px"><span style="font-size:10.5px;color:var(--text3);cursor:pointer;text-decoration:underline" onclick="showView('agenda');setTimeout(()=>openNewCita('${p.id}'),100)">Agendar cita</span><span style="font-size:10.5px;color:var(--text3);cursor:pointer;text-decoration:underline" onclick="cambiarEtapa('${p.id}','paciente')">Marcar como Paciente</span></div>`;
  else accion=`<button class="btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="showView('hc');setTimeout(()=>openHCPatient('${p.id}'),50)">Ver historia clínica</button>`;
  return`<div class="pipeline-card">
    <div style="display:flex;align-items:center;gap:9px">
      <div class="patient-avatar">${initials(p.name)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div style="font-size:11px;color:var(--text3)">${p.phone&&p.phone!=='—'?p.phone:'Sin teléfono'}</div>${badgeFichaPend(p)}</div>
    </div>
    ${accion}
    <div style="display:flex;gap:5px;margin-top:6px">
      ${tel?`<button class="icon-btn btn-sm" style="flex:1" onclick="window.open('https://wa.me/${tel}','_blank')">WhatsApp</button>`:''}
      <button class="icon-btn btn-sm" style="flex:1" onclick="openEditarPaciente('${p.id}')">Editar</button>
      <button class="icon-btn btn-sm" style="color:var(--red)" onclick="confirmarEliminarPaciente('${p.id}','${p.name}')">✕</button>
    </div>
  </div>`;
}
function cambiarEtapa(id,nueva){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return;
  p.etapa=nueva;syncToSheet('Pacientes',STATE.patients);
  showToast(`${p.name} → ${etapaLabel(nueva)}`);
  if(STATE.view==='pacientes')renderPacientes();
}

function openNewPatient(etapaInicial='paciente'){
  const esLead=etapaInicial==='lead';
  openModal(`<div class="modal-title">${esLead?'Nuevo lead':'Nuevo paciente'}</div>

function guardarEdicionPaciente(id){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return;
  const nuevoNombre=$('ep-nombre').value.trim();
  if(!nuevoNombre){showToast('El nombre no puede quedar vacío');return;}

  p.name=nuevoNombre;p.cedula=$('ep-cedula').value.trim();p.phone=$('ep-phone').value;p.email=$('ep-email').value;p.dob=$('ep-dob').value;p.tags=[$('ep-tag').value];
  closeModal();showToast('Paciente actualizado');

  let cc=0;citasP.forEach(a=>{if(a.patient!==p.name||a.patientId!==p.id){a.patient=p.name;a.patientId=p.id;cc++;}});

function eliminarPaciente(id){
  const pac=STATE.patients.find(p=>p.id===id);
  const idsCitas=new Set(citasDePaciente(pac).map(a=>a.id));
  STATE.patients=STATE.patients.filter(p=>p.id!==id);
  if(idsCitas.size){STATE.appointments=STATE.appointments.filter(a=>!idsCitas.has(a.id));syncToSheet('Citas',STATE.appointments,{maxBorrados:idsCitas.size});}
  borrarFotosDePaciente(id);

// ── LÍNEA DE TIEMPO UNIFICADA (agrega citas + consultas + consentimientos + pagos, sin duplicar datos) ──
function buildHCTimeline(id,hc){
  const p=STATE.patients.find(x=>x.id===id);if(!p)return'';
  const eventos=[];
  citasDePaciente(p).forEach(a=>{
    eventos.push({fecha:a.fecha,time:a.time||'00:00',tipo:'cita',icono:'',clase:'cita',
      titulo:a.proc,sub:`Cita · ${a.time} · ${statusMap[a.status]?statusMap[a.status].label:a.status}`});
  });
  (hc.consultas||[]).forEach(c=>{
    const prods=(c.productos||[]).filter(pr=>pr.prod).map(pr=>`${pr.prod} ${pr.dosis||''} (${pr.lote||'sin lote'})`).join(', ');
    eventos.push({fecha:c.fecha,time:'12:00',tipo:'consulta',icono:'',clase:'consulta',
      titulo:c.proc,sub:`Consulta con ${c.doc}${prods?' · '+prods:''}${(c.fotos||[]).length?` · ${c.fotos.length} foto${c.fotos.length>1?'s':''}`:''}${c.nota?' · "'+c.nota.slice(0,60)+(c.nota.length>60?'…':'')+'"':''}`});
  });
  (hc.consentimientos||[]).filter(c=>c.firmado&&c.fecha).forEach(c=>{
    eventos.push({fecha:c.fecha,time:'12:00',tipo:'consentimiento',icono:'✓',clase:'consentimiento',
      titulo:c.nombre,sub:'Consentimiento firmado'});
  });
  STATE.movimientos.filter(m=>m.tipo==='ingreso'&&(m.patientId===id||(m.desc&&m.desc.includes(p.name)))).forEach(m=>{
    eventos.push({fecha:m.fecha,time:'12:00',tipo:'pago',icono:'',clase:'pago',
      titulo:m.moneda==='BS'?Number(m.monto).toFixed(2)+' Bs':fmtUSD(Number(m.monto)),sub:`Pago registrado · ${m.metodo||''}`});
  });
  eventos.sort((a,b)=>(b.fecha+b.time).localeCompare(a.fecha+a.time));
  const pendConsent=(hc.consentimientos||[]).filter(c=>!c.firmado).length;
  if(!eventos.length)return`<div class="hc-section" style="text-align:center;padding:28px;color:var(--text3)">Sin actividad registrada todavía.<br><button class="btn btn-gold btn-sm" style="margin-top:10px" onclick="openNewConsulta('${id}')">+ Primera consulta</button></div>`;
  return`<div class="hc-section">
    ${pendConsent?`<div class="alert-banner" style="background:rgba(198,160,90,.12);border-color:var(--border2);color:var(--gold3)"><span class="alert-banner-icon"></span><div>${pendConsent} consentimiento${pendConsent>1?'s':''} pendiente${pendConsent>1?'s':''} de firma — <span style="text-decoration:underline;cursor:pointer" onclick="switchHCTab('consentimientos')">ver</span></div></div>`:''}
    <div class="tl-wrap">
      ${eventos.map(e=>`<div class="tl-item">
        <div class="tl-dot ${e.clase}"></div>
        <div class="tl-date">${fmtDateVET(e.fecha)}</div>
        <div class="tl-title">${e.icono} ${e.titulo}</div>
        <div class="tl-sub">${e.sub}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

let consultaFotosTemp=[];
function comprimirImagen(file,maxWidth,calidad){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxWidth/img.width);
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',calidad));
      };
      img.onerror=()=>reject(new Error('No se pudo leer la imagen'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
